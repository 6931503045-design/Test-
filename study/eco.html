<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Economics</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: tabbed study sheet (cards / summary / practice) in one centred column. */
:root{
  --paper:#f6f3ec; --surface:#ffffff; --ink:#1a2320; --muted:#5b6a64; --line:#d3dcd7;
  --accent:#b0602a; --accent-soft:#f2e1d2; --known:#e6f2d5; --ok:#1c7c4a; --ok-soft:#e2f3e9; --bad:#b3261e; --bad-soft:#fbe6e4;
  --ui:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12171a; --surface:#1b2226; --ink:#e7eeea; --muted:#9db0a8; --line:#2d3a40;
  --accent:#e8a574; --accent-soft:#3b2a1d; --known:#26331c; --ok:#62d394; --ok-soft:#15301f; --bad:#ff8a80; --bad-soft:#3b1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12171a; --surface:#1b2226; --ink:#e7eeea; --muted:#9db0a8; --line:#2d3a40;
  --accent:#e8a574; --accent-soft:#3b2a1d; --known:#26331c; --ok:#62d394; --ok-soft:#15301f; --bad:#ff8a80; --bad-soft:#3b1c1a; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16.5px;line-height:1.65}
.wrap{max-width:800px;margin:0 auto;padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:clamp(26px,6vw,36px);line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
header span{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:14.5px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{font-family:var(--mono);font-size:11.5px;opacity:.75;margin-left:5px}
.controls{justify-content:space-between;margin:12px 0 16px}
.count{color:var(--muted);font-size:14px;font-family:var(--mono)}
.stage{perspective:1400px}
.card{position:relative;width:100%;height:clamp(300px,64vw,380px);cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);border-radius:10px}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 22px 30px;text-align:center;overflow:auto}
.back{transform:rotateY(180deg)}
.card.is-known .face{background:var(--known)}
.cat-tag{position:absolute;top:10px;left:14px;font-size:12.5px;color:var(--muted)}
.hint{position:absolute;bottom:10px;left:0;right:0;font-size:12.5px;color:var(--muted)}
.front-t.big{font-size:clamp(40px,11vw,60px);line-height:1.2}
.front-t{font-size:clamp(21px,5vw,28px);font-weight:700;line-height:1.4;text-wrap:balance}
.back-t{font-size:clamp(17px,4vw,21px);line-height:1.7;max-width:34em}
.back-t b{color:var(--accent)}
.nav{justify-content:center;margin-top:16px;gap:10px}
.btn{font:inherit;font-weight:500;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 18px;cursor:pointer;min-width:46px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.know[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.ref{position:absolute;bottom:10px;left:0;right:0;font:500 12px var(--mono);color:var(--accent)}
.btn.no{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.btn.yes{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.sync{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:10px;background:var(--accent-soft);margin-top:16px}
.sync p{margin:0;font-size:15px}.sync .ok{color:var(--ok)}.sync .err{color:var(--bad)}
.srs{gap:14px;font:600 14px var(--mono);margin:4px 0 12px}
.srs .n{color:#2f6fd0}.srs .l{color:var(--bad)}.srs .d{color:var(--ok)}
.srs b{font-size:18px;margin-right:3px}
.rate4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rate4 .btn{display:flex;flex-direction:column;gap:2px;padding:9px 4px;min-width:0;font-size:15px}
.rate4 .btn small{font:500 12px var(--mono);opacity:.85}
.rate4 .r1{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.rate4 .r2{border-color:var(--line);color:var(--ink)}
.rate4 .r3{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.rate4 .r4{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.show{display:none!important;width:100%;margin-top:16px;padding:13px}
.typebox{margin-top:14px}.typebox input{flex:1;min-width:0;font:inherit;font-size:18px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.typebox input:focus{outline:3px solid var(--accent);outline-offset:1px}
.typebox p{margin:8px 0 0;font-size:16px;min-height:1.5em}.typebox .okk{color:var(--ok);font-weight:600}.typebox .nok{color:var(--bad);font-weight:600}
.rate4 .btn.sug{box-shadow:0 0 0 3px var(--accent)}
.keys{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
/* summary */
.sec{margin:0 0 26px}
.sec h2{font-size:20px;margin:0 0 8px;padding-left:12px;border-left:4px solid var(--accent);line-height:1.4}
.sec .chtag{font-family:var(--mono);font-size:12px;color:var(--accent);display:block}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;min-width:100%;background:var(--surface);font-size:15.5px}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top;line-height:1.6}
th{background:var(--accent-soft);font-weight:700;white-space:nowrap}
td:first-child{font-weight:500;min-width:7.5em}
.tip{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:15px}
/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.qbar{height:4px;background:var(--line);border-radius:2px;margin-bottom:14px}
.qbar i{display:block;height:100%;background:var(--accent);width:0;border-radius:2px;transition:width .25s}
.qmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:8px}
.qmeta b{font-family:var(--mono);color:var(--ink)}
.qtext{font-size:18px;font-weight:500;margin:0 0 14px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted);min-width:16px;padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.6}
.explain{margin-top:14px;border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15.5px}
.explain.good{border-left-color:var(--ok)} .explain.bad{border-left-color:var(--bad)}
.explain b.v{display:block;margin-bottom:2px}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.score .big{font-family:var(--mono);font-size:30px;font-weight:600}
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}
.cell{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:5px;font:500 11px var(--mono);color:var(--muted);cursor:pointer;padding:0}
.cell.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.cell.no{background:var(--bad);border-color:var(--bad);color:#fff}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.card,.qbar i{transition:none}}
</style>
<div class="wrap">
  <header><h1>Economics</h1><span>สรุป · แฟลชการ์ด · แบบฝึก — Micro (002–003) + Macro</span></header>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="cards">แฟลชการ์ด</button>
    <button role="tab" aria-selected="false" data-tab="sum">สรุปบทเรียน</button>
    <button role="tab" aria-selected="false" data-tab="prac">แบบฝึก</button>
  </nav>
  <section id="tab-cards">
    <div class="row" id="cats"></div>
    <div class="row controls">
      <div class="row">
        <button class="chip" id="dirBtn" aria-pressed="false" type="button">ด้านหน้า: หัวข้อ</button>
        <button class="chip" id="typBtn" type="button" hidden>พิมพ์ตอบ: เปิด</button>
        <button class="chip" id="limBtn" type="button">การ์ดใหม่/วัน: 20</button>
        <button class="chip" id="resetSrs" type="button">ล้างความคืบหน้า</button>
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="row srs" id="srsCounts"></div>
    <div class="stage" id="stage"></div>
    <div id="typeBox" class="typebox" hidden>
      <div class="row"><input id="typeIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="พิมพ์คำตอบ แล้วกด Enter"><button class="btn primary" id="typeGo" type="button">ตรวจ</button></div>
      <p id="typeRes" role="status"></p>
    </div>
    <button class="btn primary show" id="showBtn" type="button" hidden>แสดงคำตอบ</button>
    <div class="rate4" id="rate4" hidden>
      <button class="btn r1" data-r="1" type="button">ลืม<small></small></button>
      <button class="btn r2" data-r="2" type="button">ยาก<small></small></button>
      <button class="btn r3" data-r="3" type="button">ปกติ<small></small></button>
      <button class="btn r4" data-r="4" type="button">ง่าย<small></small></button>
    </div>
    <p class="keys">แตะการ์ดหรือกด Space = พลิก · 1 ลืม · 2 ยาก · 3 ปกติ · 4 ง่าย</p>
    <div class="sync" id="sync" hidden><p id="syncText"></p><button class="btn yes" id="syncBtn" type="button">บันทึกผลลง Notion</button><p id="syncMsg" role="status"></p></div>
  </section>
  <section id="tab-sum" hidden>
    <div class="row" id="sumCats" style="margin-bottom:18px"></div>
    <div id="sumBody"></div>
  </section>
  <section id="tab-prac" hidden>
    <div class="row" id="qCats" style="margin-bottom:14px"></div>
    <div id="qBody"></div>
  </section>
</div>

าณ ไม่ใช่คุณภาพ", "GDP", "m1-15"], ["g", "ตัววัดทางเลือกแทน GDP?", "MEW · GPI · HDI · HPI", "GDP", "m1-16"], ["g", "Nominal GDP กับ Real GDP ต่างกันอย่างไร?", "Nominal = ใช้ราคาของปีที่ผลิต\nReal = ใช้ราคาของปีฐาน", "GDP", "m1-17"], ["g", "ปี 2017: Hot dog $2×150, Hamburger $3×100; ปีฐาน 2016 ราคา $1 และ $2 → Nominal กับ Real GDP?", "Nominal = 300 + 300 = 600\nReal = (1×150) + (2×100) = 350", "GDP slides", "m1-18"], ["g", "GDP chain price index (Deflator) และสูตร Real GDP?", "ดัชนีเทียบราคาสินค้าขั้นสุดท้ายทั้งหมดกับปีฐาน\nReal GDP = Nominal GDP ÷ GDP chain price index × 100", "GDP", "m1-19"], ["g", "GDP กับ GNP ต่างกันอย่างไร?", "GDP = ผลผลิตภายในประเทศ\nGNP = รายได้รวมของผู้อยู่อาศัยถาวรของประเทศ: รวมรายได้ที่พลเมืองหาได้ในต่างประเทศ ไม่รวมรายได้ที่คนต่างชาติหาได้ในประเทศ", "GDP", "m1-20"], ["i", "Inflation กับ Deflation คืออะไร?", "Inflation = ระดับราคาเฉลี่ยของสินค้าและบริการโดยรวมเพิ่มขึ้น\nDeflation = ระดับราคาเฉลี่ยลดลง", "Inflation", "m3-1"], ["i", "ราคาสินค้าชนิดเดียวขึ้น เป็น Inflation ไหม?", "ไม่ใช่ เป็น Relative price change\nถ้าราคาส่วนใหญ่ขึ้นจึงเป็น Inflation", "Inflation", "m3-2"], ["i", "CPI คืออะไร?", "ดัชนีวัดการเปลี่ยนแปลงราคาเฉลี่ยของสินค้าและบริการเพื่อการบริโภค (ตะกร้าของครอบครัวในเมืองทั่วไป)", "Inflation", "m3-3"], ["i", "CPI ต่างจาก GDP Deflator อย่างไร?", "CPI = เฉพาะสินค้าที่ผู้บริโภคซื้อ (ค่าครองชีพ)\nGDP Deflator = สินค้าและบริการทั้งหมดที่ผลิตในประเทศ รวมการลงทุนและรายจ่ายรัฐ", "Inflation", "m3-4"], ["i", "สูตร CPI?", "(ต้นทุนตะกร้า ณ ราคาปีปัจจุบัน ÷ ต้นทุนตะกร้าเดียวกัน ณ ราคาปีฐาน) × 100", "Inflation", "m3-5"], ["i", "ตะกร้าปีฐาน 245 ปี 2000 = 335 → CPI?", "335 ÷ 245 × 100 = 136.7", "Exhibit 2", "m3-6"], ["i", "ทำไม CPI ปีฐานเท่ากับ 100 เสมอ?", "เพราะตัวเศษและตัวส่วนเท่ากันในปีฐาน", "Inflation", "m3-7"], ["i", "อัตราเงินเฟ้อคำนวณอย่างไร?", "(CPI ปีนี้ − CPI ปีก่อน) ÷ CPI ปีก่อน × 100", "Inflation", "m3-8"], ["i", "ข้อวิจารณ์ CPI 3 ข้อ?", "1) ตะกร้าอาจไม่ตรงกับทุกกลุ่ม 2) ปรับตามคุณภาพสินค้ายาก 3) ไม่สะท้อนการเปลี่ยนความสำคัญของสินค้า (Substitution)", "Inflation", "m3-9"], ["i", "CPI อาจสูงหรือต่ำเกินจริงกับบางกลุ่มอย่างไร?", "สูงเกิน: นักศึกษาแทบไม่จ่ายค่ารักษา แต่ค่ารักษาขึ้นมาก\nต่ำเกิน: คนเช่าห้องในเมืองจ่ายค่าเช่าสัดส่วนสูง", "Inflation", "m3-10"], ["i", "ปัญหาคุณภาพสินค้าทำให้ CPI เป็นอย่างไร?", "มือถือ 10,000 → 15,000 แต่สเปกดีขึ้น CPI อาจนับเป็นราคาเพิ่มทั้งหมด → CPI สูงเกินจริง", "Inflation", "m3-11"], ["i", "Substitution problem คืออะไร?", "หมูแพงขึ้น คนเปลี่ยนไปกินไก่ แต่ CPI ตะกร้าคงที่ยังนับหมูเท่าเดิม → CPI สูงเกินจริง", "Inflation", "m3-12"], ["i", "Inflation กระทบมาตรฐานการครองชีพอย่างไร?", "กำลังซื้อของเงินลดลง — รายได้ 10,000 ข้าว 50 → ซื้อได้ 200 กก. ข้าวขึ้นเป็น 100 → ซื้อได้ 100 กก.", "Inflation", "m3-13"], ["i", "Nominal income กับ Real income ต่างกันอย่างไร?", "Nominal = จำนวนเงินที่ได้รับจริง\nReal = Nominal income ÷ (CPI/100)", "Inflation", "m3-14"], ["i", "รายได้ขึ้น 5% เงินเฟ้อ 3% กำลังซื้อเป็นอย่างไร?", "10,500 ÷ 10,300 ≈ 1.02 ตะกร้า → กำลังซื้อเพิ่ม\n(ถ้ารายได้ขึ้นช้ากว่าเงินเฟ้อ กำลังซื้อลด)", "Inflation", "m3-15"], ["i", "Inflation กระทบ Wealth อย่างไร?", "คนมีสินทรัพย์ (บ้าน ทอง ที่ดิน หุ้น) มักได้ประโยชน์\nคนไม่มีสินทรัพย์ซื้อได้ยากขึ้น เสียเปรียบ", "Inflation", "m3-16"], ["i", "Hyperinflation คืออะไร ตัวอย่าง?", "ระดับราคาเพิ่มเร็วมาก\nZimbabwe พ.ย. 2008: ราคาเพิ่มเท่าตัวทุก ~24.7 ชั่วโมง", "Inflation", "m3-17"], ["i", "ผลของ Hyperinflation 4 ข้อ?", "Inflation psychosis (รีบใช้เงิน) · ตลาดสินเชื่อล่ม · Speculation (ทองคำ เงินตราต่างประเทศ สินค้าเก็บได้) · Wage-price spiral", "Inflation", "m3-18"], ["i", "Wage-price spiral คืออะไร?", "ราคาขึ้น → แรงงานขอค่าจ้างเพิ่ม → ต้นทุนธุรกิจเพิ่ม → ขึ้นราคาอีก → วนซ้ำที่ระดับเงินเฟ้อสูงขึ้น", "Inflation", "m3-19"], ["i", "Demand-pull inflation คืออะไร เกิดเมื่อไร?", "รายจ่ายรวมมากเกินไปจนดันราคา\nเกิดที่หรือใกล้ Full employment (โรงงานผลิตเต็มกำลัง)", "Inflation", "m3-20"], ["i", "Cost-push inflation คืออะไร ตัวอย่าง?", "ต้นทุนการผลิตเพิ่ม (ค่าจ้าง น้ำมัน วัตถุดิบ) → ธุรกิจขึ้นราคา\nเช่น สงครามอิหร่านกระทบช่องแคบฮอร์มุซ → น้ำมันแพง", "Inflation", "m3-21"], ["i", "Expectations ทำให้เกิดเงินเฟ้อทั้ง 2 แบบอย่างไร?", "ผู้ซื้อคาดว่าราคาจะขึ้น → รีบซื้อ → Demand-pull\nบริษัทคาดว่าต้นทุนจะขึ้น → ขึ้นราคาล่วงหน้า → Cost-push", "Inflation", "m3-22"], ["b", "Business cycle คืออะไร?", "การสลับกันของช่วงเศรษฐกิจขยายตัวและหดตัว วัดจากการเปลี่ยนแปลงของ Real GDP", "Business Cycle", "m2-1"], ["b", "4 ช่วงของ Business cycle?", "Peak → Recession → Trough → Recovery (Expansion)", "Business Cycle", "m2-2"], ["b", "Peak กับ Trough คืออะไร?", "Peak = Real GDP สูงสุดหลังช่วงฟื้นตัว\nTrough = Real GDP ต่ำสุดหลังช่วงถดถอย", "Business Cycle", "m2-3"], ["b", "Recession คืออะไร และกฎทั่วไปคือ?", "ช่วงขาลง Real GDP ลด อัตราว่างงานเพิ่ม (Contraction)\nกฎทั่วไป: Real GDP ลดติดต่อกันอย่างน้อย 2 ไตรมาส (6 เดือน)", "Business Cycle", "m2-4"], ["b", "Expansion และ Economic growth คืออะไร?", "Expansion = ช่วงขาขึ้นที่ Real GDP เพิ่ม (Recovery)\nEconomic growth = % เพิ่มขึ้นต่อปีของ Real GDP", "Business Cycle", "m2-5"], ["b", "อะไรเป็นสาเหตุของ Business cycle?", "การเปลี่ยนแปลงของรายจ่ายรวม: Real GDP = C + I + G + (X − M)", "Business Cycle", "m2-6"], ["b", "ช่วงขยายตัว รายจ่ายรวมเปลี่ยนอย่างไร?", "C เพิ่ม · I ในโรงงาน/เครื่องจักรเพิ่ม · G เพิ่ม · X เพิ่ม หรือ M ลด\n(ช่วงถดถอยกลับทิศทั้งหมด)", "Business Cycle", "m2-7"], ["b", "Unemployment rate คืออะไร คำนวณอย่างไร?", "% ของ Civilian labor force ที่ไม่มีงานและกำลังหางาน\n= Unemployed ÷ Civilian labor force × 100", "Business Cycle", "m2-8"], ["b", "ใครนับเป็น Employed และ Unemployed?", "Employed: ทำงานได้ค่าจ้าง ≥ 1 ชม./สัปดาห์ หรือไม่ได้ค่าจ้างในธุรกิจครอบครัว ≥ 15 ชม./สัปดาห์\nUnemployed: ไม่มีงาน แต่หางานในเดือนที่ผ่านมา", "Business Cycle", "m2-9"], ["b", "Civilian labor force คืออะไร?", "คนอายุ 16+ ที่มีงานทำหรือกำลังหางาน\nไม่รวมทหาร แม่บ้าน Discouraged workers และคนนอกกำลังแรงงาน", "Business Cycle", "m2-10"], ["b", "ปี 2016: Labor force 159.1 ล้าน ว่างงาน 7.769 ล้าน → อัตราว่างงาน?", "7.769 ÷ 159.1 × 100 ≈ 4.9%", "Exhibit 6", "m2-11"], ["b", "ข้อวิจารณ์อัตราว่างงาน 4 ข้อ?", "ผู้ตอบแบบสำรวจอาจตอบเท็จว่าหางาน · ไม่นับ Discouraged workers · นับคน Part-time เป็นมีงานเต็ม · ไม่วัด Underemployment", "Business Cycle", "m2-12"], ["b", "Discouraged worker คือใคร?", "คนที่อยากทำงานแต่เลิกหางาน เพราะคิดว่าจะไม่มีใครรับ", "Business Cycle", "m2-13"], ["b", "Frictional unemployment คืออะไร สาเหตุ?", "ว่างงานชั่วคราวช่วงย้ายงาน/เข้า/กลับเข้าตลาดแรงงาน (คนมีทักษะ)\nสาเหตุ: เวลาเปลี่ยนงาน + ขาดข้อมูลจับคู่คนกับงาน", "Business Cycle", "m2-14"], ["b", "Structural unemployment คืออะไร สาเหตุ 4 ข้อ?", "ทักษะคนว่างงานไม่ตรงกับงานที่มี\nสาเหตุ: ขาดการศึกษา · ความต้องการผู้บริโภคเปลี่ยน · เทคโนโลยี · โลกาภิวัตน์", "Business Cycle", "m2-15"], ["b", "Outsourcing กับ Offshoring ต่างกันอย่างไร?", "Outsourcing = ให้บริษัทอื่นในต่างประเทศทำงาน\nOffshoring = ให้พนักงานของบริษัทเองที่อยู่ต่างประเทศทำ", "Business Cycle", "m2-16"], ["b", "Cyclical unemployment คืออะไร?", "ว่างงานเพราะขาดตำแหน่งงานในช่วง Recession", "Business Cycle", "m2-17"], ["b", "Full employment (Natural rate) คืออะไร เท่าไร?", "อัตราว่างงาน = Frictional + Structural\nฉันทามติ ≈ 5% (Frictional 3% + Structural 2%)", "Business Cycle", "m2-18"], ["b", "ผลกระทบที่ไม่ใช่ตัวเงินของการว่างงาน?", "รู้สึกไร้ค่า · ภาพลักษณ์ตนเองต่ำ · สิ้นหวัง · ครอบครัวแตกแยก · ความไม่สงบทางการเมือง", "Business Cycle", "m2-19"], ["a", "Aggregate demand curve (AD) คืออะไร?", "เส้นแสดงระดับ Real GDP ที่ครัวเรือน ธุรกิจ รัฐ และต่างประเทศซื้อ ณ ระดับราคาต่าง ๆ (ceteris paribus)", "AD–AS", "m4-1"], ["a", "แกนของแบบจำลอง AD–AS ต่างจาก Demand–Supply ตลาดอย่างไร?", "แกนนอน = มูลค่า Real GDP (ไม่ใช่หน่วยสินค้า)\nแกนตั้ง = ดัชนีระดับราคา (CPI) ไม่ใช่ราคาสินค้าชิ้นเดียว", "AD–AS", "m4-2"], ["a", "ระดับราคาลดลงส่งผลอย่างไรบน AD?", "Real GDP ที่ต้องการเพิ่มขึ้น (เคลื่อนที่ลงตามเส้น)\nAD ไม่ใช่แนวคิดเดียวกับ Demand ของสินค้าเดียว", "AD–AS", "m4-3"], ["a", "Nonprice-level determinants ของ AD?", "C · I · G · (X − M) — เปลี่ยนตัวใดตัวหนึ่ง AD เลื่อนทั้งเส้น", "AD–AS", "m4-4"], ["a", "Aggregate supply curve (AS) คืออะไร?", "เส้นแสดงระดับ Real GDP ที่ผลิต ณ ระดับราคาต่าง ๆ (ceteris paribus)", "AD–AS", "m4-5"], ["a", "มุมมอง Keynesian ต่อ AS?", "AS แนวนอน ราคาและค่าจ้างไม่ยืดหยุ่นช่วงถดถอย\nรัฐต้องเพิ่ม AD เพื่อกลับสู่ Full employment\n“Demand creates its own supply”", "AD–AS", "m4-6"], ["a", "มุมมอง Classical ต่อ AS?", "AS แนวตั้งที่ Full-employment GDP ราคาและค่าจ้างยืดหยุ่นเต็มที่ เศรษฐกิจฟื้นเอง\nAD เปลี่ยน → แค่ระดับราคาเปลี่ยน\n“Supply creates its own demand”", "AD–AS", "m4-7"], ["a", "ทำไม Keynesian ไม่ยอมรับ Classical ในช่วงถดถอย?", "เพราะช่วงถดถอยราคาและค่าจ้างไม่ปรับลดลงเพื่อดึงเศรษฐกิจกลับสู่ Full employment", "AD–AS", "m4-8"], ["a", "AS มี 3 ช่วงอะไร?", "Keynesian range (แนวนอน ถดถอยรุนแรง) · Intermediate range (ชันขึ้น ใกล้ Full employment) · Classical range (แนวตั้ง ที่ Full employment)", "AD–AS", "m4-9"], ["a", "AD เพิ่มในแต่ละช่วงของ AS ให้ผลอย่างไร?", "Keynesian: ราคาคงที่ Real GDP เพิ่ม\nIntermediate: ราคาและ Real GDP เพิ่มทั้งคู่\nClassical: เกิดแค่เงินเฟ้อ", "AD–AS", "m4-10"], ["a", "Macroeconomic equilibrium อยู่ที่ไหน?", "จุดตัดของ AD กับ AS", "AD–AS", "m4-11"], ["a", "Nonprice-level determinants ของ AS?", "Resource prices (ในประเทศ/นำเข้า) · Technological change · Taxes · Subsidies · Regulations — ทุกตัวกระทบต้นทุนการผลิต", "AD–AS", "m4-12"], ["a", "ต้นทุนการผลิตเปลี่ยน AS เลื่อนอย่างไร?", "ต้นทุนลด → AS เลื่อนขวา\nต้นทุนเพิ่ม → AS เลื่อนซ้าย", "AD–AS", "m4-13"], ["a", "ตัวอย่างที่ทำให้ AS เลื่อนขวา?", "น้ำมันถูกลง · ผู้ประกอบการมากขึ้น · ภาษีลด · กฎระเบียบน้อยลง", "AD–AS", "m4-14"], ["a", "ตัวอย่างที่ทำให้ AS เลื่อนซ้าย?", "ค่าจ้างขึ้นเกินคาด · ภาษีสิ่งแวดล้อมสูงขึ้น · กฎระเบียบมากขึ้น · เบี้ยประกันสุขภาพสูงขึ้น", "AD–AS", "m4-15"], ["a", "AD และ AS เพิ่มพร้อมกัน (Exhibit 12)?", "Real GDP เพิ่ม และในตัวอย่างสไลด์ระดับราคาเพิ่ม\n(โดยทั่วไปทิศทางราคาขึ้นกับว่าเส้นไหนเลื่อนมากกว่า)", "AD–AS", "m4-16"], ["a", "Cost-push กับ Demand-pull inflation ในแบบ AD–AS?", "Cost-push = AS เลื่อนซ้าย (เช่น น้ำมันแพง)\nDemand-pull = AD เลื่อนขวา (เช่น รัฐใช้จ่ายสงครามเวียดนาม)", "AD–AS", "m4-1 function errText(e,writing){

async function fetchRows(view){

const EMBQ=[{"url": "https://app.notion.com/p/410f02984125810a97f7c93901e54c24", "Question": "นักเศรษฐศาสตร์สำนักคลาสสิกมองภาวะเศรษฐกิจถดถอยอย่างไร?", "Correct": "แก้ไขได้เอง เพราะราคาและค่าจ้างยืดหยุ่น รัฐไม่ต้องแทรกแซง", "Wrong 1": "รัฐต้องเพิ่มการใช้จ่ายเพื่อเพิ่ม AD เพราะราคาและค่าจ้างไม่ยืดหยุ่น", "Wrong 2": "เศรษฐกิจจะติดอยู่ในภาวะถดถอยถาวรเพราะ AS เป็นเส้นแนวนอน", "Wrong 3": "ค่าจ้างจะเพิ่มขึ้นจนเกิดการจ้างงานเต็มที่", "Explanation": "สำนักคลาสสิกเชื่อว่าราคาและค่าจ้างยืดหยุ่นสมบูรณ์ เมื่อเกิดการว่างงาน ค่าจ้างและราคาจะลดลงจนเศรษฐกิจกลับสู่ full employment เอง ส่วนการให้รัฐเพิ่ม AD เป็นแนวคิด Keynesian (สไลด์ Aggregate Demand and Aggregate Supply หัวข้อ What do the classical economists believe?)", "Chapter": "Macro · AD–AS", "Subject": "Economics", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f029841258110a116d5f4774348ef", "Question": "ข้อใดไม่ใช่ตัวชี้วัดคุณภาพชีวิต (quality-of-life measures) ที่สไลด์ยกมา?", "Correct": "อัตราเงินเฟ้อ", "Wrong 1": "อายุขัยเฉลี่ยเมื่อแรกเกิด", "Wrong 2": "อัตราการตายของทารก", "Wrong 3": "อัตราการรู้หนังสือ", "Explanation": "ตัวชี้วัดคุณภาพชีวิตที่สไลด์ยกมาคือ อายุขัยเมื่อแรกเกิด, อัตราการตายของทารก, อัตราการรู้หนังสือ, การใช้ไฟฟ้าต่อหัว และอันดับเสรีภาพทางเศรษฐกิจ ไม่มีอัตราเงินเฟ้อ (สไลด์ Growth and Development หัวข้อ other quality-of-life measures และ Exhibit 3)", "Chapter": "Macro · Growth & Development", "Subject": "Economics", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f02984125811a9d47f481f26d58f0", "Question": "เหตุการณ์ใดทำให้เส้น AS เลื่อนไปทางขวา?", "Correct": "ราคาน้ำมันลดลง", "Wrong 1": "ค่าจ้างเพิ่มขึ้นมากกว่าที่คาด", "Wrong 2": "รัฐเพิ่มกฎระเบียบกับธุรกิจ", "Wrong 3": "เบี้ยประกันสุขภาพสูงขึ้น", "Explanation": "ต้นทุนการผลิตที่ลดลง เช่น ราคาน้ำมันลด ทำให้ AS เลื่อนขวา ส่วนค่าจ้างที่เพิ่มเกินคาด กฎระเบียบที่มากขึ้น และเบี้ยประกันสุขภาพที่สูงขึ้น ทำให้ AS เลื่อนซ้าย (สไลด์ Aggregate Demand and Aggregate Supply หัวข้อ conditions that shift AS rightward/leftward)", "Chapter": "Macro · AD–AS", "Subject": "Economics", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f02984125813ea531e699051c8e83", "Question": "ประเทศ Beta เลือกผลิตสินค้าทุนมากขึ้นและยอมบริโภคน้อยลงในปัจจุบัน เมื่อเทียบกับประเทศ Alpha ที่ลงทุนน้อย สไลด์คาดว่า Beta จะเป็นอย่างไรในอนาคต?", "Correct": "เส้น PPC เลื่อนออกได้มากกว่า จึงเติบโตได้เร็วกว่า", "Wrong 1": "เส้น PPC เลื่อนเข้า เพราะบริโภคน้อยลง", "Wrong 2": "เส้น PPC เท่าเดิม เพราะทรัพยากรรวมไม่เปลี่ยน", "Wrong 3": "บริโภคได้มากกว่า Alpha ตั้งแต่ปัจจุบัน", "Explanation": "การลงทุนในสินค้าทุนมากขึ้นทำให้กำลังการผลิตในอนาคตเพิ่มขึ้น PPC ของ Beta ปี 2018 จึงเลื่อนออกจากปี 1990 มากกว่า Alpha ที่เส้นแทบไม่เปลี่ยน (สไลด์ Growth and Development หัวข้อ Exhibit 5 Alpha's and Beta's PPC)", "Chapter": "Macro · Growth & Development", "Subject": "Economics", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f029841258148a7e5f5d26ca4f20c", "Question": "แนวคิด \"demand creates its own supply\" เป็นของสำนักใด และเส้น AS ตามสำนักนั้นมีลักษณะอย่างไร?", "Correct": "Keynesian · AS เป็นเส้นแนวนอน", "Wrong 1": "Classical · AS เป็นเส้นแนวตั้ง", "Wrong 2": "Classical · AS เป็นเส้นแนวนอน", "Wrong 3": "Keynesian · AS เป็นเส้นแนวตั้ง", "Explanation": "Keynesian มองว่าราคาและค่าจ้างคงที่ AS จึงเป็นเส้นแนวนอน เมื่ออุปสงค์เพิ่ม ผู้ผลิตจะผลิตเพิ่ม (demand creates its own supply) ส่วนคลาสสิกใช้คำว่า supply creates its own demand และ AS เป็นเส้นแนวตั้ง (สไลด์ Aggregate Demand and Aggregate Supply หัวข้อ Keynesian view และ classical view)", "Chapter": "Macro · AD–AS", "Subject": "Economics", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f029841258149a1a9dd738318452e", "Question": "ในแบบจำลอง AD–AS แกนตั้งวัดอะไร?", "Correct": "ดัชนีระดับราคาโดยรวม เช่น CPI", "Wrong 1": "ราคาต่อหน่วยของสินค้าชนิดใดชนิดหนึ่ง", "Wrong 2": "มูลค่า Real GDP", "Wrong 3": "ปริมาณสินค้าเป็นหน่วยกายภาพ", "Explanation": "แกนตั้งของ AD–AS คือดัชนีระดับราคาโดยรวม (CPI) ไม่ใช่ราคาสินค้าชนิดเดียว ส่วนแกนนอนคือ Real GDP (สไลด์ Aggregate Demand and Aggregate Supply หัวข้อ vertical axis และ Exhibit 1)", "Chapter": "Macro · AD–AS", "Subject": "Economics", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f02984125816180d1f21ee4568fe5", "Question": "ข้อใดเป็นข้อจำกัดของการเปรียบเทียบ GDP per capita ระหว่างประเทศร่ำรวยกับประเทศยากจน ตามสไลด์?", "Correct": "GDP per capita ไม่สะท้อนการกระจายรายได้", "Wrong 1": "ตัวเลข GDP ของ LDCs แม่นยำกว่าของประเทศร่ำรวย", "Wrong 2": "อัตราแลกเปลี่ยนสะท้อนมูลค่าสินค้าที่ผลิตได้จริงเสมอ", "Wrong 3": "GDP per capita รวมคุณภาพชีวิตไว้ครบถ้วนแล้ว", "Explanation": "สไลด์ระบุปัญหา 3 ข้อ: ตัวเลขของ LDCs มีความคลาดเคลื่อนมากกว่า, GDP per capita ไม่วัดการกระจายรายได้, และอัตราแลกเปลี่ยนไม่สะท้อนมูลค่าสินค้าที่แท้จริง (สไลด์ Growth and Development หัวข้อ problems associated with using GDP per capita)", "Chapter": "Macro · Growth & Development", "Subject": "Economics", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f02984125816b8b0dcfb54aae1ac3", "Question": "ตามมุมมองคลาสสิก เศรษฐกิจอยู่ที่ full employment (Real GDP $16 ล้านล้าน ระดับราคา 300) ต่อมาครัวเรือนลดการบริโภคจน AD เลื่อนซ้าย หลังราคาและค่าจ้างปรับตัวเสร็จ เศรษฐกิจจะอยู่ที่ใด?", "Correct": "Real GDP $16 ล้านล้าน ระดับราคา 200", "Wrong 1": "Real GDP $12 ล้านล้าน ระดับราคา 300", "Wrong 2": "Real GDP $12 ล้านล้าน ระดับราคา 200", "Wrong 3": "Real GDP $20 ล้านล้าน ระดับราคา 300", "Explanation": "AS แบบคลาสสิกเป็นเส้นตั้งที่ full employment เมื่อ AD ลด สินค้าค้างสต็อกและการว่างงานทำให้ราคาและค่าจ้างลดจาก 300 เป็น 200 จนกลับสู่ full employment ที่ $16 ล้านล้าน การเปลี่ยน AD จึงกระทบแค่ระดับราคา (สไลด์ Aggregate Demand and Aggregate Supply หัวข้อ Exhibit 5 The Classical Vertical Aggregate Supply Curve)", "Chapter": "Macro · AD–AS", "Subject": "Economics", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f02984125818b881bd8190f26290a", "Question": "ประเทศหนึ่งมี GDP $480 พันล้าน และประชากร 60 ล้านคน GDP per capita เท่ากับเท่าใด?", "Correct": "$8,000", "Wrong 1": "$800", "Wrong 2": "$80,000", "Wrong 3": "$125", "Explanation": "GDP per capita = GDP ÷ ประชากร = $480,000,000,000 ÷ 60,000,000 = $8,000 ต้องระวังหน่วยพันล้านกับล้าน (สไลด์ Growth and Development หัวข้อ What is GDP per capita?)", "Chapter": "Macro · Growth & Development", "Subject": "Economics", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f029841258195a292ccc921688580", "Question": "ประเทศส่งออกน้ำมันที่มีรายได้สูง แต่ไม่มีการพัฒนาอุตสาหกรรมอย่างกว้างขวาง ตามสไลด์จัดอยู่ในกลุ่ม IACs หรือไม่?", "Correct": "ไม่จัดเป็น IAC เพราะไม่มีการพัฒนาอุตสาหกรรมอย่างกว้างขวาง", "Wrong 1": "จัดเป็น IAC เพราะ GDP per capita สูง", "Wrong 2": "จัดเป็น IAC เพราะมีทรัพยากรธรรมชาติมาก", "Wrong 3": "จัดเป็น IAC เมื่อส่งออกน้ำมันเกินครึ่งของ GDP", "Explanation": "IACs คือประเทศรายได้สูงที่มีทุนเทคโนโลยีสูงและแรงงานการศึกษาดี ประเทศอาหรับที่ร่ำรวยจากน้ำมันแต่ไม่มีการพัฒนาอุตสาหกรรมอย่างกว้างขวางจึงไม่ถูกนับเป็น IAC (สไลด์ Growth and Development หัวข้อ What countries are excluded from IACs?)", "Chapter": "Macro · Growth & Development", "Subject": "Economics", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f0298412581cda919d9a243912631", "Question": "เมื่อ AD เพิ่มขึ้นในช่วง intermediate range ของเส้น AS จะเกิดอะไรขึ้น?", "Correct": "ทั้งระดับราคาและ Real GDP เพิ่มขึ้น", "Wrong 1": "เฉพาะระดับราคาเพิ่มขึ้น Real GDP คงที่", "Wrong 2": "เฉพาะ Real GDP เพิ่มขึ้น ระดับราคาคงที่", "Wrong 3": "ทั้งระดับราคาและ Real GDP ลดลง", "Explanation": "ช่วง intermediate range คือช่วงที่เศรษฐกิจใกล้ full employment การเพิ่ม AD ทำให้ทั้งราคาและ Real GDP เพิ่มขึ้น ต่างจาก Keynesian range (ราคาคงที่) และ classical range (เกิดเงินเฟ้ออย่างเดียว) (สไลด์ Aggregate Demand and Aggregate Supply หัวข้อ increase in AD in the intermediate range)", "Chapter": "Macro · AD–AS", "Subject": "Economics", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f0298412581da8b13e22926782191", "Question": "รัฐบาลเพิ่มการใช้จ่ายจำนวนมากเพื่อทำสงคราม (เช่น สงครามเวียดนาม) ขณะที่เศรษฐกิจใกล้ full employment ผลที่เกิดขึ้นตามสไลด์คืออะไร?", "Correct": "AD
