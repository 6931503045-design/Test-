ใด ๆ อีกเลย", "Wrong 2": "ระบบอัตโนมัติรับประกันว่าทุกรายการนำเข้าถูกต้องโดยไม่ต้องตรวจ", "Wrong 3": "ข้อมูลอิเล็กทรอนิกส์ไม่สามารถสร้างหลักฐานการเปลี่ยนแปลงรายการได้", "Explanation": "สไลด์ระบุ More Extensive Testing of Records เป็นผลจากการเข้าถึงข้อมูลอิเล็กทรอนิกส์รวดเร็ว ทำให้ผู้ตรวจสอบขยายการทดสอบได้ (สไลด์ 4)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581048425d88017c927b4", "Question": "ร้านอาหารมีเงินสดรับจำนวนมากตลอดวันแต่เก็บเงินสดไว้ในสำนักงานหลายสัปดาห์ก่อนนำฝากธนาคาร ทั้งที่มีพนักงานรับเงินและธนาคารพร้อมบริการ ข้อใดเป็นการปรับปรุงการควบคุมที่ตรงกับหลักเงินสดในบทเรียน?", "Correct": "นำเงินสดรับฝากธนาคารโดยเร็วเพื่อลดเงินสดที่ถูกเก็บหรือเคลื่อนย้ายในกิจการ", "Wrong 1": "เก็บเงินสดไว้ในสำนักงานให้นานขึ้นเพื่อลดงานตรวจยอด", "Wrong 2": "ให้พนักงานรับเงินแก้ข้อมูลบัญชีลูกหนี้ได้โดยไม่ต้องตรวจสอบ", "Wrong 3": "เลิกออกใบเสร็จเพื่อไม่ให้ลูกค้าทราบยอดเงินรับ", "Explanation": "หลักการควบคุมเงินสดกำหนดให้แยกผู้ดูแลเงินกับผู้บันทึกบัญชี และนำเงินรับฝากธนาคารโดยเร็ว (สไลด์ 7)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125810f87b7e492b15ac7d6", "Question": "Purchases Journal มีคอลัมน์ Other Accounts Dr. ใช้สำหรับรายการซื้อเชื่อบางรายการซึ่งไม่ได้เข้าคอลัมน์ Inventory Dr. เหตุใดจำนวนเงินใน Other Accounts Dr. จึงต้องผ่านรายการเข้าบัญชีที่เกี่ยวข้องเป็นรายรายการ โดยไม่ผ่านยอดรวมคอลัมน์นี้ซ้ำตอนสิ้นงวด?", "Correct": "เพราะรายการในคอลัมน์นี้อาจเดบิตหลายบัญชีต่างชื่อและได้ผ่านรายการรายบัญชีแล้ว การผ่านยอดรวมซ้ำจะทำให้บัญชีผิด", "Wrong 1": "เพราะยอดใน Other Accounts Dr. เป็นข้อมูลที่ไม่ต้องบันทึกบัญชี", "Wrong 2": "เพราะคอลัมน์ Other Accounts Dr. ใช้รับเงินสดจากลูกค้าเท่านั้น", "Wrong 3": "เพราะการซื้อเชื่อทุกชนิดต้องเดบิต Inventory โดยไม่แยกบัญชีอื่น", "Explanation": "รายการ Other Accounts Dr. ใน Purchases Journal ต้องระบุบัญชีเดบิตและผ่านรายรายการทันที จึงไม่ผ่านยอดรวมคอลัมน์นี้ซ้ำตอนสิ้นงวด (สไลด์ 14)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581148ae8ffea81995272", "Question": "ธนาคารหักค่าธรรมเนียมรักษาบัญชีจากยอดเงินฝาก แต่ฝ่ายบัญชีกิจการยังไม่เคยบันทึกรายการนี้ เมื่อทำ Bank Reconciliation ข้อใดเป็นการดำเนินการที่ถูกต้อง?", "Correct": "ลดเงินสดฝั่งสมุดบัญชีและบันทึกค่าใช้จ่ายธนาคาร เนื่องจากธนาคารบันทึกแล้วแต่กิจการยังไม่บันทึก", "Wrong 1": "ลดเงินสดฝั่งธนาคารอีกครั้งเพราะธนาคารหักไปแล้ว", "Wrong 2": "เพิ่มเงินฝากระหว่างทางในฝั่งธนาคารเท่ากับค่าธรรมเนียม", "Wrong 3": "บันทึกเป็นรายได้ดอกเบี้ยเพื่อทำให้บัญชีสองฝั่งเท่ากัน", "Explanation": "ค่าธรรมเนียมที่ธนาคารหักและกิจการยังไม่บันทึกเป็นรายการปรับฝั่งสมุดบัญชี พร้อมเดบิตค่าใช้จ่ายและเครดิต Cash (สไลด์ 25, 29)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125815abb6ce797ea98fcc9", "Question": "ผู้ตรวจสอบพบยอดถอนผ่านตู้ ATM ที่ผู้บริหารไม่รู้จักบน Bank Statement ประจำเดือน การทบทวน Bank Statement สม่ำเสมอช่วยการควบคุมภายในอย่างไร?", "Correct": "ช่วยค้นหารายการผิดปกติหรือไม่ได้รับอนุญาตเพื่อสอบทานและแก้ไขได้ทันท่วงที", "Wrong 1": "ช่วยรับประกันว่าการขายทั้งหมดเป็นเงินเชื่อไม่ใช่เงินสด", "Wrong 2": "ใช้แทนเอกสารการซื้อขายทุกประเภทโดยไม่ต้องสอบทานธุรกรรม", "Wrong 3": "ทำให้ไม่ต้องกระทบยอดธนาคารอีกเลยไม่ว่ารายการจะต่างกันเพียงใด", "Explanation": "Bank Statement ช่วยให้เจ้าของบัญชีกระทบยอดและตรวจพบกิจกรรมผิดปกติหรือไม่ได้รับอนุญาตได้อย่างทันเวลา (สไลด์ 22–24)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581828cf0d7151834a451", "Question": "ฝ่ายประเมินสินค้าคงเหลือใช้ราคาที่คาดว่าจะขายได้เป็น NRV ทันที ทั้งที่สินค้ายังต้องจ่ายค่าซ่อมให้เสร็จก่อนขายและต้องเสียค่าจัดส่งเพื่อปิดการขาย ข้อใดชี้ข้อผิดพลาดในการกำหนด NRV ได้ตรงที่สุด?", "Correct": "ต้องหักต้นทุนทำให้สินค้าเสร็จและต้นทุนจำเป็นในการขายจากราคาขายที่คาดการณ์ก่อน", "Wrong 1": "ต้องบวกราคาขายที่คาดการณ์ด้วยค่าซ่อมและค่าขายเพื่อให้ NRV สูงขึ้น", "Wrong 2": "ต้องใช้ต้นทุนซื้อเดิมเป็น NRV เสมอโดยไม่สนใจราคาขาย", "Wrong 3": "ต้องหักเฉพาะค่าเสื่อมราคาของเครื่องจักรสำนักงานจากราคาขาย", "Explanation": "NRV คือราคาขายประมาณการตามปกติหักค่าใช้จ่ายเพื่อทำสินค้าให้เสร็จและต้นทุนจำเป็นในการขาย ไม่ใช่ราคาขายรวมโดยไม่หัก (สไลด์ 5, 27)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258198a7b2e6ef22163b66", "Question": "กิจการเปลี่ยนจากใบแจ้งหนี้กระดาษเป็นไฟล์อิเล็กทรอนิกส์ที่ผู้ขายส่งผ่านระบบออนไลน์ทั้งหมด ผู้ฝึกงานสรุปว่า 'ระบบ AIS ไม่มี Source Document แล้ว' ข้อใดแก้ความเข้าใจผิดนี้ได้ถูกต้อง?", "Correct": "Source Document ยังมีอยู่ในรูปไฟล์อิเล็กทรอนิกส์หรือข้อมูลจากเว็บ ไม่จำเป็นต้องเป็นกระดาษ", "Wrong 1": "ถูกต้อง เพราะไฟล์อิเล็กทรอนิกส์เป็น Output Device ไม่ใช่หลักฐานต้นทาง", "Wrong 2": "ถูกต้อง เพราะ Source Document ใช้ได้เฉพาะเช็คที่พิมพ์บนกระดาษ", "Wrong 3": "ไฟล์อิเล็กทรอนิกส์ทุกชนิดเป็นบัญชีแยกประเภท ไม่ใช่เอกสารธุรกรรม", "Explanation": "สไลด์ระบุว่า Source Documents อาจอยู่ในรูปกระดาษหรือไฟล์อิเล็กทรอนิกส์และการสื่อสารบนเว็บ ซึ่งสนับสนุนระบบ Paperless (สไลด์ 3)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581eeb9f1e1496112ac0f", "Question": "บริษัทซื้อสินค้าสำหรับจำหน่ายโดยภายหลังผู้ขายยอมลดราคาให้เพราะสินค้าบางส่วนมีตำหนิ แต่ยังสามารถขายได้และกิจการจะเก็บไว้ขายต่อ บริษัทควรจัดการ Purchase Allowance ที่ได้รับอย่างไรในการกำหนดต้นทุนสินค้าคงเหลือ?", "Correct": "ลดต้นทุนสินค้าคงเหลือของสินค้าที่ซื้อ เพราะ Purchase Allowance เป็นรายการหักจากต้นทุน", "Wrong 1": "เพิ่มรายได้จากการขายทันทีเท่ากับส่วนลดที่ได้รับ แม้ยังไม่ขายสินค้า", "Wrong 2": "เพิ่มต้นทุนสินค้าที่เหลือเพื่อชดเชยราคาที่ลดลง", "Wrong 3": "บันทึกเป็น Interest Revenue เพราะเป็นเงินที่ประหยัดจากการซื้อ", "Explanation": "Purchase Discounts และ Purchase Allowances ลดต้นทุนสินค้าที่ซื้อ ไม่ใช่ต้นทุนที่เพิ่มเข้ามา (สไลด์ 6)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581f18650ce3ff5dde699", "Question": "บริษัทใช้ Allowance Method เพื่อแสดง Accounts Receivable ในงบแสดงฐานะการเงิน ฝ่ายบัญชีต้องการรายงานยอดที่คาดว่าจะได้รับจริง ข้อใดเป็นหลักนำเสนอที่ถูกต้อง?", "Correct": "แสดง Accounts Receivable หักด้วย Allowance for Doubtful Accounts เพื่อได้มูลค่าสุทธิที่คาดว่าจะเก็บได้", "Wrong 1": "บวก Accounts Receivable กับ Allowance for Doubtful Accounts เพื่อแสดงยอดลูกหนี้สุทธิ", "Wrong 2": "แสดงเฉพาะ Allowance เป็นรายได้สะสมโดยไม่ต้องมี Accounts Receivable", "Wrong 3": "แสดง Accounts Receivable เป็นสินค้าคงเหลือจนกว่าจะได้รับเงินสด", "Explanation": "Allowance for Doubtful Accounts เป็นบัญชีหักจากลูกหนี้การค้า ทำให้มูลค่าสุทธิสะท้อนเงินสดที่คาดว่าจะเรียกเก็บได้ (สไลด์ 13–14)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581f9b5cefc3a5d68b376", "Question": "ร้านค้าได้รับคืนสินค้าจากลูกค้าบ่อยมากจนรายการคืนสินค้าขายมีจำนวนมากทุกวัน บริษัทมีระบบ Special Journals อยู่แล้ว ควรปรับการจัดสมุดรายวันอย่างไรเพื่อลดงานซ้ำและรวบรวมรายการชนิดเดียวกัน?", "Correct": "จัด Sales Returns and Allowances Journal แยกสำหรับรายการคืนสินค้าและส่วนลดรับคืนที่เกิดบ่อย", "Wrong 1": "บันทึกทุกรายการคืนสินค้าลง Purchases Journal เพราะเป็นการรับสินค้ากลับ", "Wrong 2": "บันทึกเป็น Cash Disbursements Journal เสมอแม้ยังไม่คืนเงินสด", "Wrong 3": "ไม่ต้องบันทึกการคืนสินค้าเพราะเป็นรายการที่ไม่ใช่ยอดขายใหม่", "Explanation": "สไลด์แนะนำว่าหากคืนสินค้าและให้ส่วนลดจากการขายจำนวนมากอาจใช้ Sales Returns and Allowances Journal แยก เพื่อบันทึกรายการซ้ำชนิดเดียวกัน (สไลด์ 11)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125813aa9b7f4a84862b4e5", "Question": "กิจการขายสินค้าเกษตรตามฤดูกาล สินค้าคงเหลือสูงมากช่วงเก็บเกี่ยวแต่ลดลงเหลือน้อย ณ วันสิ้นปี ผู้วิเคราะห์ต้องการ Inventory Turnover ที่สะท้อนระดับสินค้าที่ถือจริงระหว่างปีได้ดีขึ้น ควรใช้ฐานสินค้าคงเหลือเฉลี่ยแบบใดตามข้อแนะนำในสไลด์?", "Correct": "ใช้ค่าเฉลี่ยจากข้อมูลระหว่างปีหลายงวด เช่น รายเดือนหรือรายไตรมาส เพื่อสะท้อนความผันผวน", "Wrong 1": "ใช้เฉพาะสินค้าคงเหลือในวันที่มูลค่าต่ำที่สุดเพื่อทำให้อัตราหมุนเวียนสูง", "Wrong 2": "ใช้เฉพาะสินค้าคงเหลือปลายปีโดยไม่พิจารณาช่วงที่สินค้าสูงมาก", "Wrong 3": "ใช้ค่าเฉลี่ยราคาขายแทนสินค้าคงเหลือเพื่อปรับฤดูกาล", "Explanation": "เมื่อสินค้าคงเหลือเปลี่ยนแปลงมากภายในปี สไลด์เสนอให้คำนวณสินค้าคงเหลือเฉลี่ยจากงวดระหว่างปี เช่น รายเดือนหรือรายไตรมาส (สไลด์ 33)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125813b9919c1332811ac06", "Question": "บริษัทกำลังปรับกระบวนการรับ–จ่ายเงินสดให้ใช้ Electronic Funds Transfer (EFT) ในรายการที่เหมาะสม เหตุผลด้านการควบคุมเงินสดใดตรงกับข้อดีที่สไลด์ระบุ?", "Correct": "ช่วยลดจำนวนคนที่ต้องจับหรือเคลื่อนย้ายเงินสดจริง จึงลดโอกาสขโมยหรือทุจริต", "Wrong 1": "ทำให้ไม่ต้องมีการอนุมัติหรือหลักฐานสำหรับทุกรายการจ่าย", "Wrong 2": "ทำให้เงินสดทุกจำนวนกลายเป็น Cash Equivalent โดยอัตโนมัติ", "Wrong 3": "ทำให้ธนาคารไม่ออก Bank Statement อีกต่อไป", "Explanation": "EFT ลดจำนวนบุคคลที่สัมผัสเงินสดและช่วยลดความเสี่ยงการขโมยและทุจริตเมื่อเทียบกับการส่งต่อเงินสดด้วยมือ (สไลด์ 22)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125813c9cefe3181a6a93a3", "Question": "ระบบบัญชีอัตโนมัติลดเอกสารกระดาษลงมากจนผู้ตรวจสอบกลัวจะตรวจย้อนหลังไม่ได้ ฝ่าย IT จึงออกแบบระบบบันทึกผู้ทำรายการ วันเวลา และแหล่งข้อมูลของแต่ละรายการ มาตรการนี้ตอบข้อจำกัดเทคโนโลยีด้านใด?", "Correct": "Limited evidence of processing โดยสร้างร่องรอยอิเล็กทรอนิกส์ทดแทนเอกสารกระดาษที่ลดลง", "Wrong 1": "Cash over and short เพราะเป็นการคำนวณเงินสดเกินขาดในลิ้นชัก", "Wrong 2": "Cost of goods sold เพราะเพิ่มยอดต้นทุนขายโดยตรง", "Wrong 3": "Consignment เพราะแสดงเจ้าของสินค้าที่ฝากขายในคลัง", "Explanation": "สไลด์อธิบายว่าเทคโนโลยีอาจลดหลักฐานกระดาษ แต่สามารถสร้างหลักฐานใหม่ เช่น ผู้ทำรายการ เวลา และต้นทางของรายการ เพื่อการตรวจสอบ (สไลด์ 4)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258148bb24dd05a2515813", "Question": "ผู้ขายรับตั๋วเงินรับเงินต้น 3,600 บาท ดอกเบี้ย 12% ต่อปี อายุ 90 วัน กำหนดปีละ 360 วัน และสิ้นงวดแรกผ่านไป 15 วัน บริษัทปรับปรุงดอกเบี้ยค้างรับงวดแรกถูกต้องแล้ว เมื่อผู้ทำตั๋วชำระครบในวันครบกำหนดโดยไม่มีรายการอื่น รายได้ดอกเบี้ยที่ต้องรับรู้เพิ่มในงวดหลังเท่าใด?", "Correct": "90 บาท", "Wrong 1": "108 บาท", "Wrong 2": "18 บาท", "Wrong 3": "432 บาท", "Explanation": "ดอกเบี้ยรวม 3,600×12%×90/360=108 บาท งวดแรกบันทึกแล้ว 3,600×12%×15/360=18 บาท จึงรับรู้รายได้ดอกเบี้ยงวดหลังอีก 90 บาท (สไลด์ 28, 32–33)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125815580ecf3ba703998a5", "Question": "ผู้จัดการโรงงานต้องการให้เมื่อฝ่ายขายรับคำสั่งซื้อ ระบบส่งผลต่อแผนผลิต ปริมาณสินค้าที่ต้องเตรียม และข้อมูลจัดซื้อโดยเชื่อมกันทั้งบริษัท เทคโนโลยีตามบท 07 ที่ตรงกับการเชื่อมการดำเนินงานหลักลักษณะนี้ที่สุดคืออะไร?", "Correct": "ERP ซึ่งบูรณาการคำสั่งซื้อ การผลิต สินค้า และการจัดซื้อให้ตอบสนองเหตุการณ์ร่วมกัน", "Wrong 1": "Subsidiary Ledger ที่ใช้เก็บบัญชีลูกหนี้รายตัวเท่านั้น", "Wrong 2": "Cash Receipts Journal ที่ใช้บันทึกรายการรับเงินสดเท่านั้น", "Wrong 3": "Scanner ที่รับภาพเอกสารแต่ไม่จัดการกระบวนงานระหว่างแผนก", "Explanation": "Enterprise Resource Planning เชื่อมกิจกรรมหลักตั้งแต่การรับคำสั่งซื้อ การผลิต การจัดซื้อ สินค้าคงเหลือ และบัญชีให้ข้อมูลไหลระหว่างงาน (สไลด์ 21)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258163b352ce704ad61e56", "Question": "บริษัทมีกองทุนเงินสดย่อยแบบ Imprest วงเงิน 500 บาท ณ วันขอเบิกชดเชยมีเงินสดจริง 130 บาท และใบสำคัญที่ถูกต้องรวม 355 บาท ไม่มีรายการอื่น กิจการควรรับรู้เงินสดย่อยขาดและเบิกชดเชยเท่าใดเพื่อให้กองทุนกลับเป็น 500 บาท?", "Correct": "เงินสดย่อยขาด 15 บาท และเบิกชดเชย 370 บาท", "Wrong 1": "เงินสดย่อยขาด 15 บาท และเบิกชดเชย 355 บาท", "Wrong 2": "เงินสดย่อยเกิน 15 บาท และเบิกชดเชย 370 บาท", "Wrong 3": "เงินสดย่อยขาด 25 บาท และเบิกชดเชย 500 บาท", "Explanation": "เงินสดควรเหลือ 500−355=145 บาท แต่มีจริง 130 บาท ขาด 15 บาท; เช็คเบิกชดเชยเท่ากับ 500−130=370 บาท (สไลด์ 16–21)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581709ca8cb469678182e", "Question": "สมุดรายวันรับเงินสดแบบหลายคอลัมน์มี Cash Dr. รวม 2,250 บาท, Sales Discount Dr. รวม 50 บาท แต่ Accounts Receivable Cr. รวม 1,700 บาท และ Sales Cr. รวม 500 บาท ไม่มีคอลัมน์หรือรายการอื่น ผู้ตรวจ Crossfoot พบความผิดปกติข้อใด?", "Correct": "ยอดเดบิตรวมสูงกว่ายอดเครดิตรวม 100 บาท ต้องตรวจการรวมคอลัมน์และรายการก่อนผ่านบัญชี", "Wrong 1": "ยอดเดบิตและเครดิตเท่ากันที่ 2,250 บาท จึงผ่านบัญชีได้", "Wrong 2": "ยอดเครดิตรวมสูงกว่าเดบิต 50 บาท เพราะมีส่วนลดขาย", "Wrong 3": "ยอดเดบิตรวมต่ำกว่าเครดิต 100 บาท เพราะเครดิตรวม 2,400 บาท", "Explanation": "Crossfoot เปรียบเทียบยอดรวมเดบิต 2,250+50=2,300 บาท กับเครดิต 1,700+500=2,200 บาท ส่วนต่างเดบิตสูง 100 บาท (สไลด์ 13)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581958173e3a81ccb6bf5", "Question": "บริษัทใช้ Cash Receipts Journal ได้รับเงินสดเป็นรายได้ดอกเบี้ยจากธนาคาร โดยไม่เกี่ยวกับการขายสินค้าและไม่ใช่การรับชำระจากลูกหนี้ ถ้าสมุดรายวันมีคอลัมน์ Other Accounts Cr. ควรจัดรายการนี้อย่างไร?", "Correct": "บันทึกเดบิต Cash และเครดิตบัญชี Interest Revenue ในส่วน Other Accounts Cr.", "Wrong 1": "เครดิต Sales เพราะเงินสดรับทุกรายการคือยอดขาย", "Wrong 2": "เครดิต Accounts Receivable ของลูกค้ารายใดรายหนึ่งแม้ไม่มีหนี้", "Wrong 3": "เดบิต Inventory และเครดิต Cash เพราะเงินได้รับจากธนาคาร", "Explanation": "Cash Receipts Journal ใช้รับเงินจากลูกหนี้ ขายเงินสด และแหล่งอื่น เช่น ดอกเบี้ยรับ ซึ่งบันทึกเครดิตใน Other Accounts Cr. (สไลด์ 12)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581fbbc03e5dcf8d1eac7", "Question": "บริษัทใช้ระบบ Perpetual มีสินค้าต้นงวด 4 หน่วยต้นทุนหน่วยละ 90 บาท และซื้อเพิ่ม 6 หน่วยต้นทุนหน่วยละ 60 บาทก่อนขาย 5 หน่วย โดยไม่มีรายการอื่น หากเปรียบเทียบ FIFO กับ Moving Weighted Average ต้นทุนขายของ FIFO สูงกว่าวิธีถัวเฉลี่ยเท่าใด?", "Correct": "60 บาท", "Wrong 1": "0 บาท เพราะขายสินค้า 5 หน่วยเหมือนกัน", "Wrong 2": "30 บาท เพราะราคาต่อหน่วยต่างกัน 30 บาท", "Wrong 3": "120 บาท เพราะต้องใช้ราคาซื้อครั้งล่าสุดเป็นต้นทุนของทุกหน่วย", "Explanation": "FIFO ต้นทุนขาย = 4×90+1×60=420 บาท ส่วนต้นทุนเฉลี่ย (4×90+6×60)÷10=72 บาทต่อหน่วย ขาย 5 หน่วยต้นทุน 360 บาท ต่าง 60 บาท (สไลด์ 15–16, 19–20)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125810bb5cdda4ecfee96d5", "Question": "บริษัทใช้ Allowance Method และบัญชี Allowance for Doubtful Accounts ก่อนปรับปรุงมียอดเดบิตคงเหลือ เพราะระหว่างปีตัดหนี้สูญมากกว่ายอดเผื่อที่มีอยู่ การตีความและการดำเนินการสิ้นปีข้อใดเหมาะสมที่สุด?", "Correct": "ยอดเดบิตแสดงว่าการตัดหนี้สูญเกินยอดเผื่อที่มี และต้องปรับปรุงบัญชีให้มียอดเครดิตเหมาะสมก่อนจัดทำงบ", "Wrong 1": "ยอดเดบิตเป็นยอดปกติของบัญชี Allowance และไม่ต้องปรับ", "Wrong 2": "ยอดเดบิตแสดงว่าลูกหนี้จ่ายเกินทุกบัญชี จึงต้องคืนเงินสด", "Wrong 3": "ยอดเดบิตหมายถึงหนี้สูญทั้งหมดต้องกลับมาเป็นรายได้ขายใหม่", "Explanation": "สไลด์ระบุว่า Allowance อาจมียอดเดบิตเมื่อยอดตัดหนี้สูญมากกว่าเงินเผื่อเดิม และต้องปรับให้เป็นยอดเครดิตตามที่ประมาณก่อนทำงบ (สไลด์ 24)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125811c9553ed64d0636137", "Question": "บริษัทใช้ Sales Journal สำหรับการขายสินค้าคงเหลือเป็นเงินเชื่อ วันหนึ่งกิจการขายเครื่องถ่ายเอกสารที่ใช้เป็นสินทรัพย์สำนักงานของตนเป็นเงินเชื่อให้กิจการอื่น รายการนี้ควรบันทึกในสมุดรายวันใดเมื่อไม่มีสมุดพิเศษสำหรับขายสินทรัพย์?", "Correct": "General Journal เพราะเป็นการขายสินทรัพย์ที่ไม่ใช่สินค้าคงเหลือเป็นเงินเชื่อ", "Wrong 1": "Sales Journal เพราะการขายเงินเชื่อทุกประเภทต้องอยู่ในเล่มนี้", "Wrong 2": "Purchases Journal เพราะเป็นธุรกรรมเกี่ยวกับสินทรัพย์สำนักงาน", "Wrong 3": "Cash Receipts Journal เพราะยังไม่รับเงินสดในวันขาย", "Explanation": "Sales Journal ใช้กับการขายสินค้าคงเหลือเป็นเงินเชื่อ ส่วนการขายสินทรัพย์ที่ไม่ใช่สินค้าคงเหลือเป็นเงินเชื่อใช้ General Journal (สไลด์ 8, 17)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125816bb4eadd4bf5d69a92", "Question": "บริษัทมีฝ่ายผลิตเครื่องดื่ม ฝ่ายขายสินค้าเบเกอรี และธุรกิจในอีกภูมิภาคหนึ่ง ผู้บริหารต้องการประเมินผลแต่ละส่วนแยกกัน รายการใดอธิบายขอบเขตของ 'Segment' ตามสไลด์ได้ถูกต้อง?", "Correct": "ส่วนของกิจการอาจแยกตามผลิตภัณฑ์ บริการ หรือพื้นที่ทางภูมิศาสตร์ที่ระบุแยกได้", "Wrong 1": "Segment ต้องหมายถึงบริษัทจดทะเบียนแยกต่างหากเท่านั้น", "Wrong 2": "Segment ต้องเป็นบัญชีธนาคารแยกบัญชีสำหรับแต่ละพนักงาน", "Wrong 3": "Segment ใช้ได้เฉพาะการแบ่งตามจำนวนสินทรัพย์ที่เท่ากันทุกส่วนงาน", "Explanation": "Segment คือส่วนของบริษัทที่ระบุแยกตามสินค้า บริการ หรือเขตตลาด/ภูมิศาสตร์ เพื่อวิเคราะห์ข้อมูลทางการเงินได้ (สไลด์ 22)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258173999bc4b948f78322", "Question": "กิจการขนส่งมีทรัพย์สินเคลื่อนย้ายง่ายและพนักงานบางตำแหน่งรับผิดชอบสินทรัพย์มูลค่าสูง นอกจากแบ่งหน้าที่และเก็บเอกสารครบแล้ว มาตรการใดเป็นหลักการควบคุมภายในตามสไลด์เพื่อลดความเสียหายจากความเสี่ยงดังกล่าว?", "Correct": "ทำประกันสินทรัพย์และจัด Bonding สำหรับพนักงานตำแหน่งสำคัญตามความเสี่ยง", "Wrong 1": "ให้ผู้รักษาทรัพย์สินตรวจสอบการยักยอกของตนเองเพียงคนเดียว", "Wrong 2": "ยกเลิกการบันทึกทรัพย์สินเพื่อไม่ให้ข้อมูลรั่วไหล", "Wrong 3": "เปลี่ยนรายการสินทรัพย์ทั้งหมดเป็นรายได้เมื่อซื้อสำเร็จ", "Explanation": "หนึ่งในหลักการควบคุมภายในคือ Insure assets and bond key employees ควบคู่กับการระบุหน้าที่และจัดหลักฐานอย่างเพียงพอ (สไลด์ 3)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125817d84a4c7096a667459", "Question": "ผู้จัดทำงบการเงินกล่าวว่า 'เลือกวิธีกำหนดต้นทุนสินค้าคงเหลือแบบใดก็ไม่กระทบงบการเงิน เพราะจำนวนหน่วยสินค้าไม่เปลี่ยน' ควรตอบอย่างไรเมื่อราคาทุนแต่ละล็อตต่างกัน?", "Correct": "ไม่ถูกต้อง เพราะวิธีระบุต้นทุนส่งผลต่อมูลค่าสินค้าปลายงวด ต้นทุนขาย กำไร และสินทรัพย์หมุนเวียนได้", "Wrong 1": "ถูกต้อง เพราะมูลค่าสินค้าคงเหลือใช้จำนวนหน่วยคูณราคาขายเสมอ", "Wrong 2": "ถูกต้อง เฉพาะเมื่อกิจการใช้ระบบ Perpetual เท่านั้น", "Wrong 3": "ไม่ถูกต้องเพราะวิธีกำหนดต้นทุนมีผลเฉพาะยอดเงินสดฝากธนาคาร ไม่กระทบกำไร", "Explanation": "สไลด์ระบุว่าการเลือกสินค้าที่รวม ต้นทุน วิธีตีราคาและระบบสินค้ามีผลต่อ Inventory, COGS, Gross Profit, Net Profit และ Current Assets (สไลด์ 9, 24)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581aab50cc24cd50f7508", "Question": "ในวันปรับปรุงบัญชีสิ้นงวด กิจการรู้ว่ายอดลูกหนี้รวมบางส่วนจะเก็บไม่ได้ แต่ยังระบุไม่ได้ว่าลูกค้ารายใดจะผิดนัด หลักการสำคัญที่ทำให้ใช้ Allowance for Doubtful Accounts แทนการลด Accounts Receivable รายคนทันทีคืออะไร?", "Correct": "รับรู้ค่าใช้จ่ายหนี้สูญโดยประมาณได้โดยยังคงบัญชีลูกหนี้รายตัวไว้ จนกว่าจะทราบว่าหนี้ของผู้ใดเก็บไม่ได้แน่", "Wrong 1": "เพราะเมื่อประมาณการหนี้สูญแล้วต้องลบบัญชีลูกหนี้ทุกคนพร้อมกัน", "Wrong 2": "เพราะค่าเผื่อเป็นบัญชีรายได้และทำให้ยอดขายเพิ่มขึ้น", "Wrong 3": "เพราะยอดค่าเผื่อต้องมีค่าติดลบทุกครั้งก่อนปิดบัญชี", "Explanation": "การตั้ง Allowance เป็นบัญชีหักจากสินทรัพย์ช่วยรับรู้ความเสี่ยงหนี้สูญเมื่อยังไม่ทราบลูกหนี้ที่จะผิดนัดเป็นรายตัว (สไลด์ 12–14)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581b8bdd2e34516d6f55a", "Question": "บริษัทตั้งกองทุนเงินสดย่อยแบบ Imprest โดยเดบิต Petty Cash และเครดิต Cash ในวันที่ตั้งกองทุน ต่อมาจ่ายค่าใช้จ่ายย่อยพร้อมเก็บใบสำคัญครบ และเบิกชดเชยเท่ากับใบสำคัญโดยไม่ได้เปลี่ยนวงเงิน ข้อใดถูกต้องเกี่ยวกับยอดบัญชี Petty Cash หลังการเบิกชดเชย?", "Correct": "ยอดบัญชี Petty Cash คงเท่าวงเงินที่ตั้งไว้ เพราะเบิกชดเชยโดยเดบิตค่าใช้จ่ายหรือสินทรัพย์และเครดิต Cash", "Wrong 1": "ยอดบัญชี Petty Cash เพิ่มขึ้นเท่ากับใบสำคัญทุกครั้งที่เบิกชดเชย", "Wrong 2": "ยอดบัญชี Petty Cash ลดเหลือศูนย์ทันทีเมื่อมีการเบิกชดเชย", "Wrong 3": "ยอดบัญชี Petty Cash เปลี่ยนเป็น Sales Revenue หลังคืนเงินสด", "Explanation": "ระบบ Imprest บันทึกตั้งกองทุนใน Petty Cash แต่เมื่อเบิกชดเชยตามใบสำคัญให้เดบิตค่าใช้จ่าย/สินทรัพย์และเครดิต Cash ไม่ใช่เพิ่มบัญชี Petty Cash (สไลด์ 17, 20–21)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581b984bafa15d1996a71", "Question": "บริษัทกำลังพิจารณาติดตั้งระบบตรวจสอบการทำงานของพนักงานที่มีต้นทุนสูงมาก และอาจลดขวัญกำลังใจ ขณะที่ประโยชน์จากการลดความผิดพลาดมีน้อย หลักใดควรใช้กำหนดความเหมาะสมของมาตรการนี้?", "Correct": "หลัก Cost–Benefit โดยพิจารณาทั้งต้นทุน ผลประโยชน์ และผลต่อขวัญกำลังใจของพนักงาน", "Wrong 1": "หลักที่กำหนดให้ลงทุนในทุกมาตรการควบคุมโดยไม่มีขีดจำกัดค่าใช้จ่าย", "Wrong 2": "หลักการรับรู้รายได้ขายก่อนส่งมอบสินค้า", "Wrong 3": "หลัก FIFO เพื่อใช้ต้นทุนเก่าก่อนเป็นค่าใช้จ่ายควบคุม", "Explanation": "ข้อจำกัดของการควบคุมภายในคือประโยชน์ต้องไม่น้อยกว่าต้นทุน และควรพิจารณาผลต่อขวัญกำลังใจด้วย (สไลด์ 6)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581f992d8cc90e568d9b3", "Question": "หลังผ่านรายการขายเชื่อ บริษัทพบว่าบัญชีคุมลูกหนี้ใน General Ledger ไม่เท่ากับยอดรวม Accounts Receivable Subsidiary Ledger แม้ว่างบทดลองเดบิตและเครดิตเท่ากัน ควรตรวจอย่างไรต่อไป?", "Correct": "ตรวจการผ่านรายการระหว่างบัญชีคุมยอดกับบัญชีลูกหนี้รายตัว โดยใช้ Schedule of Accounts Receivable เปรียบเทียบ", "Wrong 1": "สรุปว่าบัญชีย่อยถูกต้องแน่นอนเพราะงบทดลองสมดุล", "Wrong 2": "ลบบัญชีคุมลูกหนี้แล้วใช้ยอดขายแทนโดยไม่ตรวจรายการ", "Wrong 3": "ปรับยอดรายลูกค้าทั้งหมดเท่ากันเพื่อให้ยอดรวมตรงกับบัญชีคุม", "Explanation": "การพิสูจน์บัญชีแยกประเภทต้องเปรียบเทียบยอดบัญชีคุมลูกหนี้กับตารางรวมยอดลูกหนี้รายตัว งบทดลองสมดุลอย่างเดียวไม่ยืนยันความตรงกันของบัญชีย่อย (สไลด์ 7, 9)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258106b2aefbbe9cdb2035", "Question": "ผู้จัดการวางนโยบายให้ติดตามรับชำระลูกหนี้อย่างมีประสิทธิภาพ วางแผนจ่ายเจ้าหนี้ตามกำหนด และลงทุนเงินสดส่วนเกินแทนการเก็บไว้ในลิ้นชักจำนวนมาก เป้าหมายหลักของ Cash Management ที่นโยบายนี้สนับสนุนคือข้อใด?", "Correct": "มีเงินสดพอชำระหนี้เมื่อถึงกำหนด โดยถือเงินสดเท่าที่จำเป็นต่อการดำเนินงาน", "Wrong 1": "ถือเงินสดสูงที่สุดเท่าที่ทำได้โดยไม่ต้องพิจารณาผลตอบแทน", "Wrong 2": "ชะลอการรับเงินลูกหนี้เพื่อให้ยอดบัญชีลูกหนี้สูงขึ้น", "Wrong 3": "จ่ายหนี้ทั้งหมดทันทีไม่ว่าบริษัทจะมีเงินสดพอหรือไม่", "Explanation": "การบริหารเงินสดมุ่งวางแผนเงินรับให้พอชำระเงินจ่ายเมื่อถึงกำหนด และคงเงินสดในระดับจำเป็น โดยลงทุนส่วนเกินได้ (สไลด์ 9)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258119bf6be828b40849ff", "Question": "กิจการใช้ Sales Journal และ Accounts Receivable Subsidiary Ledger เมื่อเจ้าหน้าที่ผ่านรายการขายเชื่อรายลูกค้าเข้าบัญชีย่อยแล้ว มักทำเครื่องหมายถูกในช่อง Posting Reference (PR) แทนการใส่เลขที่บัญชีลูกค้า เพราะเหตุใด?", "Correct": "บัญชีลูกค้าในบัญชีย่อยมักจัดตามลำดับชื่อ และเครื่องหมายถูกแสดงว่าได้ผ่านรายการลูกค้าแล้ว", "Wrong 1": "เพราะการขายเชื่อไม่เคยต้องผ่านบัญชีคุมลูกหนี้ในบัญชีแยกประเภททั่วไป", "Wrong 2": "เพราะเครื่องหมายถูกหมายถึงลูกค้าจ่ายเงินครบแล้ว", "Wrong 3": "เพราะการใส่เครื่องหมายถูกแทนเลขที่บัญชีทำให้ไม่ต้องเก็บใบแจ้งหนี้", "Explanation": "สไลด์อธิบายว่าการผ่านรายการรายลูกค้าใน Sales Journal ใช้เครื่องหมายถูกใน PR โดยบัญชีลูกค้าในบัญชีย่อยเรียงตามชื่อ (สไลด์ 8)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125811bbf98f9d52327e837", "Question": "สมุดรายวันจ่ายเงินสดของกิจการบันทึกหมายเลขเช็ค 301, 302, 304, 305 แต่ไม่พบเช็คหมายเลข 303 ในรายการจ่าย เหตุใดการบันทึกเช็คตามลำดับหมายเลขจึงเป็นการควบคุมที่มีประโยชน์?", "Correct": "ช่วยค้นหาเช็คที่หายหรือข้ามหมายเลขเพื่อสอบทานว่าเช็คดังกล่าวถูกออกหรือยกเลิกอย่างถูกต้องหรือไม่", "Wrong 1": "ช่วยรับประกันว่าผู้ขายทุกรายจะให้ส่วนลดซื้อ", "Wrong 2": "ช่วยเปลี่ยนเช็คทุกฉบับเป็นเงินฝากระหว่างทางโดยอัตโนมัติ", "Wrong 3": "ทำให้ไม่ต้องตรวจยอดเดบิตและเครดิตของสมุดรายวันจ่ายเงินสด", "Explanation": "หมายเลขเช็คล่วงหน้าและบันทึกตามลำดับใน Cash Disbursements Journal ช่วยตรวจพบหมายเลขที่ขาดหายเพื่อสอบทานต่อ (สไลด์ 16)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258133b412f4399906503a", "Question": "กิจการใช้ Perpetual FIFO ขายสินค้าบางส่วนไปแล้วเมื่อวันที่ 10 ต่อมาวันที่ 12 จึงซื้อสินค้าล็อตใหม่ในราคาต่ำลง และไม่มีการคืนสินค้าหรือแก้ไขรายการเดิม การซื้อวันที่ 12 ควรมีผลต่อต้นทุนขายที่บันทึกจากการขายวันที่ 10 อย่างไร?", "Correct": "ไม่เปลี่ยนต้นทุนขายของการขายวันที่ 10 เพราะใช้ชั้นต้นทุนที่มีอยู่ ณ วันขายไปแล้ว", "Wrong 1": "นำต้นทุนล็อตวันที่ 12 ไปแทนต้นทุนของทุกหน่วยที่ขายวันที่ 10 ย้อนหลัง", "Wrong 2": "ปรับรายได้ขายวันที่ 10 ให้เท่ากับต้นทุนล็อตวันที่ 12", "Wrong 3": "ลบต้นทุนขายวันที่ 10 ออกจากบัญชีจนกว่าจะตรวจนับสิ้นปี", "Explanation": "ระบบ Perpetual บันทึกต้นทุนขาย ณ วันที่ขายตามชั้นต้นทุน FIFO ที่มีอยู่ขณะนั้น การซื้อภายหลังไม่ได้ย้อนเปลี่ยนต้นทุนขายเดิม (สไลด์ 15–18)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581ac91cae6a7f13f7b85", "Question": "เจ้าหน้าที่ได้รับ Invoice จากผู้ขายเป็นไฟล์ PDF และใช้เครื่อง Scanner สำหรับเอกสารกระดาษอื่นในวันเดียวกัน ข้อใดแยก Source Document กับ Input Device ได้ถูกต้อง?", "Correct": "Invoice เป็น Source Document ส่วน Scanner เป็น Input Device", "Wrong 1": "Invoice เป็น Input Device ส่วน Scanner เป็น Source Document", "Wrong 2": "ทั้ง Invoice และ Scanner เป็น Information Processor", "Wrong 3": "ทั้ง Invoice และ Scanner เป็น Output Device", "Explanation": "Source Documents เช่นใบแจ้งหนี้เป็นหลักฐานข้อมูลธุรกรรม ขณะที่เครื่องสแกนใช้รับข้อมูลจากเอกสารเข้าสู่ระบบ (สไลด์ 3)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581c6a961d202308ec7a1", "Question": "พนักงานมีหนี้ส่วนตัวจึงตัดสินใจทุจริตเงินสด และอ้างกับตนเองว่า 'บริษัทจ่ายค่าตอบแทนฉันน้อยเกินไป จึงสมควรได้ส่วนนี้' คำอ้างนี้ตรงกับองค์ประกอบใดของ Fraud Triangle?", "Correct": "Rationalization — การหาเหตุผลเข้าข้างการทุจริตของตนเอง", "Wrong 1": "Opportunity — ช่องโหว่ของการควบคุมภายในที่เปิดโอกาสให้กระทำผิด", "Wrong 2": "Pressure — ภาระทางการเงินที่ผลักดันให้มีแรงกดดัน", "Wrong 3": "Internal Audit — การตรวจสอบโดยผู้ตรวจสอบอิสระ", "Explanation": "Fraud Triangle แยก Pressure, Opportunity และ Rationalization โดยคำอ้างว่าตนสมควรได้เงินเป็น Rationalization ไม่ใช่ตัวแรงกดดันหรือช่องโหว่ (สไลด์ 5)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581d58809e7a8955614b6", "Question": "กิจการได้รับตั๋วเงินรับลงวันที่ 20 เมษายน 2026 อายุ 75 วัน โดยกำหนดให้ไม่นับวันออกตั๋วและนับวันครบกำหนดเป็นวันสุดท้าย ตั๋วจะครบกำหนดวันใด?", "Correct": "4 กรกฎาคม 2026", "Wrong 1": "3 กรกฎาคม 2026", "Wrong 2": "5 กรกฎาคม 2026", "Wrong 3": "20 กรกฎาคม 2026", "Explanation": "นับจากวันถัดจาก 20 เมษายน: เมษายน 10 วัน พฤษภาคม 31 วัน มิถุนายน 30 วัน และกรกฎาคมอีก 4 วัน รวม 75 วัน จึงครบกำหนด 4 กรกฎาคม (สไลด์ 27)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581d59e48f0455271ce05", "Question": "ผู้ประกอบการให้ลูกค้าจ่ายผ่านบัตรเครดิตบุคคลที่สามเพื่อลดการตรวจสอบเครดิตลูกค้าเอง ประโยชน์สำคัญข้อใดตามบทเรียนสนับสนุนการรับบัตรเครดิต?", "Correct": "ผู้ให้บริการบัตรเป็นผู้ประเมินเครดิตและช่วยลดภาระการเก็บหนี้ของผู้ขายตามรูปแบบบริการ", "Wrong 1": "ผู้ขายจะไม่มีค่าใช้จ่ายใด ๆ จากบัตรเครดิตไม่ว่าเงื่อนไขใด", "Wrong 2": "การรับบัตรทำให้ผู้ขายสามารถรับรู้รายได้เป็นสองเท่าของราคาขาย", "Wrong 3": "สินค้าทุกชนิดที่ขายผ่านบัตรกลายเป็นสินค้าฝากขายของบริษัทบัตรทันที", "Explanation": "สไลด์ชี้ว่าบริษัทบัตรเครดิตช่วยประเมินเครดิตลูกค้าและลดภาระการบริหารลูกหนี้ผู้ขาย แม้อาจมีค่าธรรมเนียมบัตร (สไลด์ 5)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581d797ccf303e3d632a2", "Question": "กิจการตรวจพบว่าเช็คค้างจ่าย 2 ฉบับที่ออกและบันทึกในสมุดบัญชีเมื่อเดือนก่อนยังไม่ถูกนำขึ้นเงิน ณ วันสิ้นเดือนนี้ การทำ Bank Reconciliation ที่ถูกต้องต้องจัดการอย่างไร?", "Correct": "หักเช็คค้างจ่ายจากยอดตามธนาคารโดยไม่บันทึกค่าใช้จ่ายซ้ำในสมุดบัญชี", "Wrong 1": "บันทึกเดบิตค่าใช้จ่ายซ้ำและเครดิตเงินสดในสมุดบัญชีสำหรับเช็คทุกฉบับ", "Wrong 2": "เพิ่มยอดเช็คค้างจ่ายในยอดตามธนาคาร เพราะเป็นเงินฝากที่ยังไม่ถึงธนาคาร", "Wrong 3": "รับรู้เช็คค้างจ่ายเป็นรายได้อื่นเมื่อยังไม่มีผู้ขึ้นเงิน", "Explanation": "เช็คค้างจ่ายถูกบันทึกในสมุดบัญชีแล้วแต่ยังไม่ถูกหักโดยธนาคาร จึงเป็นรายการหักจากยอดธนาคารและไม่ต้องบันทึกซ้ำ (สไลด์ 25–29)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258100a54bfc0aeabe39cd", "Question": "บัญชีสินค้าคงเหลือต้นปีบันทึกไว้ 17,600 บาท แต่ยอดที่ถูกต้องคือ 20,000 บาท ระหว่างปีมีต้นทุนซื้อสุทธิ 50,000 บาท และสินค้าคงเหลือปลายปีถูกต้อง 10,000 บาท ไม่มีข้อผิดพลาดอื่นและไม่พิจารณาภาษี ข้อใดถูกต้องเกี่ยวกับต้นทุนขายและกำไรสุทธิที่รายงาน?", "Correct": "ต้นทุนขายต่ำกว่าจริง 2,400 บาท และกำไรสุทธิสูงกว่าจริง 2,400 บาท", "Wrong 1": "ต้นทุนขายสูงกว่าจริง 2,400 บาท และกำไรสุทธิต่ำกว่าจริง 2,400 บาท", "Wrong 2": "ต้นทุนขายและกำไรสุทธิไม่คลาดเคลื่อนเพราะยอดปลายปีถูกต้อง", "Wrong 3": "ต้นทุนขายต่ำกว่าจริง 2,400 บาท และกำไรสุทธิต่ำกว่าจริง 2,400 บาท", "Explanation": "ต้นทุนขายที่ถูกต้อง 20,000+50,000−10,000=60,000 บาท แต่ที่บันทึกได้ 57,600 บาท จึงต่ำไป 2,400 บาทและกำไรสุทธิสูงไปเท่ากัน (สไลด์ 31–32)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581019999df50985dce94", "Question": "นักบัญชีต้องแจกงบแสดงฐานะการเงินที่ระบบ AIS ประมวลผลเสร็จแล้วแก่ฝ่ายบริหาร โดยแสดงผ่านจอมอนิเตอร์ในห้องประชุม อุปกรณ์นี้ทำหน้าที่ใดในองค์ประกอบระบบบัญชี?", "Correct": "Output device เพราะนำสารสนเทศที่ประมวลผลแล้วออกมาให้ผู้ใช้รับทราบ", "Wrong 1": "Input device เพราะเป็นอุปกรณ์ที่เก็บรายละเอียดธุรกรรมเข้าระบบ", "Wrong 2": "Information processor เพราะจอเป็นผู้ตัดสินรายการบัญชี", "Wrong 3": "Information storage เพราะจอเป็นฐานข้อมูลถาวรสำหรับผู้สอบบัญชี", "Explanation": "Output devices เช่น จอมอนิเตอร์ เครื่องพิมพ์และโปรเจ็กเตอร์ ใช้นำสารสนเทศและรายงานที่ระบบจัดทำแล้วไปสู่ผู้ใช้ (สไลด์ 4)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581239b97e4e8776f66a6", "Question": "บริษัทใช้ Percent of Receivables Method เพื่อคำนวณค่าเผื่อหนี้สงสัยจะสูญ ผู้บริหารประเมินยอดเผื่อปลายงวดที่ควรมีได้แล้ว แต่ผู้ทำบัญชีเสนอให้บันทึก Bad Debts Expense เท่ากับยอดเผื่อเป้าหมายเต็มจำนวนโดยไม่ดูยอดคงเหลือเดิม เหตุใดจึงไม่ถูกต้อง?", "Correct": "ต้องพิจารณายอดคงเหลือเดิมของ Allowance ซึ่งเป็นบัญชีถาวร และปรับเฉพาะจำนวนที่ทำให้ยอดถึงเป้าหมาย", "Wrong 1": "เพราะค่าเผื่อเป็นบัญชีรายได้จึงห้ามมีเครดิตคงเหลือ", "Wrong 2": "เพราะยอดเผื่อต้องเท่ากับยอดขายเงินสดประจำปีเสมอ", "Wrong 3": "เพราะวิธี Percent of Receivables ไม่ต้องมีบัญชีค่าเผื่อหนี้สงสัยจะสูญ", "Explanation": "วิธี Percent of Receivables กำหนดยอดเครดิตค่าเผื่อที่ต้องการ ณ สิ้นงวด จากนั้นต้องเทียบยอดเดิมก่อนคำนวณจำนวนที่ปรับเพิ่มหรือลด (สไลด์ 19–20)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258148b2bff6a7081c0fef", "Question": "บริษัทใช้ Weighted Average Cost ภายใต้ระบบ Perpetual สินค้าในคลังมีต้นทุนเฉลี่ยหน่วยละ 300 บาท แล้วฝ่ายการตลาดเพิ่มราคาขายต่อหน่วยจาก 450 เป็น 480 บาทโดยไม่มีการซื้อสินค้าใหม่หรือปรับมูลค่า ข้อใดสะท้อนการกำหนดต้นทุนที่ถูกต้อง?", "Correct": "ต้นทุนเฉลี่ยของสินค้าคงเหลือยังเป็น 300 บาทต่อหน่วย เพราะการเปลี่ยนราคาขายไม่ใช่การเปลี่ยนต้นทุนซื้อ", "Wrong 1": "ต้นทุนเฉลี่ยต้องเพิ่มเป็น 330 บาทต่อหน่วยตามส่วนต่างราคาขาย", "Wrong 2": "ต้นทุนเฉลี่ยต้องเท่ากับราคาขายใหม่ 480 บาทต่อหน่วย", "Wrong 3": "ต้นทุนเฉลี่ยต้องลดลงเหลือ 150 บาทต่อหน่วยเพื่อให้กำไรขั้นต้นคงเดิม", "Explanation": "วิธี Weighted Average กำหนดต้นทุนจากมูลค่าต้นทุนและจำนวนหน่วยสินค้า ไม่ได้นำราคาขายมาคำนวณต้นทุนเฉลี่ย (สไลด์ 19–21)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125815b955df13eb5b0482f", "Question": "ร้านค้าใช้ Sales Journal ที่มีคอลัมน์ Sales และ Sales Taxes Payable เมื่อขายเชื่อที่ต้องเก็บภาษีขาย กิจการควรพิจารณาภาษีที่เก็บแทนหน่วยงานรัฐอย่างไร?", "Correct": "เป็นหนี้สิน Sales Taxes Payable ที่ต้องนำส่งภายหลัง ไม่ใช่รายได้ขายของบริษัท", "Wrong 1": "เป็นส่วนของ Sales Revenue ทั้งหมดเพราะเรียกเก็บจากลูกค้าได้", "Wrong 2": "เป็น Inventory เพราะบริษัทได้รับสิทธิเรียกเก็บเงินเพิ่ม", "Wrong 3": "เป็น Bad Debts Expense เพราะยังไม่ได้รับชำระเงิน", "Explanation": "Sales Taxes Payable เป็นภาษีที่กิจการเก็บจากลูกค้าและต้องนำส่งหน่วยงานรัฐ จึงบันทึกต่างหากจากยอด Sales (สไลด์ 10)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125815fa9cdca891b3ce66c", "Question": "ผู้จัดการต้องการลดการทุจริตการขายหน้าร้านด้วยเงินสด ข้อใดใช้มาตรการควบคุมที่ระบุไว้ในสไลด์เกี่ยวกับ Cash Register ได้ครบถ้วนที่สุด?", "Correct": "บันทึกการขายทุกครั้งก่อนห่อสินค้า ให้ลูกค้าเห็นยอดและได้รับใบเสร็จ พร้อมเก็บร่องรอยรายการที่แก้ไขเองไม่ได้ง่าย", "Wrong 1": "ให้พนักงานบันทึกยอดรวมหลังปิดร้านเท่านั้นและไม่ต้องให้ใบเสร็จ", "Wrong 2": "ซ่อนหน้าจอแสดงยอดจากลูกค้าเพื่อไม่ให้ลูกค้ารบกวนพนักงาน", "Wrong 3": "อนุญาตให้ลบรายการที่กดผิดทั้งหมดโดยไม่มีบันทึกติดตามย้อนหลัง", "Explanation": "การควบคุมเงินสดหน้าร้านควรบันทึกทันที ให้ลูกค้าเห็นยอด ออกใบเสร็จ และมีบันทึกรายการถาวรในเครื่องคิดเงิน (สไลด์ 10)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125817495d7c7052ae8b5f5", "Question": "กิจการขายเครื่องจักรให้ลูกค้าโดยลูกค้าออกตั๋วสัญญาใช้เงินเป็นลายลักษณ์อักษรระบุมูลหนี้ ดอกเบี้ย และวันครบกำหนด เหตุใดผู้ขายจึงอาจเลือกใช้ Notes Receivable แทน Accounts Receivable ธรรมดาในการให้เครดิตระยะยาว?", "Correct": "ตั๋วสัญญาใช้เงินเป็นหลักฐานยอมรับหนี้เป็นลายลักษณ์อักษร ระบุจำนวนและเงื่อนไขซึ่งช่วยในการเรียกร้องตามกฎหมาย", "Wrong 1": "เพราะ Notes Receivable ไม่ต้องติดตามวันครบกำหนดและผู้ทำตั๋ว", "Wrong 2": "เพราะ Notes Receivable บังคับให้ผู้ซื้อจ่ายทันทีในวันขายเสมอ", "Wrong 3": "เพราะการรับตั๋วทำให้ผู้ขายไม่มีความเสี่ยงที่ลูกค้าจะผิดนัดอีกต่อไป", "Explanation": "สไลด์อธิบายว่าตั๋วสัญญาใช้เงินช่วยเป็นหลักฐานยอมรับหนี้ ระบุจำนวนและเงื่อนไข จึงนิยมใช้เมื่อให้เครดิตนานหรือยอดสูง (สไลด์ 26)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581cbb0fec1bcce047cd2", "Question": "เมื่อปิดกะ ยอดเงินสดจริงในลิ้นชักมากกว่ายอดขายเงินสดตามเครื่องคิดเงินโดยไม่มีสาเหตุอื่น บริษัทใช้บัญชี Cash Over and Short เพื่อบันทึกส่วนต่าง ข้อใดอธิบายลักษณะบัญชีนี้ได้ตรงที่สุด?", "Correct": "เป็นบัญชีผลการดำเนินงานสำหรับแสดงผลของเงินสดเกินหรือขาดจากยอดบันทึก", "Wrong 1": "เป็น Accounts Receivable เพราะเงินสดที่เกินถือเป็นเงินลูกค้าค้างชำระ", "Wrong 2": "เป็น Merchandise Inventory เพราะใช้วัดความคลาดเคลื่อนของสินค้าคงเหลือ", "Wrong 3": "เป็น Bank Loan เพราะส่วนต่างทุกกรณีต้องชำระคืนธนาคาร", "Explanation": "Cash Over and Short เป็นบัญชีในงบกำไรขาดทุนที่สะท้อนผลของเงินสดเกินหรือขาดจากยอดที่บันทึกไว้ (สไลด์ 11)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581e69096da9d4d600fac", "Question": "ฝ่ายบัญชีกำลังทำ Bank Reconciliation พบทั้งเช็คค้างจ่ายที่ยังไม่ถูกนำขึ้นเงิน และเช็คที่ลูกค้านำฝากแต่ธนาคารปฏิเสธการจ่าย (NSF) ข้อใดจำแนกวิธีจัดการรายการทั้งสองได้ถูกต้อง?", "Correct": "เช็คค้างจ่ายปรับลดฝั่งธนาคาร ส่วน NSF ปรับลดฝั่งสมุดบัญชีและต้องบันทึกรายการปรับปรุง", "Wrong 1": "เช็คค้างจ่ายและ NSF ต้องเพิ่มยอดฝั่งธนาคารทั้งคู่", "Wrong 2": "เช็คค้างจ่ายต้องบันทึกจ่ายเงินใหม่ในสมุดบัญชี ส่วน NSF ไม่ต้องบันทึกอะไร", "Wrong 3": "เช็คค้างจ่ายปรับลดฝั่งสมุดบัญชี และ NSF ปรับเพิ่มยอดเงินฝากระหว่างทาง", "Explanation": "เช็คค้างจ่ายเป็นรายการที่สมุดบันทึกแล้วแต่ธนาคารยังไม่บันทึก จึงหักฝั่งธนาคาร ส่วน NSF ทำให้บริษัทต้องลดเงินสดในสมุดและปรับลูกหนี้ (สไลด์ 25–29)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125810cbbedf1751eab9fdc", "Question": "หลังบริษัทนำใบแจ้งหนี้เข้าระบบและประมวลผลแล้ว บริษัทเก็บรายการบัญชีและภาพเอกสารไว้ในฐานข้อมูลที่ค้นย้อนหลังได้ เพื่อให้นักบัญชีจัดทำงบและผู้สอบบัญชีตรวจสอบหลักฐานในภายหลัง ส่วนงานนี้จัดเป็นองค์ประกอบใดของ AIS?", "Correct": "Information storage", "Wrong 1": "Input devices เพราะมีการใช้อุปกรณ์อ่านข้อมูลก่อนเข้าสู่ระบบ", "Wrong 2": "Information processors เพราะเป็นขั้นตอนตีความและคำนวณรายการบัญชี", "Wrong 3": "Output devices เพราะเป็นอุปกรณ์แสดงรายงานให้ผู้บริหารในขณะที่เรียกดู", "Explanation": "Information storage ทำหน้าที่เก็บข้อมูลหลังรับเข้าและประมวลผลให้เรียกใช้ภายหลังได้ รวมถึงการจัดทำรายงานและงานตรวจสอบบัญชี (สไลด์ 3–4)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258111a55eccce864ce00e", "Question": "ร้านค้าออนไลน์ส่งข้อมูลบัตรชำระเงินของลูกค้าผ่านเครือข่าย บริษัทต้องการลดความเสี่ยงที่ผู้ดักอ่านข้อมูลระหว่างส่งจะเข้าใจเลขบัตรได้ ควรใช้มาตรการใดตามหัวข้อ Technology and Internal Control?", "Correct": "Encryption ซึ่งแปลงเนื้อหาให้อ่านไม่ออกหากไม่มีรหัสหรือกระบวนการถอดกลับ", "Wrong 1": "Firewall เพียงอย่างเดียวซึ่งควบคุมจุดเข้าใช้งานระบบ แต่ไม่ใช่การแปลงเนื้อหาข้อมูลที่ส่ง", "Wrong 2": "Audit log เพียงอย่างเดียวซึ่งบันทึกผู้ทำรายการและเวลา แต่ไม่เข้ารหัสข้อมูลระหว่างส่ง", "Wrong 3": "Backup ฐานข้อมูลเพียงอย่างเดียวซึ่งช่วยกู้คืนข้อมูล แต่ไม่ป้องกันการอ่านระหว่างส่ง", "Explanation": "Encryption ใช้กระบวนการทางคณิตศาสตร์แปลงเนื้อหาให้ผู้อื่นอ่านไม่ได้โดยไม่มีรหัสถอดข้อมูล ส่วน Firewall เน้นควบคุมจุดเข้าระบบ (สไลด์ 4)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258139baf1efdbf6aabced", "Question": "ผู้จำหน่ายรถยนต์มีนโยบายปกติให้ลูกค้าผ่อนชำระราคาขายเป็นรายเดือนต่อเนื่องเกินหนึ่งปีและคิดดอกเบี้ยจากยอดคงค้าง ตามสไลด์ ข้อใดอธิบายลูกหนี้จากการขายลักษณะนี้ได้ถูกต้อง?", "Correct": "เป็น Installment Accounts Receivable และอาจจัดเป็นสินทรัพย์หมุนเวียนได้หากผู้ขายให้เครดิตลักษณะนี้เป็นปกติ", "Wrong 1": "เป็น Notes Receivable เสมอ แม้ไม่มีเอกสารสัญญาตั๋วสัญญาใช้เงิน", "Wrong 2": "เป็นเงินสดทันทีในวันที่ขาย เพราะลูกค้ามีข้อตกลงว่าจะผ่อนชำระ", "Wrong 3": "ต้องเป็นสินทรัพย์ไม่หมุนเวียนทั้งหมดเสมอ เพียงเพราะผ่อนชำระนานเกินหนึ่งปี", "Explanation": "Installment Accounts Receivable เกิดจากการขายเชื่อที่ลูกค้าชำระเป็นงวดและมักมีดอกเบี้ย แม้ระยะเครดิตเกินหนึ่งปี สไลด์ระบุว่าอาจจัดเป็นสินทรัพย์หมุนเวียนเมื่อเป็นเงื่อนไขปกติของผู้ขาย (สไลด์ 8)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258141ad0dcd2e63ecbd99", "Question": "พนักงานทำสมุดรายวันเฉพาะแบบหลายคอลัมน์และได้ยอดรวมของแต่ละคอลัมน์แล้ว ก่อนผ่านรายการ เขานำยอดรวมคอลัมน์ฝั่งเดบิตทั้งหมดมาเทียบกับยอดรวมคอลัมน์ฝั่งเครดิตทั้งหมด เพื่อตรวจว่าสองฝั่งเท่ากัน ขั้นตอนตรวจนี้เรียกว่าอะไร?", "Correct": "Crossfooting", "Wrong 1": "Footing ซึ่งหมายถึงการบวกตัวเลขภายในคอลัมน์เดียว", "Wrong 2": "Posting ซึ่งหมายถึงการผ่านรายการไปบัญชีแยกประเภท", "Wrong 3": "Preparing a subsidiary ledger schedule ซึ่งหมายถึงการรวมยอดบัญชีย่อยเพื่อเทียบกับบัญชีคุมยอด", "Explanation": "Footing คือการรวมตัวเลขภายในคอลัมน์หนึ่ง ส่วน Crossfooting คือการรวมยอดฝั่งเดบิตและฝั่งเครดิตแล้วเปรียบเทียบกันก่อนผ่านรายการ (สไลด์ 13)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125815a9620c297bc8ba004", "Question": "บริษัทใช้เกณฑ์ Lower of Cost and NRV โดยประเมินเป็นหมวดสินค้าที่คล้ายกัน ไม่ใช่แยกรายชิ้น หมวด ก มีสินค้า 2 ชิ้น: ชิ้นที่ 1 ต้นทุน 100,000 บาท NRV 80,000 บาท และชิ้นที่ 2 ต้นทุน 100,000 บาท NRV 130,000 บาท; หมวด ข มีสินค้า 2 ชิ้น: ชิ้นที่ 1 ต้นทุน 70,000 บาท NRV 65,000 บาท และชิ้นที่ 2 ต้นทุน 80,000 บาท NRV 75,000 บาท ไม่มีสินค้าอื่น หากใช้มูลค่าที่ต่ำกว่าระหว่างต้นทุนรวมกับ NRV รวมของแต่ละหมวด จะรายงานสินค้าคงเหลือรวมเท่าใด?", "Correct": "340,000 บาท", "Wrong 1": "320,000 บาท", "Wrong 2": "350,000 บาท", "Wrong 3": "330,000 บาท", "Explanation": "หมวด ก ใช้ต่ำกว่าระหว่างต้นทุนรวม 200,000 กับ NRV รวม 210,000 จึงได้ 200,000 บาท; หมวด ข ใช้ต่ำกว่าระหว่างต้นทุนรวม 150,000 กับ NRV รวม 140,000 จึงได้ 140,000 บาท รวม 340,000 บาท (สไลด์ 27)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581c4a406f16c8067e404", "Question": "ผู้จัดการต้องใช้รายงานยอดขายของเมื่อวานเพื่อวางแผนสั่งสินค้าเช้าวันถัดไป ระบบ AIS คำนวณยอดขายถูกต้องทุกครั้ง แต่ส่งรายงานช้าไป 3 สัปดาห์ ข้อบกพร่องนี้กระทบหลักการพื้นฐานข้อใดโดยตรงที่สุด?", "Correct": "Relevance เพราะรายงานไม่ทันเวลาและไม่ตอบโจทย์การตัดสินใจที่ต้องทำ", "Wrong 1": "Compatibility เพราะระบบไม่สามารถทำงานร่วมกับโครงสร้างกิจการ แม้ไม่มีข้อมูลเรื่องนี้", "Wrong 2": "Flexibility เพราะระบบไม่รองรับการเปลี่ยนแปลงกฎระเบียบในอนาคต", "Wrong 3": "Cost-benefit เพราะค่าใช้จ่ายของระบบสูงกว่าประโยชน์ แม้ไม่มีข้อมูลต้นทุน", "Explanation": "Relevance กำหนดให้ข้อมูลเป็นประโยชน์ เข้าใจได้ ตรงประเด็น และทันเวลาเพื่อการตัดสินใจ แม้ตัวเลขถูกแต่รายงานช้าเกินความต้องการก็ไม่ตอบหลักนี้ (สไลด์ 2)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581c990a1e0a6f2809f54", "Question": "กิจการต้องการเงินทุนหมุนเวียน จึงกู้เงินจากธนาคารโดยนำสิทธิเรียกเก็บลูกหนี้การค้าของตนมาเป็นหลักประกัน แต่ไม่ได้ขายลูกหนี้ให้ธนาคาร หากลูกหนี้บางรายไม่จ่าย ข้อใดอธิบายผลของการทำ Pledging Receivables ได้ถูกต้อง?", "Correct": "กิจการยังเป็นเจ้าของลูกหนี้และยังรับความเสี่ยงหนี้สูญ แม้ธนาคารมีสิทธิในเงินรับจากลูกหนี้เมื่อกิจการผิดนัดกู้", "Wrong 1": "ธนาคารซื้อขาดลูกหนี้และรับความเสี่ยงหนี้สูญทั้งหมดตั้งแต่วันให้เงินกู้", "Wrong 2": "กิจการไม่ต้องชำระคืนเงินกู้หากลูกหนี้ที่นำไปเป็นหลักประกันไม่จ่าย", "Wrong 3": "การนำลูกหนี้ไปค้ำประกันทำให้ลูกหนี้ทุกคนกลายเป็น Notes Receivable ของกิจการทันที", "Explanation": "Pledging คือการใช้ลูกหนี้เป็นประกันเงินกู้โดยไม่โอนกรรมสิทธิ์และความเสี่ยงหนี้สูญ ต่างจากการขายลูกหนี้ให้ Factor (สไลด์ 34)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581d08c2cdc245166ca4f", "Question": "หลังเปลี่ยนมาใช้ระบบบัญชีอัตโนมัติ บริษัทลดพนักงานจนคนเดียวมีสิทธิ์เพิ่มผู้ขาย อนุมัติจ่ายเงิน และตรวจทานรายการจ่ายด้วยตนเอง ข้อใดเป็นความเสี่ยงด้านการควบคุมภายในที่สำคัญที่สุดจากการเปลี่ยนแปลงนี้?", "Correct": "การสูญเสียการแบ่งแยกหน้าที่สำคัญ (Separation of duties) ทำให้ความผิดพลาดหรือทุจริตถูกปกปิดได้ง่ายขึ้น", "Wrong 1": "การทำงานอัตโนมัติทำให้ธุรกรรมทุกประเภทไม่มีหลักฐานตรวจสอบย้อนหลังได้เลย", "Wrong 2": "ระบบคอมพิวเตอร์เพิ่มความผิดพลาดด้านการบวกเลขโดยธรรมชาติ แม้ข้อมูลนำเข้าถูกต้อง", "Wrong 3": "ความเสี่ยงด้านทุจริตหมดไปทันที เพราะโปรแกรมเป็นผู้ประมวลผลแทนบุคคล", "Explanation": "การใช้เทคโนโลยีอาจรวมหน้าที่คนทำงานเข้าด้วยกันจนเสียการแบ่งแยกหน้าที่ที่สำคัญ จึงต้องออกแบบการติดตามและทบทวนโดยอิสระเพื่อจำกัดความเสี่ยง (สไลด์ 4)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581d898cac88c29f22ffc", "Question": "บริษัทได้รับเช็คจากลูกค้าทางไปรษณีย์ทุกวันและเคยพบว่าเช็คบางฉบับไม่ถูกฝากธนาคาร หากออกแบบการควบคุมตามบทเรียน วิธีใดช่วยให้ตรวจพบการขาดหายได้ดีที่สุด?", "Correct": "ให้คนเปิดจดหมายสองคนจัดทำรายการเช็ค 3 สำเนา ส่งเช็คพร้อมสำเนาให้ผู้ฝากธนาคาร ส่งอีกสำเนาให้ผู้บันทึกบัญชี และเก็บสำเนาที่เหลือไว้ตรวจเทียบ", "Wrong 1": "ให้พนักงานเปิดจดหมายคนเดียว รับเช็ค ฝากธนาคาร และปรับยอดลูกหนี้เอง เพื่อความรวดเร็ว", "Wrong 2": "ให้ผู้เก็บเงินฝากธนาคารออกใบรับรองยอดฝากของตนเองโดยไม่ต้องมีสำเนารายการจากฝ่ายอื่น", "Wrong 3": "เลื่อนการบันทึกลูกหนี้จนกว่าจะปิดงวดเพื่อไม่ให้ยอดเช็คกับยอดขายต่างกันระหว่างเดือน", "Explanation": "สไลด์แนะนำให้ผู้เปิดจดหมายสองคนทำบัญชีรายการรับเงินสามสำเนา แยกส่งให้ผู้ฝากธนาคารและผู้บันทึกบัญชี เพื่อให้ตรวจทานข้อมูลข้ามหน้าที่กันได้ (สไลด์ 12)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581d988d6de954c3bbc53", "Question": "ลูกค้าลงนามในตั๋วสัญญาใช้เงินว่าจะชำระเงินแก่ร้านค้าที่ขายสินค้าให้เมื่อถึงกำหนด ร้านค้าเป็นผู้ถือตั๋วและยังไม่ได้รับชำระ ข้อใดระบุ Maker, Payee และประเภทบัญชีของทั้งสองฝ่ายได้ถูกต้อง?", "Correct": "ลูกค้าเป็น Maker และบันทึก Notes Payable; ร้านค้าเป็น Payee และบันทึก Notes Receivable", "Wrong 1": "ร้านค้าเป็น Maker และบันทึก Notes Payable; ลูกค้าเป็น Payee และบันทึก Notes Receivable", "Wrong 2": "ลูกค้าเป็น Maker และบันทึก Notes Receivable; ร้านค้าเป็น Payee และบันทึก Notes Payable", "Wrong 3": "ลูกค้าและร้านค้าต่างเป็น Payee เพราะยังไม่ได้รับเงินสดทั้งคู่", "Explanation": "ผู้ลงนามรับปากจ่ายเงินคือ Maker (ผู้มีหนี้ Notes Payable) ส่วนผู้มีสิทธิรับเงินคือ Payee (ผู้มีสินทรัพย์ Notes Receivable) (สไลด์ 26)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258107b1a9e029a3bdfe14", "Question": "เมื่อเปรียบเทียบกับกิจการประเภทเดียวกัน บริษัทมีอัตราหมุนเวียนสินค้าคงเหลือ (Inventory Turnover) ต่ำมากอย่างต่อเนื่อง โดยเงื่อนไขอื่นใกล้เคียงกัน ข้อใดเป็นข้อบ่งชี้ที่เหมาะสมที่สุด?", "Correct": "บริษัทอาจถือสินค้าคงเหลือมากเกินความต้องการขาย สะท้อนการใช้สินทรัพย์ไม่คุ้มค่า", "Wrong 1": "บริษัทต้องมีสินค้าขาดสต็อกเพราะถือสินค้าไว้น้อยเกินไป", "Wrong 2": "ต้นทุนขายต้องสูงกว่าสินค้าคงเหลือเฉลี่ยหลายเท่าจึงทำให้อัตราต่ำ", "Wrong 3": "บริษัทต้องมีกำไรสุทธิสูงกว่าคู่แข่ง เพราะอัตราหมุนเวียนต่ำ", "Explanation": "Inventory Turnover ที่ต่ำกว่าคู่แข่งอาจบ่งชี้ว่าถือสินค้าคงเหลือมากเกินความจำเป็นและบริหารสินทรัพย์ไม่เต็มประสิทธิภาพ (Chapter 06, สไลด์ 33)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581329538f38feead1273", "Question": "ณ สิ้นปี บริษัทบันทึกสินค้าคงเหลือปลายงวดต่ำกว่าความเป็นจริง 7,500 บาท โดยไม่มีข้อผิดพลาดอื่น และไม่พิจารณาภาษีเงินได้ เมื่อเทียบกับจำนวนที่ถูกต้อง ต้นทุนขายและกำไรสุทธิของปีนั้นแสดงคลาดเคลื่อนอย่างไร?", "Correct": "ต้นทุนขายสูงเกิน 7,500 บาท และกำไรสุทธิต่ำเกิน 7,500 บาท", "Wrong 1": "ต้นทุนขายต่ำเกิน 7,500 บาท และกำไรสุทธิสูงเกิน 7,500 บาท", "Wrong 2": "ต้นทุนขายสูงเกิน 7,500 บาท และกำไรสุทธิสูงเกิน 7,500 บาท", "Wrong 3": "ต้นทุนขายไม่คลาดเคลื่อน แต่กำไรสุทธิต่ำเกิน 7,500 บาท", "Explanation": "ต้นทุนขาย = สินค้าต้นงวด + ต้นทุนซื้อสุทธิ − สินค้าปลายงวด หากสินค้าปลายงวดต่ำไป 7,500 บาท ต้นทุนขายจะสูงไป 7,500 บาท และกำไรสุทธิต่ำไปเท่ากัน (Chapter 06, สไลด์ 31–32)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258138b006cfbaacc0fe41", "Question": "เหตุใดวิธี Specific Identification แม้ระบุต้นทุนสินค้าที่ขายได้ตรงกับของจริงมาก แต่จึงมีข้อจำกัดสำหรับกิจการที่มีสินค้าจำนวนมาก?", "Correct": "ต้องติดตามต้นทุนของสินค้าแต่ละชิ้นอย่างเฉพาะเจาะจง ทำให้ต้นทุนในการติดตามข้อมูลสูง", "Wrong 1": "ต้องนำต้นทุนซื้อของเก่าที่สุดมาตัดเป็นต้นทุนขายเสมอ", "Wrong 2": "ต้องใช้ต้นทุนถัวเฉลี่ยเดียวกันกับสินค้าทุกชิ้นโดยไม่แยกชนิด", "Wrong 3": "ต้องตีราคาสินค้าคงเหลือทั้งหมดด้วยราคาขายปลีกโดยไม่คำนึงถึงต้นทุนเดิม", "Explanation": "Specific Identification ระบุต้นทุนของชิ้นที่ขายได้แม่นยำ แต่การติดตามต้นทุนเป็นรายชิ้นมีค่าใช้จ่ายสูง จึงมักเหมาะกับสินค้ามูลค่าสูงที่มีปริมาณขายไม่มาก (Chapter 06, สไลด์ 12, 24)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125813cbd7fffd31828a08f", "Question": "บริษัทใช้ระบบบันทึกสินค้าคงเหลือแบบต่อเนื่อง (Perpetual) และบันทึกรับ–จ่ายสินค้าตามเอกสารตลอดงวด เหตุใดจึงยังต้องตรวจนับสินค้าจริงอย่างน้อยเป็นระยะ?", "Correct": "เพื่อพบสินค้าที่สูญหาย ชำรุด เสื่อมสภาพ หรือถูกขโมย และปรับบัญชีให้ตรงกับสินค้าที่มีจริง", "Wrong 1": "เพื่อคำนวณยอดขายสุทธิแทนการใช้รายการขายในบัญชี", "Wrong 2": "เพื่อเปลี่ยนจากวิธี FIFO เป็น Weighted Average โดยอัตโนมัติทุกครั้งที่ตรวจนับ", "Wrong 3": "เพื่อให้ยอดสินค้าคงเหลือเท่ากับยอดสินค้าที่ลูกค้าสั่งซื้อ แม้ยังไม่ได้รับสินค้า", "Explanation": "แม้เป็นระบบ Perpetual แต่สินค้าจริงอาจต่างจากบันทึกเพราะชำรุด เสียหาย เสื่อมสภาพ หรือถูกขโมย จึงต้องนับจริงและปรับยอดให้ตรงกัน (Chapter 06, สไลด์ 7)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125813fbf21deda2c4d79ca", "Question": "บริษัทใช้ระบบ Perpetual และ FIFO มีสินค้าต้นงวด 5 หน่วย ต้นทุนหน่วยละ 40 บาท ซื้อเพิ่ม 8 หน่วย ต้นทุนหน่วยละ 50 บาท แล้วขายสินค้า 7 หน่วย ไม่มีรายการอื่น ต้องบันทึกเฉพาะรายการต้นทุนขายจากการขายครั้งนี้อย่างไร (ไม่ต้องบันทึกรายได้จากการขาย)?", "Correct": "เดบิต Cost of Goods Sold 300 บาท; เครดิต Merchandise Inventory 300 บาท", "Wrong 1": "เดบิต Merchandise Inventory 300 บาท; เครดิต Cost of Goods Sold 300 บาท", "Wrong 2": "เดบิต Cost of Goods Sold 350 บาท; เครดิต Merchandise Inventory 350 บาท", "Wrong 3": "เดบิต Cost of Goods Sold 280 บาท; เครดิต Merchandise Inventory 280 บาท", "Explanation": "ภายใต้ FIFO ต้นทุนขายของ 7 หน่วย = 5×40 + 2×50 = 300 บาท เมื่อขายภายใต้ Perpetual จึงเดบิต Cost of Goods Sold และเครดิต Merchandise Inventory จำนวน 300 บาท (Chapter 06, สไลด์ 15–18)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125814fb662ed9d52df6d0d", "Question": "บริษัทมียอดต้นทุนขายทั้งปี 600,000 บาท สินค้าคงเหลือต้นปี 80,000 บาท และ Inventory Turnover เท่ากับ 6 ครั้ง โดยกำหนดให้สินค้าคงเหลือเฉลี่ยคำนวณจาก (ต้นปี + ปลายปี) ÷ 2 สินค้าคงเหลือปลายปีเท่าใด?", "Correct": "120,000 บาท", "Wrong 1": "100,000 บาท", "Wrong 2": "20,000 บาท", "Wrong 3": "180,000 บาท", "Explanation": "สินค้าคงเหลือเฉลี่ย = 600,000÷6 = 100,000 บาท และ (80,000 + สินค้าปลายปี)÷2 = 100,000 จึงได้สินค้าปลายปี 120,000 บาท (Chapter 06, สไลด์ 33)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581788afdc23e76b9b703", "Question": "เมื่อกิจการซื้อสินค้าชนิดเดียวกันหลายครั้งในราคาที่ขึ้นลงไม่สม่ำเสมอ ข้อดีสำคัญของวิธี Weighted Average Cost ตามสไลด์คืออะไร?", "Correct": "ช่วยลดความผันผวนของต้นทุนต่อหน่วยที่เกิดจากราคาซื้อในแต่ละครั้ง", "Wrong 1": "ทำให้ต้นทุนสินค้าคงเหลือทุกหน่วยเท่ากับต้นทุนของการซื้อครั้งล่าสุดเสมอ", "Wrong 2": "ทำให้ทราบต้นทุนจริงของสินค้าแต่ละชิ้นโดยไม่ต้องติดตามหมายเลขสินค้า", "Wrong 3": "ทำให้มูลค่าสินค้าคงเหลือเท่ากับราคาขายสุทธิ (NRV) โดยอัตโนมัติ", "Explanation": "Weighted Average Cost กระจายผลของราคาซื้อที่ขึ้นลงผ่านต้นทุนเฉลี่ย จึงช่วยทำให้ความผันผวนของราคาที่ใช้กำหนดต้นทุนเรียบลง (Chapter 06, สไลด์ 19, 25)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581899468f2d8a97ca6c7", "Question": "ข้อใดจำแนก 'ระบบบันทึกสินค้าคงเหลือ' และ 'วิธีกำหนดต้นทุนสินค้า' ได้ถูกต้องตามการตัดสินใจด้านบัญชีสินค้าคงเหลือ?", "Correct": "ระบบบันทึก: Perpetual หรือ Periodic; วิธีกำหนดต้นทุน: FIFO, Weighted Average หรือ Specific Identification", "Wrong 1": "ระบบบันทึก: FIFO หรือ Weighted Average; วิธีกำหนดต้นทุน: Perpetual หรือ Periodic", "Wrong 2": "ระบบบันทึก: Cost หรือ NRV; วิธีกำหนดต้นทุน: Perpetual หรือ Periodic", "Wrong 3": "ระบบบันทึก: Perpetual หรือ FIFO; วิธีกำหนดต้นทุน: Periodic หรือ NRV", "Explanation": "การตัดสินใจเรื่องระบบบันทึก (Perpetual/Periodic) แยกจากการเลือกสมมติฐานการกำหนดต้นทุนสินค้า (Specific Identification, FIFO, Weighted Average) (Chapter 06, สไลด์ 9–10)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125819281d9e1d1e2af08c5", "Question": "บริษัทคำนวณ Days' Sales in Inventory ได้ 45 วัน (ใช้ปี 365 วัน) ตามความหมายของอัตราส่วน หากอัตราการขายคงที่และไม่มีการซื้อสินค้าเพิ่ม ควรตีความว่าอย่างไร?", "Correct": "สินค้าคงเหลือปลายงวดอาจรองรับการขายได้ประมาณ 45 วันตามอัตราต้นทุนขายเดิม", "Wrong 1": "สินค้าทุกชิ้นในคลังมีอายุการเก็บจริงเท่ากับ 45 วันเสมอ", "Wrong 2": "บริษัทจะเรียกเก็บเงินจากลูกหนี้การค้าได้ครบใน 45 วัน", "Wrong 3": "บริษัทต้องจำหน่ายสินค้าคงเหลือทุกชิ้นหมดใน 45 วันอย่างแน่นอน ไม่ว่าความต้องการซื้อจะเปลี่ยนอย่างไร", "Explanation": "Days' Sales in Inventory เป็นจำนวนวันที่สินค้าคงเหลือปลายงวดรองรับการขายได้ตามอัตราต้นทุนขายที่ใช้คำนวณ หากไม่มีการซื้อเพิ่ม ไม่ใช่อายุจริงของสินค้าทุกชิ้น (Chapter 06, สไลด์ 34)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581cbac54e807715e6f06", "Question": "บริษัทใช้ Perpetual FIFO มีสินค้าต้นงวด 10 หน่วย ต้นทุนหน่วยละ 91 บาท ซื้อเพิ่ม 15 หน่วย ต้นทุนหน่วยละ 106 บาท แล้วขายสินค้า 20 หน่วยในราคา 130 บาทต่อหน่วยทั้งหมดเป็นการขายเชื่อ ไม่มีรายการอื่น กำไรขั้นต้นจากการขายครั้งนี้เท่าใด (ไม่รวมค่าใช้จ่ายดำเนินงาน)?", "Correct": "630 บาท", "Wrong 1": "600 บาท", "Wrong 2": "2,600 บาท", "Wrong 3": "1,970 บาท", "Explanation": "รายได้ขาย = 20×130 = 2,600 บาท ต้นทุนขาย FIFO = 10×91 + 10×106 = 1,970 บาท ดังนั้นกำไรขั้นต้น = 630 บาท (Chapter 06, สไลด์ 14–16)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125813abb2ec5b7eef6af3e", "Question": "บริษัทเป็นผู้ซื้อสินค้าตามเงื่อนไข FOB Destination (ปลายทางคือคลังของผู้ซื้อ) ณ วันสิ้นงวด สินค้ายังอยู่ระหว่างขนส่งและยังไม่ถึงคลัง ใครยังเป็นเจ้าของสินค้า และใครต้องรับผิดชอบค่าขนส่งตามเงื่อนไขนี้?", "Correct": "ผู้ขายยังเป็นเจ้าของสินค้า และผู้ขายรับผิดชอบค่าขนส่ง", "Wrong 1": "ผู้ซื้อเป็นเจ้าของสินค้า และผู้ซื้อรับผิดชอบค่าขนส่ง", "Wrong 2": "ผู้ขายยังเป็นเจ้าของสินค้า แต่ผู้ซื้อรับผิดชอบค่าขนส่ง", "Wrong 3": "ผู้ซื้อเป็นเจ้าของสินค้า แต่ผู้ขายรับผิดชอบค่าขนส่ง", "Explanation": "ภายใต้ FOB Destination กรรมสิทธิ์โอนเมื่อสินค้าถึงผู้ซื้อ ผู้ขายจึงเป็นเจ้าของระหว่างทางและรับผิดชอบค่าขนส่ง (สไลด์ 3)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125813e82dccd2f12cd2b95", "Question": "ร้านค้าหนึ่งมีอัตราหมุนเวียนสินค้าคงเหลือ (Inventory Turnover) สูงกว่าคู่แข่งมาก แต่เกิดสินค้าขาดสต็อกบ่อยจนลูกค้าต้องสั่งรอ จากแนวอธิบายในสไลด์ ข้อใดเหมาะสมที่สุด?", "Correct": "สินค้าคงเหลืออาจต่ำเกินไปจนทำให้สูญเสียโอกาสขาย แม้อัตราหมุนเวียนจะสูง", "Wrong 1": "กิจการถือสินค้าคงเหลือมากเกินความจำเป็น จึงทำให้สินค้าขาดสต็อก", "Wrong 2": "ต้นทุนขายต่ำมากเมื่อเทียบกับสินค้าคงเหลือเฉลี่ย จึงมีอัตราหมุนเวียนสูง", "Wrong 3": "อัตราหมุนเวียนสูงยืนยันว่าปริมาณสินค้าพอเสมอ แม้ลูกค้าจะต้องรอสินค้า", "Explanation": "อัตราหมุนเวียนที่สูงมากเทียบคู่แข่งอาจบ่งชี้ว่าถือสินค้าคงเหลือน้อยเกินไป ทำให้ลูกค้าต้องรอสินค้าและเกิดยอดขายที่สูญเสีย (สไลด์ 33)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258142b89ed7e0d0a36a60", "Question": "เหตุใดสินค้าคงเหลือปลายงวดที่ตีราคาด้วย FIFO จึงมักมีมูลค่าใกล้เคียงต้นทุนทดแทนปัจจุบันมากกว่าวิธีถัวเฉลี่ย เมื่อราคาซื้อเปลี่ยนแปลง?", "Correct": "เพราะ FIFO คงต้นทุนจากการซื้อครั้งใหม่กว่าไว้ในสินค้าคงเหลือปลายงวด", "Wrong 1": "เพราะ FIFO ปรับสินค้าคงเหลือทุกหน่วยเป็นราคาตลาดล่าสุดโดยอัตโนมัติ", "Wrong 2": "เพราะ FIFO ใช้ต้นทุนถัวเฉลี่ยเพื่อทำให้ความผันผวนของราคาเรียบลง", "Wrong 3": "เพราะ FIFO บันทึกต้นทุนเฉพาะของสินค้าทุกชิ้นตามหมายเลขประจำสินค้า", "Explanation": "FIFO ใช้ต้นทุนเก่าก่อนกับต้นทุนขาย จึงเหลือต้นทุนซื้อใหม่กว่าในสินค้าคงเหลือ ซึ่งมักใกล้ต้นทุนทดแทนปัจจุบัน (สไลด์ 15, 25)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258163b7e1d2003c2c0aa3", "Question": "กิจการใช้ FIFO เพื่อกำหนดต้นทุนสินค้าคงเหลือ ข้อใดถูกต้องเกี่ยวกับสมมติฐานการไหลของต้นทุนกับการเคลื่อนย้ายสินค้าจริง?", "Correct": "FIFO เป็นสมมติฐานการไหลของต้นทุน ซึ่งไม่จำเป็นต้องตรงกับลำดับการหยิบสินค้าจริง", "Wrong 1": "FIFO ใช้ได้ต่อเมื่อสินค้าทุกชิ้นถูกหยิบออกจากคลังตามลำดับเก่าก่อนไหม่จริงเท่านั้น", "Wrong 2": "FIFO กำหนดให้ต้นทุนซื้อครั้งล่าสุดเป็นต้นทุนขายก่อน", "Wrong 3": "FIFO ใช้ต้นทุนเฉลี่ยต่อหน่วยจากสินค้าที่มีอยู่ทุกครั้งก่อนบันทึกต้นทุนขาย", "Explanation": "สไลด์ระบุว่าการเลือกสมมติฐานการไหลของต้นทุนไม่จำเป็นต้องตรงกับการเคลื่อนย้ายทางกายภาพของสินค้า โดย FIFO จัดต้นทุนเก่าก่อนเป็นต้นทุนขาย (สไลด์ 9–10, 15)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581c080cfea20cf88ee5f", "Question": "บริษัทใช้หลัก Lower of Cost and NRV แยกประเมินสินค้าคงเหลือเป็นรายรายการ ณ สิ้นงวดมีสินค้า A ต้นทุน 92,000 บาท NRV 81,000 บาท; B ต้นทุน 45,000 บาท NRV 49,000 บาท; C ต้นทุน 38,000 บาท NRV 33,000 บาท ไม่มีสินค้าอื่น ต้องรายงานสินค้าคงเหลือรวมเท่าใด?", "Correct": "159,000 บาท", "Wrong 1": "163,000 บาท", "Wrong 2": "175,000 บาท", "Wrong 3": "164,000 บาท", "Explanation": "ประเมินทีละรายการโดยใช้ค่าที่ต่ำกว่า: A 81,000 + B 45,000 + C 33,000 = 159,000 บาท ไม่ใช่เปรียบเทียบยอดรวมต้นทุนกับยอดรวม NRV (สไลด์ 27–29)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581e1aaccf8855719bbbe", "Question": "กิจการเปลี่ยนวิธีตีราคาสินค้าคงเหลือจากวิธีเดิมเป็นอีกวิธีหนึ่งเพื่อให้รายงานทางการเงินดีขึ้น ข้อใดเป็นการเปิดเผยข้อมูลที่สอดคล้องกับหลัก Consistency ตามสไลด์?", "Correct": "เปิดเผยลักษณะการเปลี่ยน เหตุผลที่เปลี่ยน และผลกระทบต่อกำไรในหมายเหตุประกอบงบการเงิน", "Wrong 1": "ไม่ต้องเปิดเผยการเปลี่ยนแปลงหากฝ่ายบริหารอนุมัติแล้ว", "Wrong 2": "เปิดเผยเฉพาะชื่อวิธีใหม่โดยไม่ระบุเหตุผลหรือผลต่อกำไร", "Wrong 3": "ห้ามเปลี่ยนวิธีตีราคาสินค้าคงเหลือไม่ว่ากรณีใดก็ตาม", "Explanation": "เมื่อการเปลี่ยนวิธีช่วยปรับปรุงการรายงาน กิจการเปลี่ยนได้แต่ต้องเปิดเผยประเภทการเปลี่ยน เหตุผล และผลกระทบต่อกำไรในหมายเหตุประกอบงบการเงิน (สไลด์ 26)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581efa0c7e176d289d94a", "Question": "สำหรับสินค้าคงเหลือภายใต้ระบบ Perpetual ข้อใดจับคู่รายการกับงบการเงินที่แสดงรายการนั้นได้ถูกต้อง?", "Correct": "Ending Inventory เป็นสินทรัพย์หมุนเวียนในงบแสดงฐานะการเงิน และ Cost of Goods Sold อยู่ในงบกำไรขาดทุน", "Wrong 1": "Ending Inventory และ Cost of Goods Sold อยู่ในงบแสดงฐานะการเงินทั้งคู่", "Wrong 2": "Ending Inventory และ Cost of Goods Sold อยู่ในงบกำไรขาดทุนทั้งคู่", "Wrong 3": "Ending Inventory อยู่ในงบกำไรขาดทุน และ Cost of Goods Sold เป็นสินทรัพย์หมุนเวียน", "Explanation": "สินค้าคงเหลือปลายงวดแสดงเป็นสินทรัพย์หมุนเวียนในงบแสดงฐานะการเงิน ส่วนต้นทุนขายเป็นรายการในงบกำไรขาดทุน (สไลด์ 8)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581f69921f48e951b4d5b", "Question": "ณ วันสิ้นงวด บริษัทมีสินค้าล้าสมัยซึ่งเสียหายจนไม่สามารถนำไปขายได้อีก และไม่มีมูลค่าซาก ตามสไลด์บท 06 ควรปฏิบัติต่อสินค้านี้อย่างไร?", "Correct": "ไม่นับรวมเป็นสินค้าคงเหลือที่มีมูลค่า เพราะขายไม่ได้และไม่มีมูลค่าซาก", "Wrong 1": "รายงานเป็นสินค้าคงเหลือด้วยต้นทุนเดิมเต็มจำนวน", "Wrong 2": "เพิ่มต้นทุนของสินค้าล้าสมัยด้วยค่าใช้จ่ายในการจัดเก็บ", "Wrong 3": "ประเมินด้วยราคาขายปลีกเดิมโดยไม่คำนึงถึงสภาพสินค้า", "Explanation": "สินค้าที่เสียหายหรือล้าสมัยจนขายไม่ได้ไม่ควรนับเป็นสินค้าคงเหลือที่มีมูลค่า ต่างจากสินค้าที่ขายลดราคาได้ซึ่งประเมินตาม NRV (สไลด์ 5)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125815aaad3e5e80db15332", "Question": "ณ วันสิ้นงวด สินค้าหนึ่งรายการมีต้นทุน 35,000 บาท คาดว่าจะขายได้ 40,000 บาท ต้องจ่ายค่าทำให้สินค้าเสร็จสมบูรณ์ 4,000 บาท และค่าใช้จ่ายจำเป็นในการขาย 2,000 บาท ตาม Lower of Cost and NRV ควรรายงานสินค้ารายการนี้เท่าใด?", "Correct": "34,000 บาท", "Wrong 1": "35,000 บาท", "Wrong 2": "36,000 บาท", "Wrong 3": "40,000 บาท", "Explanation": "NRV = 40,000−4,000−2,000 = 34,000 บาท ซึ่งต่ำกว่าต้นทุน 35,000 บาท จึงรายงานมูลค่า 34,000 บาท (สไลด์ 27)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581798d15cdeb142730c2", "Question": "ระหว่างการตรวจนับสินค้าคงเหลือปลายปี ข้อใดเป็นแนวทางควบคุมภายในที่สไลด์แนะนำเพื่อให้ผลนับน่าเชื่อถือ?", "Correct": "ให้ผู้ตรวจนับไม่มีหน้าที่รับผิดชอบสินค้าคงเหลือ และจัดให้มีการนับทวนอีกครั้ง", "Wrong 1": "ให้พนักงานผู้ดูแลสต็อกนับเพียงคนเดียวเพื่อให้ทำงานได้รวดเร็ว", "Wrong 2": "ใช้บัตรตรวจนับที่ไม่มีเลขกำกับเพราะช่วยลดขั้นตอน", "Wrong 3": "ใช้ยอดในบัญชีแทนการตรวจนับสินค้าจริงทั้งหมด", "Explanation": "ผู้ตรวจนับควรแยกจากผู้รับผิดชอบสินค้าคงเหลือ และควรมีการนับครั้งที่สองเพื่อช่วยตรวจพบข้อผิดพลาด (สไลด์ 7)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125817ab52dd69b8072158b", "Question": "ณ วันสิ้นงวด สินค้าคงเหลือมีต้นทุนต่ำกว่ามูลค่าสุทธิที่จะได้รับ (NRV) บริษัทควรรายงานสินค้าอย่างไร?", "Correct": "รายงานที่ต้นทุนเดิม และไม่ปรับเพิ่มมูลค่าขึ้นเป็น NRV", "Wrong 1": "ปรับมูลค่าสินค้าขึ้นเป็น NRV ที่สูงกว่าเสมอ", "Wrong 2": "บันทึกผลขาดทุนจากการปรับมูลค่าทั้งที่ NRV สูงกว่าต้นทุน", "Wrong 3": "ตัดสินค้าคงเหลือออกจากบัญชีทั้งหมด", "Explanation": "หลัก Lower of Cost and NRV ให้ใช้มูลค่าที่ต่ำกว่า หากต้นทุนต่ำกว่า NRV อยู่แล้วก็ไม่ต้องปรับมูลค่า (สไลด์ 27)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258188bbbafb6768ed1e1e", "Question": "สินค้าประเภทใดเหมาะสมที่สุดกับวิธีตีราคาสินค้าคงเหลือแบบระบุต้นทุนเฉพาะ (Specific Identification)?", "Correct": "เครื่องประดับมูลค่าสูงที่ติดตามต้นทุนของแต่ละชิ้นได้", "Wrong 1": "ข้าวสารชนิดเดียวกันที่จำหน่ายจำนวนมาก", "Wrong 2": "น้ำมันเชื้อเพลิงชนิดเดียวกันที่เก็บรวมในถัง", "Wrong 3": "กระดาษถ่ายเอกสารรุ่นเดียวกันจำนวนมาก", "Explanation": "Specific Identification เหมาะกับสินค้ามูลค่าสูงที่ระบุได้แน่ชัดว่าต้นทุนของสินค้าชิ้นใดเป็นเท่าใด เช่น เครื่องประดับหรือรถยนต์ (สไลด์ 12)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258196aaa6c81c569519e0", "Question": "บริษัทซื้อสินค้าเพื่อจำหน่าย รายการใดควรรวมเป็นต้นทุนสินค้าคงเหลือตามหลักที่เรียน?", "Correct": "ค่าขนส่งเข้าที่จำเป็นในการนำสินค้ามายังสถานที่ขาย", "Wrong 1": "ค่าขนส่งเพื่อส่งสินค้าที่ขายแล้วไปให้ลูกค้า", "Wrong 2": "ค่าโฆษณาที่จ่ายเพื่อส่งเสริมการขาย", "Wrong 3": "ส่วนลดซื้อที่ได้รับจากผู้ขายโดยบวกเพิ่มในต้นทุนสินค้า", "Explanation": "ต้นทุนสินค้าคงเหลือรวมค่าใช้จ่ายที่จำเป็นเพื่อให้สินค้าอยู่ในสถานที่และสภาพพร้อมขาย เช่น ค่าขนส่งเข้า ส่วนส่วนลดซื้อหักลดต้นทุน (สไลด์ 6)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125819e8988e0d0fc290255", "Question": "บริษัทซื้อสินค้าหนึ่งล็อตเพื่อขาย โดยมีราคาใบแจ้งหนี้ 30,000 บาท ได้รับส่วนลดซื้อ 2,000 บาท จ่ายภาษีนำเข้า 1,000 บาท ค่าประกันสินค้าระหว่างขนส่ง 500 บาท และค่าขนส่งเข้า 800 บาท ไม่มีต้นทุนอื่นที่เกี่ยวข้อง ต้นทุนสินค้าล็อตนี้เท่าใด?", "Correct": "30,300 บาท", "Wrong 1": "32,300 บาท", "Wrong 2": "29,500 บาท", "Wrong 3": "29,300 บาท", "Explanation": "ต้นทุนสินค้า = ราคาใบแจ้งหนี้ − ส่วนลดซื้อ + ภาษีนำเข้า + ประกันระหว่างขนส่ง + ค่าขนส่งเข้า = 30,000−2,000+1,000+500+800 = 30,300 บาท (สไลด์ 6)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581a79579f057bd14cc5b", "Question": "บริษัทใช้ระบบสินค้าคงเหลือแบบต่อเนื่อง (Perpetual) และวิธี FIFO: ต้นงวดมี 8 หน่วย หน่วยละ 100 บาท ซื้อเพิ่ม 6 หน่วย หน่วยละ 120 บาท แล้วขาย 10 หน่วย ต่อมาซื้ออีก 6 หน่วย หน่วยละ 130 บาท แล้วขาย 5 หน่วย ไม่มีรายการสินค้าอื่น ต้นทุนขายรวมจากการขายทั้งสองครั้งเท่าใด?", "Correct": "1,650 บาท", "Wrong 1": "1,770 บาท", "Wrong 2": "1,040 บาท", "Wrong 3": "1,690 บาท", "Explanation": "ขายครั้งแรกใช้ 8×100 + 2×120 = 1,040 บาท ครั้งที่สองใช้ 4×120 + 1×130 = 610 บาท รวมต้นทุนขาย 1,650 บาท (สไลด์ 15–17)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581d3af26e0bbc02d588a", "Question": "บริษัทจำหน่ายรถยนต์ที่ระบุต้นทุนแต่ละคันได้ และใช้ Specific Identification มีรถ A ต้นทุน 100,000 บาท รถ B 110,000 บาท รถ C 125,000 บาท และรถ D 140,000 บาท ในงวดนี้ขายเฉพาะรถ A และ D ไม่มีการขายหรือคืนสินค้าอื่น ต้นทุนขายรวมเท่าใด?", "Correct": "240,000 บาท", "Wrong 1": "225,000 บาท", "Wrong 2": "265,000 บาท", "Wrong 3": "210,000 บาท", "Explanation": "Specific Identification ใช้ต้นทุนจริงของรถที่ขาย คือรถ A 100,000 บาท และรถ D 140,000 บาท รวมต้นทุนขาย 240,000 บาท (สไลด์ 12–13)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581e89563f5975e1e2498", "Question": "เมื่อราคาซื้อสินค้าสูงขึ้นอย่างต่อเนื่อง หากยอดขายและค่าใช้จ่ายอื่นเท่ากัน วิธี FIFO เทียบกับ Weighted Average Cost มักส่งผลต่อกำไรอย่างไร?", "Correct": "FIFO มักให้กำไรสูงกว่า เพราะนำต้นทุนเก่าที่ต่ำกว่ามาเป็นต้นทุนขาย", "Wrong 1": "Weighted Average Cost มักให้กำไรสูงกว่า เพราะใช้ต้นทุนซื้อครั้งล่าสุดทั้งหมด", "Wrong 2": "ทั้งสองวิธีทำให้กำไรเท่ากันเสมอ แม้ต้นทุนซื้อเปลี่ยนแปลง", "Wrong 3": "FIFO มักให้กำไรต่ำกว่า เพราะนำต้นทุนซื้อครั้งล่าสุดมาเป็นต้นทุนขาย", "Explanation": "เมื่อราคาสินค้าสูงขึ้น FIFO ใช้ต้นทุนเก่าที่ต่ำกว่าเป็นต้นทุนขาย จึงมักมีต้นทุนขายต่ำและกำไรสูงกว่า Weighted Average Cost (สไลด์ 24)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f02984125810dbd48d6e3d6e65c50", "Question": "ก่อนปรับปรุง Allowance for Doubtful Accounts มียอดคงเหลือด้านเดบิต $300 วิธี aging of receivables ประมาณว่ายอดค่าเผื่อที่ควรมีคือ $2,270 ต้องบันทึก Bad Debts Expense เท่าใด?", "Correct": "$2,570", "Wrong 1": "$1,970", "Wrong 2": "$2,270", "Wrong 3": "$300", "Explanation": "ยอดเดบิต $300 ต้องล้างให้เป็นศูนย์ก่อน แล้วเพิ่มให้ถึงยอดเครดิตที่ต้องการ $2,270 จึงบันทึก $2,270 + $300 = $2,570 (บท 9 สไลด์ 22–24)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f029841258134b236cac142575e17", "Question": "บริษัทใช้สมุดรายวันเฉพาะครบ 4 เล่ม การขายสินค้าเป็นเงินสดต้องบันทึกในสมุดเล่มใด?", "Correct": "Cash receipts journal", "Wrong 1": "Sales journal", "Wrong 2": "General journal", "Wrong 3": "Cash disbursements journal", "Explanation": "การรับเงินสดทุกประเภท รวมถึงการขายเงินสด บันทึกใน cash receipts journal ส่วน sales journal ใช้เฉพาะขายเชื่อ (บท 7 สไลด์ 8 และ 12)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f02984125813c8884effcbe4d7871", "Question": "หลังผ่านรายการครบแล้ว ยอดคงเหลือของบัญชีคุม Accounts Receivable ในบัญชีแยกประเภททั่วไปควรเท่ากับยอดใด?", "Correct": "ผลรวมยอดคงเหลือของลูกค้าทุกรายในบัญชีแยกประเภทย่อยลูกหนี้", "Wrong 1": "ยอดรวมคอลัมน์ขายใน sales journal ของเดือนนั้น", "Wrong 2": "ผลรวมยอดคงเหลือในบัญชีแยกประเภทย่อยเจ้าหนี้", "Wrong 3": "ยอดขายเงินสดรวมทั้งเดือน", "Explanation": "บัญชีคุม AR ต้องเท่ากับผลรวมบัญชีลูกค้าแต่ละรายใน subsidiary ledger ซึ่งพิสูจน์ได้ด้วย schedule of accounts receivable (บท 7 สไลด์ 7 และ 9)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f0298412581528c04d6164e3928f9", "Question": "ข้อใดเป็นข้อดีของ allowance method เมื่อเทียบกับ direct write-off method?", "Correct": "รับรู้ค่าใช้จ่ายหนี้สูญโดยประมาณในงวดเดียวกับที่บันทึกยอดขายที่เกี่ยวข้อง", "Wrong 1": "รับรู้หนี้สูญเฉพาะเมื่อรู้แน่ชัดว่าลูกค้ารายใดไม่จ่าย", "Wrong 2": "ไม่ต้องใช้การประมาณใด ๆ", "Wrong 3": "ทำให้กำไรสุทธิสูงขึ้นทุกงวด", "Explanation": "Allowance method จับคู่ค่าใช้จ่ายหนี้สูญกับยอดขายในงวดเดียวกัน และแสดงลูกหนี้ด้วยมูลค่าที่คาดว่าจะเก็บได้ ส่วนการรับรู้เมื่อรู้แน่ชัดเป็นลักษณะของ direct write-off (บท 9 สไลด์ 10 และ 12)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f02984125815998a7e79594fa70dc", "Question": "บริษัทใช้สมุดรายวันเฉพาะครบ 4 เล่ม (sales, cash receipts, purchases, cash disbursements) รายการใดยังต้องบันทึกในสมุดรายวันทั่วไป?", "Correct": "การส่งคืนสินค้าที่ซื้อ (purchase returns and allowances)", "Wrong 1": "การจ่ายเงินเดือนพนักงานเป็นเงินสด", "Wrong 2": "การรับชำระหนี้จากลูกค้า", "Wrong 3": "การขายสินค้าเป็นเงินเชื่อ", "Explanation": "สมุดรายวันทั่วไปใช้กับรายการที่ไม่มีสมุดเฉพาะรองรับ เช่น รายการปรับปรุง รายการปิดบัญชี และการส่งคืนสินค้า ส่วนจ่ายเงินเดือนเงินสดอยู่ใน cash disbursements และรับชำระหนี้อยู่ใน cash receipts (บท 7 สไลด์ 17)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f029841258159bda0e2b521758878", "Question": "บริษัทมียอดขายสุทธิ $480,000 ลูกหนี้สุทธิต้นปี $36,000 และปลายปี $44,000 อัตราการหมุนเวียนของลูกหนี้ (accounts receivable turnover) เท่ากับเท่าใด?", "Correct": "12.0 ครั้ง", "Wrong 1": "13.3 ครั้ง", "Wrong 2": "10.9 ครั้ง", "Wrong 3": "6.0 ครั้ง", "Explanation": "AR turnover = ยอดขายสุทธิ ÷ ลูกหนี้สุทธิเฉลี่ย = $480,000 ÷ (($36,000 + $44,000) ÷ 2) = $480,000 ÷ $40,000 = 12 ครั้ง (บท 9 สไลด์ 35)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f02984125816489ffef469e276fc1", "Question": "Segment หนึ่งมีกำไรจากการดำเนินงาน $36,000 สินทรัพย์ของ segment ต้นปี $280,000 และปลายปี $320,000 Segment return on assets เท่ากับเท่าใด?", "Correct": "12.0%", "Wrong 1": "12.9%", "Wrong 2": "11.25%", "Wrong 3": "6.0%", "Explanation": "Segment ROA = กำไรจากการดำเนินงาน ÷ สินทรัพย์เฉลี่ย = $36,000 ÷ (($280,000 + $320,000) ÷ 2) = $36,000 ÷ $300,000 = 12% (บท 7 สไลด์ 23)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f0298412581779369c64a3bb21ae5", "Question": "GlobeCom มีค่าเผื่อหนี้สงสัยจะสูญยอดเครดิต $1,700 ลูกหนี้รวมปลายงวด $71,200 ในนั้นมีลูกหนี้ IslandCom $6,000 ที่ประเมินรายตัวว่าจะเก็บไม่ได้ 10% ลูกหนี้ส่วนที่เหลือประเมินแบบกลุ่มว่าจะเก็บไม่ได้ 2% ต้องบันทึก Bad Debts Expense เพิ่มเท่าใด?", "Correct": "$204", "Wrong 1": "$1,904", "Wrong 2": "$324", "Wrong 3": "$1,424", "Explanation": "ยอดค่าเผื่อที่ต้องการ = 10% × $6,000 + 2% × ($71,200 − $6,000) = $600 + $1,304 = $1,904 หักยอดเดิม $1,700 จึงบันทึกเพิ่ม $204 (บท 9 สไลด์ 25)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f02984125817994b8fc373a47ebb3", "Question": "ตั๋วเงินรับอายุ 60 วัน ลงวันที่ 15 มีนาคม จะครบกำหนดวันใด?", "Correct": "14 พฤษภาคม", "Wrong 1": "15 พฤษภาคม", "Wrong 2": "13 พฤษภาคม", "Wrong 3": "16 พฤษภาคม", "Explanation": "นับวันที่เหลือในเดือนมีนาคม 31 − 15 = 16 วัน บวกเมษายน 30 วัน รวม 46 วัน ต้องการอีก 14 วัน จึงครบกำหนด 14 พฤษภาคม (บท 9 สไลด์ 27)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f02984125817d833bc5dec612b9f3", "Question": "อุปกรณ์ใดจัดเป็น input device ของระบบบัญชี?", "Correct": "Bar-code reader", "Wrong 1": "Printer", "Wrong 2": "Hard drive", "Wrong 3": "Monitor", "Explanation": "Input device รับข้อมูลจากเอกสารต้นทางเข้าสู่ระบบ เช่น keyboard, scanner, bar-code reader ส่วน printer และ monitor เป็น output device และ hard drive เป็นที่เก็บข้อมูล (บท 7 สไลด์ 3–4)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f029841258187bd8df216e81abd95", "Question": "ในช่อง PR ของบัญชีแยกประเภทย่อย ตัวอักษร R ระบุว่ารายการนั้นผ่านมาจากสมุดเล่มใด?", "Correct": "Cash receipts journal", "Wrong 1": "Sales returns and allowances journal", "Wrong 2": "Purchases journal", "Wrong 3": "General journal", "Explanation": "อักษรย่อสมุด: S = sales, R = cash receipts, D = cash disbursements, P = purchases, G = general (บท 7 สไลด์ 8)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f029841258191ba9ecafe1593854f", "Question": "บริษัทใช้สมุดรายวันเฉพาะครบ 4 เล่ม การซื้อสินค้าเป็นเงินเชื่อต้องบันทึกในสมุดเล่มใด?", "Correct": "Purchases journal", "Wrong 1": "Cash disbursements journal", "Wrong 2": "General journal", "Wrong 3": "Sales journal", "Explanation": "Purchases journal ใช้บันทึกการซื้อเป็นเงินเชื่อ การซื้อเงินสดบันทึกใน cash disbursements journal (บท 7 สไลด์ 14 และ 16)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f0298412581bb9ce5fbbc2776c03d", "Question": "สิ้นเดือน sales journal (ระบบ perpetual) มียอดรวมคอลัมน์ขาย $2,150 และคอลัมน์ต้นทุน $1,500 การผ่านรายการยอดรวมไปบัญชีแยกประเภททั่วไปข้อใดถูกต้อง?", "Correct": "Dr AR $2,150; Cr Sales $2,150 และ Dr COGS $1,500; Cr Inventory $1,500", "Wrong 1": "Dr AR $1,500; Cr Sales $1,500 และ Dr COGS $2,150; Cr Inventory $2,150", "Wrong 2": "Dr Cash $2,150; Cr Sales $2,150 และ Dr COGS $1,500; Cr Inventory $1,500", "Wrong 3": "Dr AR $2,150; Cr Sales $2,150 เท่านั้น ไม่ต้องผ่านคอลัมน์ต้นทุน", "Explanation": "คอลัมน์ขายผ่านไป Dr AR / Cr Sales และคอลัมน์ต้นทุนผ่านไป Dr COGS / Cr Inventory ตามระบบ perpetual (บท 7 สไลด์ 8)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f0298412581bdadd0d1c8532d5bb1", "Question": "บริษัทใช้วิธี direct write-off และเคยตัดบัญชี J. Kent $520 เป็นหนี้สูญไปแล้ว ต่อมา J. Kent นำเงินมาชำระเต็มจำนวน รายการแรกที่ต้องบันทึกคืออะไร?", "Correct": "Dr Accounts Receivable—J. Kent $520; Cr Bad Debts Expense $520", "Wrong 1": "Dr Accounts Receivable—J. Kent $520; Cr Allowance for Doubtful Accounts $520", "Wrong 2": "Dr Cash $520; Cr Sales $520", "Wrong 3": "Dr Bad Debts Expense $520; Cr Accounts Receivable—J. Kent $520", "Explanation": "วิธี direct write-off ต้องกลับรายการตัดหนี้ก่อนด้วย Dr AR / Cr Bad Debts Expense แล้วจึงบันทึกรับเงิน Dr Cash / Cr AR (บท 9 สไลด์ 11)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f0298412581ccacb9d006f1db7e7b", "Question": "บริษัทถือตั๋วเงินรับ $1,200 ดอกเบี้ย 10% อายุ 90 วัน (ใช้ปีละ 360 วัน) เมื่อครบกำหนดผู้ออกตั๋วไม่ชำระ (dishonored) ต้องบันทึกอย่างไร?", "Correct": "Dr Accounts Receivable $1,230; Cr Interest Revenue $30; Cr Notes Receivable $1,200", "Wrong 1": "Dr Accounts Receivable $1,200; Cr Notes Receivable $1,200", "Wrong 2": "Dr Bad Debts Expense $1,230; Cr Notes Receivable $1,230", "Wrong 3": "Dr Cash $1,230; Cr Interest Revenue $30; Cr Notes Receivable $1,200", "Explanation": "ดอกเบี้ย = $1,200 × 10% × 90/360 = $30 การไม่ชำระไม่ได้ทำให้หนี้หมดไป จึงโอนเงินต้นและดอกเบี้ยไปเป็นลูกหนี้ $1,230 (บท 9 สไลด์ 31)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f0298412581d48e07e7eb3c5254f6", "Question": "วันที่ 1 ธันวาคม บริษัทรับตั๋วเงิน $6,000 อายุ 60 วัน ดอกเบี้ย 10% (ใช้ปีละ 360 วัน) งวดบัญชีสิ้นสุด 31 ธันวาคม ต้องบันทึกดอกเบี้ยค้างรับเท่าใด?", "Correct": "$50", "Wrong 1": "$100", "Wrong 2": "$600", "Wrong 3": "$49.32", "Explanation": "ดอกเบี้ยค้างรับ 30 วัน = $6,000 × 10% × 30/360 = $50 บันทึก Dr Interest Receivable / Cr Interest Revenue (บท 9 สไลด์ 32)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f0298412581ef9345c46fe431a614", "Question": "ข้อดีหลักของ online processing เมื่อเทียบกับ batch processing คืออะไร?", "Correct": "ข้อมูลในระบบเป็นปัจจุบันทันที (timeliness)", "Wrong 1": "ต้นทุนซอฟต์แวร์และฮาร์ดแวร์ต่ำกว่า", "Wrong 2": "ประมวลผลรวดเดียวเป็นงวด เช่น สัปดาห์ละครั้ง", "Wrong 3": "ไม่ต้องใช้เอกสารต้นทาง", "Explanation": "Online processing บันทึกและประมวลผลทันทีที่มีเอกสาร ข้อดีคือความทันเวลา แต่มักมีต้นทุนสูงกว่า ส่วน batch processing ประมวลผลเป็นงวด (บท 7 สไลด์ 19)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f0298412581f9b1afc673bec7cdba", "Question": "หลักของระบบสารสนเทศทางการบัญชี (AIS) ข้อใดกำหนดให้ระบบต้องปรับตัวได้เมื่อธุรกิจ เทคโนโลยี หรือกฎระเบียบเปลี่ยนไป?", "Correct": "Flexibility principle", "Wrong 1": "Compatibility principle", "Wrong 2": "Relevance principle", "Wrong 3": "Control principle", "Explanation": "Flexibility principle กำหนดให้ AIS ปรับตัวได้ตามการเปลี่ยนแปลงของบริษัท สภาพแวดล้อม และความต้องการของผู้ใช้ ส่วน compatibility คือการเข้ากับโครงสร้างและบุคลากรของบริษัท (บท 7 สไลด์ 2)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f02984125814d8d1bd2f935cc66c5", "Question": "TechCom sells merchandise on credit to CompStore for $950. Record only the sale and the receivable (ignore the cost of goods sold entry). What is the entry?", "Correct": "เดบิต Accounts Receivable $950; เครดิต Sales $950", "Wrong 1": "เดบิต Cash $950; เครดิต Sales $950", "Wrong 2": "เดบิต Sales $950; เครดิต Accounts Receivable $950", "Wrong 3": "เดบิต Accounts Receivable $950; เครดิต Cash $950", "Explanation": "การขายเป็นเงินเชื่อทำให้ลูกหน merchandise for $100 to a customer paying by credit card. The credit card company charges a 4% fee and pays TechCom cash immediately. Record only the sale and the fee (ignore the cost of goods sold entry). What is the entry?", "Correct": "เดบิต Cash $96 และ Credit Card Expense $4; เครดิต Sales $100", "Wrong 1": "เดบิต Cash $100; เครดิต Sales $100", "Wrong 2": "เดบิต Accounts Receivable $100; เครดิต Sales $100", "Wrong 3": "เดบิต Cash $96 และ Sales Discounts $4; เครดิต Sales $100", "Explanation": "บริษัทได้รับเงินสดหลังหักค่าธรรมเนียม $96 และบันทึกค่าธรรมเนียมบัตรเครดิต $4 เป็นค่าใช้จ่าย โดยรับรู้ยอดขายเต็ม $100 (สไลด์ 6)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f029841258112be7df3ada847d774", "Question": "A company has ending merchandise inventory of $30,000 and annual cost of goods sold of $365,000. Using a 365-day year, what are its days' sales in inventory?", "Correct": "30 days", "Wrong 1": "25 days", "Wrong 2": "33 days", "Wrong 3": "36.5 days", "Explanation": "Days' sales in inventory = Ending inventory ÷ Cost of goods sold × 365 = $30,000 ÷ $365,000 × 365 = 30 days.", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f029841258148b278da08a6c05d41", "Question": "Inventory costs $50,000 but its net realizable value is $46,500. Under the lower-of-cost-and-NRV rule, which adjusting entry is correct?", "Correct": "Debit Cost of Goods Sold $3,500; credit Merchandise Inventory $3,500", "Wrong 1": "Debit Merchandise Inventory $3,500; credit Cost of Goods Sold $3,500", "Wrong 2": "Debit Cost of Goods Sold $46,500; credit Merchandise Inventory $46,500", "Wrong 3": "No entry is required because inventory is recorded at cost", "Explanation": "Inventory must be written down by $50,000 − $46,500 = $3,500. This decreases inventory and increases expense.", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "h a", "Question": "A company reports cost of goods sold of $240,000, beginning inventory of $40,000, and ending inventory of $56,000. What is its inventory turnover?", "Correct": "5.0 times", "Wrong 1": "4.3 times", "Wrong 2": "6.0 times", "Wrong 3": "5.5 times", "Explanation": "Average inventory is ($40,000 + $56,000) ÷ 2 = $48,000. Inventory turnover is $240,000 ÷ $48,000 = 5.0 times.", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f0298412581b593dec6050adca49e", "Question": "Ending inventory is overstated by $6,000 in Year 1. Assuming no other errors and the error reverses in Year 2, how are the two years' net incomes affected?", "Correct": "Year 1 overstated $6,000; Year 2 understated $6,000", "Wrong 1": "Year 1 understated $6,000; Year 2 overstated $6,000", "Wrong 2": "Both years overstated $6,000", "Wrong 3": "Year 1 overstated $6,000; Year 2 unaffected", "Explanation": "Overstated ending inventory understates Year 1 COGS and overstates income. It becomes overstated beginning inventory in Year 2, producing the opposite income effect.", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f0298412581c680d8c955d964bd21", "Question": "At year-end, goods purchased for $8,000 FOB shipping point and goods sold for $5,000 FOB destination are both in transit. How much should the company include in its ending inventory?", "Correct": "$13,000", "Wrong 1": "$8,000", "Wrong 2": "$5,000", "Wrong 3": "$0", "Explanation": "The buyer owns purchases shipped FOB shipping point, and the seller still owns goods sold FOB destination until delivery. Both shipments belong in the company's inventory.", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/410f0298412581d5af7ad4419abe38de", "Question": "Under periodic FIFO, beginning inventory is 50 units at $8, followed by purchases of 40 units at $10 and 30
