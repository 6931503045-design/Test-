<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Foundations of Accounting</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: tabbed study sheet (cards / summary / practice) in one centred column. */
:root{
  --paper:#f3f5f1; --surface:#ffffff; --ink:#1a2320; --muted:#5b6a64; --line:#d3dcd7;
  --accent:#2b6f58; --accent-soft:#dcebe4; --known:#e6f2d5; --ok:#1c7c4a; --ok-soft:#e2f3e9; --bad:#b3261e; --bad-soft:#fbe6e4;
  --ui:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12171a; --surface:#1b2226; --ink:#e7eeea; --muted:#9db0a8; --line:#2d3a40;
  --accent:#6fc59d; --accent-soft:#1f3a30; --known:#26331c; --ok:#62d394; --ok-soft:#15301f; --bad:#ff8a80; --bad-soft:#3b1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12171a; --surface:#1b2226; --ink:#e7eeea; --muted:#9db0a8; --line:#2d3a40;
  --accent:#6fc59d; --accent-soft:#1f3a30; --known:#26331c; --ok:#62d394; --ok-soft:#15301f; --bad:#ff8a80; --bad-soft:#3b1c1a; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16.5px;line-height:1.65}
.wrap{max-width:800px;margin:0 auto;padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:clamp(26px,6vw,36px);line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
header span{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:14.5px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{font-family:var(--mono);font-size:11.5px;opacity:.75;margin-left:5px}
.controls{justify-content:space-between;margin:12px 0 16px}
.count{color:var(--muted);font-size:14px;font-family:var(--mono)}
.stage{perspective:1400px}
.card{position:relative;width:100%;height:clamp(300px,64vw,380px);cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);border-radius:10px}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 22px 30px;text-align:center;overflow:auto}
.back{transform:rotateY(180deg)}
.card.is-known .face{background:var(--known)}
.cat-tag{position:absolute;top:10px;left:14px;font-size:12.5px;color:var(--muted)}
.hint{position:absolute;bottom:10px;left:0;right:0;font-size:12.5px;color:var(--muted)}
.front-t.big{font-size:clamp(40px,11vw,60px);line-height:1.2}
.front-t{font-size:clamp(21px,5vw,28px);font-weight:700;line-height:1.4;text-wrap:balance}
.back-t{font-size:clamp(17px,4vw,21px);line-height:1.7;max-width:34em}
.back-t b{color:var(--accent)}
.nav{justify-content:center;margin-top:16px;gap:10px}
.btn{font:inherit;font-weight:500;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 18px;cursor:pointer;min-width:46px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.know[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.ref{position:absolute;bottom:10px;left:0;right:0;font:500 12px var(--mono);color:var(--accent)}
.btn.no{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.btn.yes{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.sync{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:10px;background:var(--accent-soft);margin-top:16px}
.sync p{margin:0;font-size:15px}.sync .ok{color:var(--ok)}.sync .err{color:var(--bad)}
.srs{gap:14px;font:600 14px var(--mono);margin:4px 0 12px}
.srs .n{color:#2f6fd0}.srs .l{color:var(--bad)}.srs .d{color:var(--ok)}
.srs b{font-size:18px;margin-right:3px}
.rate4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rate4 .btn{display:flex;flex-direction:column;gap:2px;padding:9px 4px;min-width:0;font-size:15px}
.rate4 .btn small{font:500 12px var(--mono);opacity:.85}
.rate4 .r1{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.rate4 .r2{border-color:var(--line);color:var(--ink)}
.rate4 .r3{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.rate4 .r4{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.show{display:none!important;width:100%;margin-top:16px;padding:13px}
.typebox{margin-top:14px}.typebox input{flex:1;min-width:0;font:inherit;font-size:18px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.typebox input:focus{outline:3px solid var(--accent);outline-offset:1px}
.typebox p{margin:8px 0 0;font-size:16px;min-height:1.5em}.typebox .okk{color:var(--ok);font-weight:600}.typebox .nok{color:var(--bad);font-weight:600}
.rate4 .btn.sug{box-shadow:0 0 0 3px var(--accent)}
.keys{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
/* summary */
.sec{margin:0 0 26px}
.sec h2{font-size:20px;margin:0 0 8px;padding-left:12px;border-left:4px solid var(--accent);line-height:1.4}
.sec .chtag{font-family:var(--mono);font-size:12px;color:var(--accent);display:block}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;min-width:100%;background:var(--surface);font-size:15.5px}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top;line-height:1.6}
th{background:var(--accent-soft);font-weight:700;white-space:nowrap}
td:first-child{font-weight:500;min-width:7.5em}
.tip{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:15px}
/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.qbar{height:4px;background:var(--line);border-radius:2px;margin-bottom:14px}
.qbar i{display:block;height:100%;background:var(--accent);width:0;border-radius:2px;transition:width .25s}
.qmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:8px}
.qmeta b{font-family:var(--mono);color:var(--ink)}
.qtext{font-size:18px;font-weight:500;margin:0 0 14px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted);min-width:16px;padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.6}
.explain{margin-top:14px;border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15.5px}
.explain.good{border-left-color:var(--ok)} .explain.bad{border-left-color:var(--bad)}
.explain b.v{display:block;margin-bottom:2px}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.score .big{font-family:var(--mono);font-size:30px;font-weight:600}
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}
.cell{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:5px;font:500 11px var(--mono);color:var(--muted);cursor:pointer;padding:0}
.cell.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.cell.no{background:var(--bad);border-color:var(--bad);color:#fff}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.card,.qbar i{transition:none}}
</style>
<div class="wrap">
  <header><h1>Foundations of Accounting</h1><span>สรุป · แฟลชการ์ด · แบบฝึก Ch01–09</span></header>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="cards">แฟลชการ์ด</button>
    <button role="tab" aria-selected="false" data-tab="sum">สรุปบทเรียน</button>
    <button role="tab" aria-selected="false" data-tab="prac">แบบฝึก</button>
  </nav>
  <section id="tab-cards">
    <div class="row" id="cats"></div>
    <div class="row controls">
      <div class="row">
        <button class="chip" id="dirBtn" aria-pressed="false" type="button">ด้านหน้า: หัวข้อ</button>
        <button class="chip" id="typBtn" type="button" hidden>พิมพ์ตอบ: เปิด</button>
        <button class="chip" id="limBtn" type="button">การ์ดใหม่/วัน: 20</button>
        <button class="chip" id="resetSrs" type="button">ล้างความคืบหน้า</button>
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="row srs" id="srsCounts"></div>
    <div class="stage" id="stage"></div>
    <div id="typeBox" class="typebox" hidden>
      <div class="row"><input id="typeIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="พิมพ์คำตอบ แล้วกด Enter"><button class="btn primary" id="typeGo" type="button">ตรวจ</button></div>
      <p id="typeRes" role="status"></p>
    </div>
    <button class="btn primary show" id="showBtn" type="button" hidden>แสดงคำตอบ</button>
    <div class="rate4" id="rate4" hidden>
      <button class="btn r1" data-r="1" type="button">ลืม<small></small></button>
      <button class="btn r2" data-r="2" type="button">ยาก<small></small></button>
      <button class="btn r3" data-r="3" type="button">ปกติ<small></small></button>
      <button class="btn r4" data-r="4" type="button">ง่าย<small></small></button>
    </div>
    <p class="keys">แตะการ์ดหรือกด Space = พลิก · 1 ลืม · 2 ยาก · 3 ปกติ · 4 ง่าย</p>
    <div class="sync" id="sync" hidden><p id="syncText"></p><button class="btn yes" id="syncBtn" type="button">บันทึกผลลง Notion</button><p id="syncMsg" role="status"></p></div>
  </section>
  <section id="tab-sum" hidden>
    <div class="row" id="sumCats" style="margin-bottom:18px"></div>
    <div id="sumBody"></div>
  </section>
  <section id="tab-prac" hidden>
    <div class="row" id="qCats" style="margin-bottom:14px"></div>
    <div id="qBody"></div>
  </section>
</div>
<script>
const D = {"key": "acc", "title": "Foundations of Accounting", "sub": "สรุป · แฟลชการ์ด · แบบฝึก Ch01–09", "theme": {"paper": "#f3f5f1", "accent": "#2b6f58", "soft": "#dcebe4", "accentd": "#6fc59d", "softd": "#1f3a30"}, "cats": [["c1", "01 Business"], ["c2", "02 Recording"], ["c3", "03 Adjusting"], ["c4", "04 Cycle"], ["c5", "05 Merchandising"], ["c6", "06 Inventory"], ["c7", "07 AIS"], ["c8", "08 Cash"], ["c9", "09 Receivables"]], "cards": [["c1", "Accounting ต่างจาก Bookkeeping อย่างไร?", "Accounting = ระบบ ระบุ → บันทึก → สื่อสาร ข้อมูลที่เกี่ยวข้อง เชื่อถือได้ และเปรียบเทียบได้ เพื่อการตัดสินใจ\nBookkeeping = แค่ส่วน “บันทึก” รายการค้า เป็นส่วนหนึ่งของ Accounting", "Slides 01–02", "01-1"], ["c1", "Accounting Process มี 3 ขั้นตอนอะไร?", "1) Identifying — คัดเลือกรายการ/เหตุการณ์\n2) Recording — วัด บันทึก จัดหมวด\n3) Communicating — จัดทำ วิเคราะห์ ตีความรายงาน", "Slide 02", "01-2"], ["c1", "ผู้ใช้ข้อมูลบัญชีภายนอก (External users) มีใครบ้าง ใช้ทำอะไร?", "เจ้าหนี้ (Lenders), ผู้ถือหุ้น, รัฐ, ลูกค้า, กลุ่มผู้บริโภค, ผู้สอบบัญชีภายนอก\nใช้ประเมินฐานะและผลการดำเนินงานของกิจการ", "Slide 03", "01-3"], ["c1", "Financial Accounting กับ Managerial Accounting ต่างกันอย่างไร?", "Financial = สื่อสารข้อมูลการเงินให้ “บุคคลภายนอก”\nManagerial = ช่วยผู้บริหาร “ภายใน” วางแผนและตัดสินใจ", "Slides 03–04", "01-4"], ["c1", "ทำไมจริยธรรม (Ethics) สำคัญต่อการทำบัญชี?", "ทำให้ผู้จัดทำเลือกสิ่งที่ถูกต้อง ไม่บิดเบือนตัวเลข และผู้ใช้เชื่อถือรายงานได้\n“Good ethics are good business”", "Slides 06–07", "01-5"], ["c1", "เจอปัญหาจริยธรรม ตัดสินใจด้วย 3 ขั้นตอนอะไร?", "1) Identify ethical concern\n2) Analyze options — พิจารณาผลทุกทาง\n3) Make ethical decision — เลือกทางที่ดีที่สุด", "Slide 07", "01-6"], ["c1", "GAAP กับ IFRS คืออะไร?", "GAAP = หลักการบัญชีที่รับรองทั่วไป\nIFRS = มาตรฐานรายงานการเงินระหว่างประเทศ ออกโดย IASB", "Slides 08–09", "01-7"], ["c1", "หลักการบัญชี (Principles) 4 ข้อ?", "1) Cost Principle — บันทึกตามราคาทุนจริง\n2) Revenue Recognition — รับรู้รายได้เมื่อเกิดขึ้น (earned)\n3) Expense Recognition / Matching — จับคู่ค่าใช้จ่ายกับรายได้\n4) Full Disclosure — เปิดเผยข้อมูลที่มีผลต่อการตัดสินใจ", "Slide 11", "01-8"], ["c1", "Revenue Recognition ต่างจาก Expense Recognition อย่างไร?", "Revenue Recognition: รับรู้รายได้เมื่อ “ได้รับสิทธิ์” แล้ว ไม่จำเป็นต้องได้เงินสด\nExpense Recognition (Matching): บันทึกค่าใช้จ่ายในงวดเดียวกับรายได้ที่มันช่วยสร้าง", "Slide 11", "01-9"], ["c1", "ข้อสมมติทางบัญชี (Assumptions) 4 ข้อ?", "Going-concern · Monetary unit · Business entity · Time period", "Slide 12", "01-10"], ["c1", "Business Entity Assumption หมายความว่าอะไร?", "บัญชีของกิจการต้องแยกจากเจ้าของและหน่วยงานอื่น\nเช่น ของใช้ส่วนตัวเจ้าของไม่ใช่ค่าใช้จ่ายกิจการ", "Slide 12", "01-11"], ["c1", "Sole Proprietorship, Partnership, Corporation ต่างกันอย่างไร?", "Sole Proprietorship = เจ้าของคนเดียว\nPartnership = หุ้นส่วน 2 คนขึ้นไป\nCorporation = นิติบุคคลแยก เจ้าของคือ Shareholders ความรับผิดจำกัด (หุ้นประเภทเดียว = Ordinary shares)", "Slides 13–14", "01-12"], ["c1", "Fundamental Qualitative Characteristics มี 2 อะไร?", "Relevance — มีผลต่อการตัดสินใจ\nFaithful Representation — นำเสนอตรงความจริง", "Slides 15–18", "01-13"], ["c1", "Relevance ประกอบด้วยอะไรบ้าง?", "Predictive value · Confirmatory value · Materiality\n(Materiality = ถ้าละเว้นหรือแสดงผิดแล้วกระทบการตัดสินใจ)", "Slide 17", "01-14"], ["c1", "Faithful Representation ต้องมีคุณสมบัติ 3 ข้อ?", "Complete (ครบถ้วน) · Neutral (เป็นกลาง) · Free from error (ไม่มีข้อผิดพลาด)", "Slide 18", "01-15"], ["c1", "Enhancing Qualitative Characteristics 4 ข้อ?", "Comparability · Verifiability · Timeliness · Understandability", "Slides 16, 19", "01-16"], ["c1", "Verifiability คืออะไร?", "ผู้สังเกตที่มีความรู้และเป็นอิสระหลายคน “เห็นพ้องตรงกัน” (reach consensus) ในข้อมูลได้", "Slide 19", "01-17"], ["c1", "Cost-benefit Constraint คืออะไร?", "ต้นทุนการจัดทำข้อมูลต้องคุ้มกับประโยชน์ที่ผู้ใช้ได้รับ", "Slides 15–16", "01-18"], ["c1", "สมการบัญชีคืออะไร ทำไมต้องสมดุล?", "Assets = Liabilities + Equity\nสินทรัพย์ทุกบาทได้มาจากเจ้าหนี้หรือเจ้าของ จึงต้องเท่ากันเสมอ", "Slide 20", "01-19"], ["c1", "Assets, Liabilities, Equity หมายถึงอะไร?", "Assets = ทรัพยากรที่กิจการควบคุม\nLiabilities = ภาระผูกพันต่อบุคคลภายนอก\nEquity = ส่วนที่เหลือของเจ้าของหลังหักหนี้สิน", "Slides 21–23", "01-20"], ["c1", "เจ้าของนำเงินสดมาลงทุน กระทบสมการอย่างไร?", "Cash (Asset) ↑ และ Equity ↑ เท่ากัน", "Slide 26", "01-21"], ["c1", "ซื้อวัสดุเป็นเงินสด vs เงินเชื่อ ต่างกันอย่างไร?", "เงินสด: Supplies ↑ Cash ↓ (สินทรัพย์รวมเท่าเดิม)\nเงินเชื่อ: Supplies ↑ Accounts Payable ↑", "Slides 27, 29", "01-22"], ["c1", "ทำไมให้บริการเป็นเงินเชื่อต้องเพิ่ม Accounts Receivable?", "รับรู้รายได้แล้ว (ทำงานเสร็จ) แต่ยังไม่ได้เงินสด จึงมีสิทธิเรียกร้องจากลูกค้า", "Slide 32", "01-23"], ["c1", "เก็บเงินจากลูกหนี้ เป็นรายได้ใหม่ไหม?", "ไม่ใช่ รายได้รับรู้ไปแล้วตอนให้บริการ\nแค่ Cash ↑ Accounts Receivable ↓", "Slide 33", "01-24"], ["c1", "จ่ายเจ้าหนี้ / เจ้าของถอนเงิน กระทบอะไร? Withdrawal เป็น Expense ไหม?", "จ่ายเจ้าหนี้: Cash ↓ Accounts Payable ↓\nถอนเงิน: Cash ↓ Equity ↓ — ไม่ใช่ Expense (เป็นการคืนทรัพยากรให้เจ้าของ)", "Slides 34–35", "01-25"], ["c1", "งบการเงินหลัก 4 งบ?", "Income Statement — กำไรขาดทุนตลอดงวด\nStatement of Changes in Equity — ทุนต้นงวด → ปลายงวด\nStatement of Financial Position — ฐานะ ณ วันหนึ่ง\nStatement of Cash Flows — เงินสดเข้าออก", "Slides 37–41", "01-26"], ["c1", "Income Statement กับ Balance Sheet ต่างกันเรื่องเวลาอย่างไร?", "Income Statement = ตลอด “ช่วงเวลา”\nBalance Sheet = ณ “วันใดวันหนึ่ง”", "ตำรา p.15–18", "01-27"], ["c1", "Statement of Owner’s Equity ส่งตัวเลขอะไรต่อไป Balance Sheet?", "Capital ปลายงวด = ต้นงวด + ลงทุนเพิ่ม + กำไรสุทธิ − ถอนใช้", "ตำรา p.15–18", "01-28"], ["c1", "กำไรสุทธิ ต่างจาก เงินสดสุทธิ อย่างไร?", "กำไรสุทธิ = Revenue − Expenses (งบกำไรขาดทุน)\nเงินสดสุทธิ = Cash inflows − outflows (งบกระแสเงินสด)", "Slides 38, 41", "01-29"], ["c1", "ROA คำนวณอย่างไร?", "ROA = Net Income ÷ Average Total Assets\nวัดว่าใช้สินทรัพย์สร้างกำไรได้ดีแค่ไหน", "Slide 42", "01-30"], ["c1", "กิจกรรม Financing, Investing, Operating คืออะไร?", "Financing = หาเงินทุน (เจ้าของ/เจ้าหนี้)\nInvesting = ซื้อขายสินทรัพย์ระยะยาว\nOperating = ดำเนินงานหลัก ผลิต ขาย บริการ", "Slide 44", "01-31"], ["c2", "ขั้นตอน Analyzing & Recording Process มีอะไรบ้าง?", "1) Analyze รายการจาก Source documents\n2) Record ลง Journal\n3) Post ไป Ledger\n4) จัดทำและวิเคราะห์ Trial balance", "Slide 2-2", "02-1"], ["c2", "Source documents ตามสไลด์มีอะไรบ้าง?", "Checks · Bills from suppliers · Employee earnings records · Purchase orders · Bank statements · Sales tickets", "Slide 2-3", "02-2"], ["c2", "Account คืออะไร?", "บันทึกการเพิ่ม/ลดของรายการเฉพาะ (สินทรัพย์ หนี้สิน ทุน รายได้ หรือค่าใช้จ่าย)\nGeneral ledger = บันทึกที่รวมทุกบัญชีของกิจการ", "Slide 2-4", "02-3"], ["c2", "Asset accounts ในบทมีอะไรบ้าง?", "Cash · Accounts Receivable · Notes Receivable · Prepaid Accounts · Supplies · Equipment · Buildings · Land", "Slide 2-6", "02-4"], ["c2", "Liability accounts มีอะไรบ้าง?", "Accounts Payable · Notes Payable · Unearned Revenue · Accrued Liabilities", "Slide 2-7", "02-5"], ["c2", "Equity accounts มีอะไรบ้าง และอันไหนเพิ่ม/ลดทุน?", "Owner’s Capital (+) · Revenues (+)\nOwner’s Withdrawals (−) · Expenses (−)", "Slides 2-8, 2-9", "02-6"], ["c2", "Ledger กับ Chart of Accounts ต่างกันอย่างไร?", "Ledger = ชุดบัญชีทั้งหมดของระบบ\nChart of Accounts = รายชื่อบัญชีทั้งหมดพร้อมเลขรหัส (เช่น 101 Cash, 201 Accounts Payable, 301 Capital)", "Slide 2-10", "02-7"], ["c2", "T-account คืออะไร ซ้าย/ขวาเรียกว่าอะไร?", "เครื่องมือแสดงผลรายการต่อบัญชีหนึ่ง\nซ้าย = Debit (Dr.) · ขวา = Credit (Cr.)", "Slide 2-11", "02-8"], ["c2", "Assets, Liabilities, Equity เพิ่มฝั่งไหน?", "Assets: เพิ่ม Debit (ยอดปกติ Debit)\nLiabilities, Equity: เพิ่ม Credit (ยอดปกติ Credit)", "Slide 2-12", "02-9"], ["c2", "Revenue, Expenses, Withdrawals มียอดปกติฝั่งไหน?", "Revenue → Credit\nExpenses, Owner’s Withdrawals → Debit", "Slide 2-13", "02-10"], ["c2", "ทำไม Debit รวมต้องเท่ากับ Credit รวม?", "Double-entry: ทุกรายการกระทบอย่างน้อย 2 บัญชี เพื่อให้ Assets = Liabilities + Equity สมดุลเสมอ", "Slides 2-12–2-14", "02-11"], ["c2", "Debit แปลว่าเงินสดเพิ่มทุกครั้งไหม?", "ไม่ Debit คือ “ฝั่งซ้าย”\nCash (Asset) → Debit = เพิ่ม\nAccounts Payable (Liability) → Debit = ลด", "ตำรา p.49–51", "02-12"], ["c2", "Journalizing กับ Posting ต่างกันอย่างไร?", "Journalizing = บันทึกรายการตามลำดับวันที่ลง Journal\nPosting = ย้ายจาก Journal ไปแต่ละบัญชีใน Ledger", "Slide 2-15", "02-13"], ["c2", "Journal entry หนึ่งรายการมีข้อมูล 4 อะไร?", "1) วันที่ 2) ชื่อบัญชีที่ Dr./Cr. 3) จำนวนเงิน Dr./Cr. 4) คำอธิบายรายการ", "Slide 2-16", "02-14"], ["c2", "ขั้นตอน Posting journal entries 6 ขั้น?", "1) หาบัญชีใน Ledger 2) ใส่วันที่ 3) ใส่จำนวนเงินและคำอธิบาย 4) ใส่เลขอ้างอิง Journal 5) คำนวณยอดคงเหลือ 6) ใส่เลขบัญชี Ledger กลับใน Journal", "Slides 2-18–2-23", "02-15"], ["c2", "เจ้าของลงทุนเงินสด บันทึกอย่างไร?", "Dr. Cash (101)\n    Cr. Owner’s Capital (301)", "Slide 2-24", "02-16"], ["c2", "ซื้อ Supplies ด้วยเงินสด / เงินเชื่อ บันทึกอย่างไร?", "เงินสด: Dr. Supplies (126) Cr. Cash (101)\nเงินเชื่อ: Dr. Supplies (126) Cr. Accounts Payable (201)", "Slides 2-25, 2-27", "02-17"], ["c2", "Trial balance คืออะไร จัดทำ 3 ขั้นอย่างไร?", "รายการยอดคงเหลือทุกบัญชีจาก Ledger\n1) ใส่ชื่อบัญชีและยอด 2) รวมยอด Debit และ Credit 3) ตรวจว่าเท่ากัน", "Slides 2-29, 2-30", "02-18"], ["c2", "Trial balance ไม่เท่ากัน ตรวจ 6 ขั้นอะไร?", "1) บวกคอลัมน์ใหม่ 2) ตรวจยอดที่คัดจาก Ledger 3) ดูว่าวางผิดฝั่งไหม 4) คำนวณยอด Ledger ใหม่ 5) ตรวจการ Post 6) ตรวจว่าทุก entry Dr. = Cr.", "Slide 2-31", "02-19"], ["c2", "Trial balance สมดุล แต่รายงานยังผิดได้เพราะอะไร?", "ลงผิดบัญชี, ผิดจำนวนแต่ Dr./Cr. เท่ากัน, หรือลืมบันทึกรายการทั้งรายการ", "ตำรา p.51–60", "02-20"], ["c2", "Trial balance ใช้ทำงบการเงินอย่างไร?", "Revenue/Expense → Income Statement\nNet profit + ลงทุน − ถอน → Statement of Changes in Equity\nAssets/Liabilities/Capital ปลายงวด → Statement of Financial Position", "Slides 2-32–2-35", "02-21"], ["c2", "ตัวอย่าง FastForward: ทุนต้นงวด 0, ลงทุน 30,000, กำไร 3,470, ถอน 200 → Capital ปลายงวด?", "0 + 30,000 + 3,470 − 200 = 33,270", "Slide 2-34", "02-22"], ["c2", "Presentation issues: ใส่ $ และจุลภาคอย่างไร?", "Journal/Ledger ไม่ใส่ $\nงบการเงิน/Trial balance ใส่ $ เฉพาะตัวแรกและตัวสุดท้ายของคอลัมน์\nงบการเงินใส่จุลภาคเสมอ", "Slide 2-36", "02-23"], ["c2", "Debt ratio คำนวณอย่างไร ค่าสูงหมายถึงอะไร?", "Debt ratio = Total Liabilities ÷ Total Assets\nสูง = มีโอกาสชำระหนี้ไม่ได้ในอนาคตมากขึ้น (ความเสี่ยงหนี้สูง)", "Slide 2-37", "02-24"], ["c2", "Debt ratio = 0.65 ตีความอย่างไร?", "ประมาณ 65% ของสินทรัพย์ได้มาจากหนี้สิน ต้องเทียบกับธุรกิจประเภทเดียวกัน", "ตำรา p.62", "02-25"], ["c3", "Accounting period คืออะไร?", "การแบ่งอายุกิจการเป็นช่วงเวลาเพื่อทำรายงาน เช่น เดือน ไตรมาส ปี", "Slide 3-2", "03-1"], ["c3", "Accrual basis กับ Cash basis ต่างกันอย่างไร?", "Accrual: รับรู้รายได้เมื่อหาได้ ค่าใช้จ่ายเมื่อเกิดขึ้น\nCash: รับรู้เมื่อรับ/จ่ายเงินสด (ไม่ใช่ GAAP)", "Slides 3-3, 3-4", "03-2"], ["c3", "จ่ายค่าประกัน 2,400 คุ้มครอง 24 เดือน (ธ.ค. 2015 – พ.ย. 2017) แต่ละปีรับรู้ค่าใช้จ่ายเท่าไรตาม Accrual?", "2015 = 100 · 2016 = 1,200 · 2017 = 1,100\n(Cash basis จะลง 2,400 ทั้งหมดใน 2015)", "Slides 3-5, 3-6", "03-3"], ["c3", "Revenue recognition กับ Matching principle คืออะไร?", "Revenue recognition = รับรู้รายได้เมื่อส่งมอบสินค้า/บริการแล้ว\nMatching = จับคู่ค่าใช้จ่ายที่ใช้สร้างรายได้นั้นในงวดเดียวกัน", "Slides 3-7, 3-8", "03-4"], ["c3", "Adjusting entries มี 4 แบบอะไร?", "จ่าย/รับเงินก่อนรับรู้: Prepaid expenses (รวมค่าเสื่อม) · Unearned revenues\nจ่าย/รับเงินหลังรับรู้: Accrued expenses · Accrued revenues", "Slide 3-9", "03-5"], ["c3", "Prepaid expenses คืออะไร?", "ทรัพยากรที่จ่ายเงินไปก่อนได้รับประโยชน์จริง → เริ่มเป็นสินทรัพย์ แล้วทยอยเป็นค่าใช้จ่าย", "Slide 3-10", "03-6"], ["c3", "ปรับ Prepaid insurance เดือน ธ.ค. (2,400 / 24 เดือน)?", "Dr. Insurance expense 100 / Cr. Prepaid insurance 100", "Slide 3-11", "03-7"], ["c3", "ซื้อ Supplies 9,720 นับคงเหลือได้ 8,670 ปรับอย่างไร?", "ใช้ไป 1,050 → Dr. Supplies expense 1,050 / Cr. Supplies 1,050", "Slide 3-12", "03-8"], ["c3", "Prepaid ที่จ่ายและใช้หมดในงวดเดียว (เช่น ค่าเช่ารายเดือน) บันทึกอย่างไร?", "บันทึก Dr. ค่าใช้จ่ายได้เลย แทนการบันทึกเป็นสินทรัพย์", "Slide 3-13", "03-9"], ["c3", "Straight-line depreciation คำนวณอย่างไร?", "(Asset cost − Residual value) ÷ Useful life", "Slide 3-14", "03-10"], ["c3", "อุปกรณ์ 26,000 มูลค่าซาก 8,000 อายุ 48 เดือน ค่าเสื่อมต่อเดือน?", "(26,000 − 8,000) ÷ 48 = 375\nDr. Depreciation expense 375 / Cr. Accumulated depreciation 375", "Slide 3-15", "03-11"], ["c3", "Accumulated depreciation คือบัญชีประเภทไหน?", "Contra asset — แสดงหักจากอุปกรณ์ในงบฐานะการเงิน (แสดงยอดสุทธิ)", "Slides 3-16, 3-17", "03-12"], ["c3", "Unearned revenue คืออะไร?", "เงินที่รับมาก่อนส่งมอบสินค้า/บริการ → เป็นหนี้สิน", "Slide 3-18", "03-13"], ["c3", "รับค่าที่ปรึกษาล่วงหน้า 3,000 สำหรับ 60 วัน ทำงานแล้ว 5 วัน ปรับอย่างไร?", "3,000 ÷ 60 = 50/วัน × 5 = 250\nDr. Unearned consulting revenue 250 / Cr. Consulting revenue 250", "Slides 3-19, 3-20", "03-14"], ["c3", "Accrued expenses คืออะไร?", "ต้นทุนที่เกิดขึ้นในงวดแล้ว แต่ยังไม่ได้จ่ายและยังไม่ได้บันทึก", "Slide 3-21", "03-15"], ["c3", "ลูกจ้างได้ 70/วัน ทำงานหลังวันจ่ายเงินเดือน 3 วันก่อนสิ้นปี ปรับอย่างไร?", "3 × 70 = 210\nDr. Salaries expense 210 / Cr. Salaries payable 210", "Slides 3-22, 3-23", "03-16"], ["c3", "กู้ 6,000 ดอกเบี้ย 6%/ปี ดอกเบี้ยค้างจ่าย 1 เดือนเท่าไร?", "6,000 × 6% × 1/12 = 30\nDr. Interest expense 30 / Cr. Interest payable 30", "Slide 3-25", "03-17"], ["c3", "Accrued revenues คืออะไร?", "รายได้ที่หาได้ในงวดแล้ว แต่ยังไม่บันทึกและยังไม่ได้รับเงิน", "Slide 3-26", "03-18"], ["c3", "สัญญา 30 วัน 2,700 (90/วัน) เริ่ม 12 ธ.ค. ณ 31 ธ.ค. ปรับอย่างไร?", "20 วัน × 90 = 1,800\nDr. Accounts receivable 1,800 / Cr. Consulting revenue 1,800\n(อีก 900 เป็นรายได้เดือน ม.ค.)", "Slides 3-27, 3-28", "03-19"], ["c3", "ลำดับการทำงบการเงินจาก Adjusted trial balance?", "1) Income statement 2) Statement of changes in equity (รับ Net profit) 3) Statement of financial position", "Slides 3-33 – 3-36", "03-20"], ["c3", "Profit margin คำนวณอย่างไร?", "Net profit ÷ Net sales", "Slide 3-37", "03-21"], ["c3", "Appendix 3A: ถ้าบันทึก Prepaid เป็นค่าใช้จ่ายตั้งแต่ต้น สิ้นงวดต้องทำอะไร?", "ปรับส่วนที่ยังไม่ใช้กลับเป็นสินทรัพย์ (Dr. Prepaid / Cr. Expense)\nรายการปรับขึ้นกับว่าตอนจ่ายบันทึกไว้อย่างไร", "Slide 3-38", "03-22"], ["c4", "Work sheet มีประโยชน์อะไร และบังคับไหม?", "ช่วยทำงบ · เชื่อมบัญชีกับรายการปรับปรุง · ลดข้อผิดพลาด · ช่วยทำงบระหว่างกาล · ช่วยวางแผน audit · ดูผลของรายการที่เสนอ\nไม่ใช่รายงานบังคับ", "Slide 4-2", "04-1"], ["c4", "คอลัมน์ของ Work sheet มีอะไรบ้าง?", "Unadjusted trial balance → Adjustments → Adjusted trial balance → Income statement → Statement of financial position & changes in equity", "Slides 4-3 – 4-7", "04-2"], ["c4", "Closing entries มีจุดประสงค์ 2 ข้อ?", "1) ทำให้ Revenue, Expense, Withdrawals เป็นศูนย์เมื่อสิ้นงวด\n2) สรุปรายได้และค่าใช้จ่ายของงวดไว้ใน Income summary", "Slide 4-9", "04-3"], ["c4", "ขั้นตอนการปิดบัญชี 3 ขั้น?", "ระบุบัญชีที่ต้องปิด → บันทึกและผ่านรายการปิดบัญชี → ทำ Post-closing trial balance", "Slide 4-9", "04-4"], ["c4", "Temporary กับ Permanent accounts ต่างกันอย่างไร?", "Temporary (Revenues, Expenses, Withdrawals, Income summary) → ปิดทุกงวด\nPermanent (Assets, Liabilities, Equity) → ยกยอดไปงวดหน้า", "Slide 4-10", "04-5"], ["c4", "รายการปิดบัญชี 4 ขั้นตามลำดับ?", "1) ปิด Revenue → Income summary\n2) ปิด Expense → Income summary\n3) ปิด Income summary → Owner’s capital\n4) ปิด Withdrawals → Owner’s capital", "Slides 4-11, 4-25", "04-6"], ["c4", "ปิดรายได้ Consulting 7,850 และ Rental 300 บันทึกอย่างไร?", "Dr. Consulting revenue 7,850\nDr. Rental revenue 300\n   Cr. Income summary 8,150", "Slide 4-14", "04-7"], ["c4", "ปิดค่าใช้จ่ายเข้า Income summary บันทึกอย่างไร?", "Dr. Income summary (รวม) / Cr. Expense แต่ละบัญชี", "Slides 4-17, 4-18", "04-8"], ["c4", "ขั้นที่ 3 กรณีมีกำไรสุทธิ บันทึกอย่างไร?", "Dr. Income summary / Cr. Owner’s capital (เท่ากับกำไรสุทธิ)\nขาดทุน → กลับทิศ", "Slides 4-20, 4-21", "04-9"], ["c4", "ปิด Withdrawals บันทึกอย่างไร?", "Dr. Owner’s capital / Cr. Owner’s withdrawals", "Slides 4-23, 4-24", "04-10"], ["c4", "Post-closing trial balance คืออะไร?", "รายการบัญชีถาวรและยอดคงเหลือหลังผ่านรายการปิดบัญชี — Dr. รวมต้องเท่ากับ Cr. รวม", "Slides 4-26, 4-27", "04-11"], ["c4", "Post-closing trial balance มีบัญชี Salaries expense ไหม?", "ไม่มี เพราะค่าใช้จ่ายเป็นบัญชีชั่วคราวที่ถูกปิดแล้ว", "ตำรา ch.4", "04-12"], ["c4", "ลำดับ Accounting cycle?", "Analyze → Journalize → Post → Unadjusted TB → Adjust → Adjusted TB → Prepare statements → Close → Post-closing TB (→ Reverse เป็นทางเลือก)", "Slide 4-28", "04-13"], ["c4", "เกณฑ์ “Current” ในงบจัดประเภทคืออะไร?", "คาดว่าจะเก็บได้หรือถึงกำหนดชำระภายใน 1 ปี หรือรอบการดำเนินงานปกติ แล้วแต่อย่างไหนนานกว่า", "Slide 4-29", "04-14"], ["c4", "Current assets คืออะไร?", "สินทรัพย์ที่คาดว่าจะขาย เก็บเงิน หรือใช้หมดภายใน 1 ปี/รอบการดำเนินงาน", "Slide 4-30", "04-15"], ["c4", "Long-term investments คืออะไร?", "สินทรัพย์ทางการเงิน/เงินลงทุนที่ตั้งใจถือนานกว่า 1 ปีหรือรอบการดำเนินงาน", "Slide 4-31", "04-16"], ["c4", "PP&E กับ Intangible assets ต่างกันอย่างไร?", "ทั้งคู่ใช้ระยะยาวเพื่อผลิต/ขาย\nPP&E มีตัวตน · Intangible ไม่มีรูปร่าง", "Slides 4-32, 4-33", "04-17"], ["c4", "Current กับ Noncurrent liabilities ต่างกันอย่างไร?", "Current = ถึงกำหนดภายใน 1 ปีหรือรอบการดำเนินงาน (ที่นานกว่า)\nNoncurrent = ไม่ถึงกำหนดภายในช่วงนั้น", "Slides 4-34, 4-35", "04-18"], ["c4", "Equity คืออะไร?", "สิทธิของเจ้าของในสินทรัพย์ของกิจการ", "Slide 4-36", "04-19"], ["c4", "Current ratio คำนวณอย่างไร บอกอะไร?", "Current assets ÷ Current liabilities\nใช้ดูความสามารถชำระหนี้ระยะสั้น", "Slide 4-37", "04-20"], ["c4", "Reversing entries คืออะไร ต้องทำไหม?", "ทางเลือก (ไม่บังคับ) ทำต้นงวดใหม่เพื่อกลับรายการ Accrued assets/liabilities ที่ปรับไว้ ทำให้บันทึกบัญชีง่ายขึ้น", "Slides 4-38 – 4-40", "04-21"], ["c5", "Service company กับ Merchandising company ต่างกันอย่างไร?", "Service = ขาย “เวลา/บริการ” (สำนักงานบัญชี กฎหมาย ช่างประปา)\nMerchandising = ซื้อสินค้ามาขาย มี Merchandise Inventory (ร้านกีฬา เสื้อผ้า อะไหล่รถ)", "Slides 5-2, 5-4", "05-1"], ["c5", "ลำดับช่องทางสินค้า Manufacturer → ? → ? → Consumers", "Manufacturer → Wholesaler → Retailer → Consumers\nWholesaler ขายให้ Retailer · Retailer ขายให้ผู้บริโภค", "Slide 5-3", "05-2"], ["c5", "Operating cycle ของ Merchandiser เริ่มและจบที่ไหน?", "เริ่มที่ “ซื้อสินค้า” → เก็บเป็น Inventory → ขาย → จบที่ “เก็บเงินสด” จากลูกค้า", "Slide 5-5", "05-3"], ["c5", "Perpetual vs Periodic inventory system?", "Perpetual = อัปเดต Inventory และ COGS ทุกครั้งที่ซื้อ/ขาย\nPeriodic = อัปเดตเฉพาะ “สิ้นงวด”", "Slides 5-7, 5-39", "05-4"], ["c5", "ซื้อสินค้าเงินสด $1,200 (Perpetual) บันทึกอย่างไร?", "Dr. Merchandise Inventory 1,200\n    Cr. Cash 1,200", "Slide 5-8", "05-5"], ["c5", "Trade discount คืออะไร? ราคาป้าย $5.25 ลด 30% ราคาจริงเท่าไร?", "ส่วนลดจากราคาป้ายเมื่อซื้อปริมาณมาก บันทึกตามราคาสุทธิ\n5.25 × 70% = $3.675 ต่อหน่วย", "Slide 5-9", "05-6"], ["c5", "Purchase discount คืออะไร?", "ส่วนลดจากราคาในใบแจ้งหนี้ เพื่อจูงใจให้ “จ่ายเร็ว”", "Slide 5-11", "05-7"], ["c5", "2/10, n/30 แปลว่าอะไร?", "ลด 2% ถ้าจ่ายภายใน 10 วัน\nไม่งั้นจ่ายเต็มจำนวนภายใน 30 วัน (Credit period)", "Slide 5-12", "05-8"], ["c5", "ซื้อเชื่อ $1,200 เงื่อนไข 2/10, n/30 แล้วจ่ายวันที่ 10 บันทึกอย่างไร?", "ซื้อ: Dr. Inventory 1,200 / Cr. A/P 1,200\nจ่าย: Dr. A/P 1,200 / Cr. Cash 1,176 / Cr. Inventory 24", "Slides 5-13–5-15", "05-9"], ["c5", "Purchase return กับ Purchase allowance ต่างกันอย่างไร?", "Return = ส่งสินค้าคืนผู้ขาย\nAllowance = เก็บสินค้าที่บกพร่องไว้ แต่ได้ลดราคา", "Slide 5-16", "05-10"], ["c5", "ผู้ซื้อออก Debit memorandum $300 ขอลดราคาสินค้าบกพร่อง บันทึกอย่างไร?", "Dr. Accounts Payable 300\n    Cr. Merchandise Inventory 300", "Slide 5-17", "05-11"], ["c5", "ซื้อ $1,000 (2/10, n/60) คืน $100 แล้วจ่ายในช่วงส่วนลด จ่ายเท่าไร?", "ส่วนลดคิดจากยอดคงเหลือ $900 → 2% = $18\nจ่ายเงินสด $882", "Slide 5-18", "05-12"], ["c5", "FOB shipping point vs FOB destination?", "Shipping point: กรรมสิทธิ์โอนตอนส่งของ ผู้ซื้อจ่ายค่าขนส่ง (Freight-in รวมในต้นทุน Inventory)\nDestination: โอนเมื่อถึงปลายทาง ผู้ขายจ่ายค่าขนส่ง", "Slides 5-19, 5-20", "05-13"], ["c5", "ซื้อ FOB shipping point ค่าขนส่ง $75 บันทึกอย่างไร?", "Dr. Merchandise Inventory 75\n    Cr. Cash 75 (Freight-in เป็นต้นทุนสินค้า)", "Slide 5-20", "05-14"], ["c5", "รายการขายใน Perpetual มี 2 ส่วนอะไร?", "1) รับรู้รายได้: Dr. Cash/AR · Cr. Sales\n2) รับรู้ต้นทุน: Dr. COGS · Cr. Merchandise Inventory", "Slide 5-23", "05-15"], ["c5", "ขายเชื่อ $2,400 ต้นทุน $1,600 บันทึกอย่างไร? กำไรขั้นต้นเท่าไร?", "Dr. AR 2,400 / Cr. Sales 2,400\nDr. COGS 1,600 / Cr. Inventory 1,600\nGross profit = $800", "Slide 5-24", "05-16"], ["c5", "Sales discount ช่วยผู้ขายอย่างไร? ขาย $1,000 (2/10) ลูกค้าจ่ายใน 10 วัน รับเงินเท่าไร?", "ได้เงินเร็วขึ้น ลดงานติดตามหนี้\nรับ $980 · Sales discount $20 (หักจาก Sales)", "Slides 5-25, 5-26", "05-17"], ["c5", "Sales return กับ Sales allowance ต่างกันอย่างไร?", "Return = ลูกค้าคืนสินค้า\nAllowance = ลดราคาให้ ลูกค้าเก็บสินค้าไว้", "Slide 5-27", "05-18"], ["c5", "ลูกค้าคืนสินค้าราคาขาย $800 ต้นทุน $600 ผู้ขายบันทึกอะไร?", "Dr. Sales Returns & Allowances 800 / Cr. AR 800\nDr. Merchandise Inventory 600 / Cr. COGS 600", "Slide 5-28", "05-19"], ["c5", "สูตร COGS?", "Beginning inventory + Net purchases = Merchandise available for sale\nCOGS = Available for sale − Ending inventory", "Slide 5-30", "05-20"], ["c5", "บัญชี Inventory $21,250 นับจริงได้ $21,000 ปรับอย่างไร?", "สินค้าขาดหาย (Shrinkage) $250\nDr. COGS 250 / Cr. Merchandise Inventory 250", "Slide 5-31", "05-21"], ["c5", "Gross profit ต่างจาก Net income อย่างไร?", "Gross profit = Net sales − COGS\nNet income = Gross profit − Operating expenses ± รายการอื่น", "Slide 5-33", "05-22"], ["c5", "Acid-test ratio คำนวณอย่างไร เกณฑ์เท่าไร?", "(Cash + S-T Investments + Current Receivables) ÷ Current Liabilities\nควร ≥ 1.0 (ไม่รวม Inventory)", "Slide 5-35", "05-23"], ["c5", "Gross margin ratio คำนวณอย่างไร?", "(Net sales − COGS) ÷ Net sales\n= สัดส่วนยอดขายที่เหลือไว้จ่ายค่าใช้จ่ายและเป็นกำไร", "Slide 5-36", "05-24"], ["c5", "Periodic system ตอนขายต่างจาก Perpetual อย่างไร?", "Periodic ไม่บันทึก COGS/ลด Inventory ทุกครั้งที่ขาย\nหา COGS ตอนสิ้นงวดจากการนับสินค้า", "Slides 5-39, 5-40", "05-25"], ["c6", "Merchandise inventory รวมสินค้าแบบไหน?", "สินค้าทุกชิ้นที่กิจการ “เป็นเจ้าของ” และถือไว้เพื่อขาย ไม่ว่าสินค้าจะอยู่ที่ไหนตอนนับ", "Slide 6-2", "06-1"], ["c6", "สินค้า 3 กลุ่มที่ต้องระวังตอนนับ Inventory?", "Goods in transit · Goods on consignment · Goods damaged or obsolete", "Slide 6-2", "06-2"], ["c6", "Goods in transit เป็นของใคร?", "FOB shipping point → ของผู้ซื้อตั้งแต่ส่งออก\nFOB destination → ยังเป็นของผู้ขายจนถึงปลายทาง", "Slide 6-3", "06-3"], ["c6", "Goods on consignment นับใน Inventory ของใคร?", "ของ Consignor (ผู้ฝากขาย ซึ่งเป็นเจ้าของ)\nไม่ใช่ Consignee (ร้านที่รับฝากขาย)", "Slide 6-4", "06-4"], ["c6", "สินค้าชำรุด/ล้าสมัย จัดการอย่างไร?", "ขายไม่ได้ → ไม่นับใน Inventory\nยังขายได้ → ลดมูลค่าเป็น NRV", "Slide 6-5", "06-5"], ["c6", "NRV (Net realizable value) คืออะไร?", "ราคาขายที่คาดว่าจะได้ − ต้นทุนที่ต้องทำให้เสร็จ − ต้นทุนที่จำเป็นในการขาย", "Slides 6-5, 6-27", "06-6"], ["c6", "ต้นทุน Inventory รวมอะไรบ้าง?", "Invoice cost − Discounts & Allowances + Import duties + Freight + Storage + Insurance\n(ทุกรายจ่ายที่ทำให้สินค้าพร้อมขาย)", "Slide 6-6", "06-7"], ["c6", "การควบคุมภายในตอนตรวจนับสินค้า 5 ข้อ?", "1) ใบนับมีเลขเรียง 2) คนนับไม่ใช่คนดูแลสินค้า 3) ยืนยันมีอยู่จริง จำนวน คุณภาพ 4) นับซ้ำครั้งที่สอง 5) ผู้จัดการยืนยันว่านับครบ", "Slide 6-7", "06-8"], ["c6", "ผู้บริหารต้องตัดสินใจเรื่อง Inventory 4 อะไร?", "1) อะไรนับเป็น Inventory และต้นทุนเท่าไร 2) วิธีคิดต้นทุน (Specific ID, FIFO, WAC) 3) ระบบ Perpetual/Periodic 4) ใช้ราคาตลาดหรือประมาณการไหม", "Slide 6-9", "06-9"], ["c6", "LIFO ใช้ได้ภายใต้ IFRS ไหม?", "ไม่ได้ LIFO ไม่อนุญาตภายใต้ IFRS", "Slides 6-9, 6-37", "06-10"], ["c6", "Specific identification, FIFO, Weighted average ต่างกันอย่างไร?", "Specific ID = ใช้ต้นทุนจริงของชิ้นที่ขาย\nFIFO = ต้นทุนที่เข้าก่อนออกก่อน\nWAC = ใช้ต้นทุนเฉลี่ยของสินค้าที่มี", "Slide 6-10", "06-11"], ["c6", "FIFO: COGS และ Ending inventory ใช้ต้นทุนชุดไหน?", "COGS = ต้นทุนเก่าสุด (Oldest)\nEnding inventory = ต้นทุนล่าสุด (Recent)", "Slide 6-15", "06-12"], ["c6", "Weighted average cost ต่อหน่วยคิดอย่างไร?", "Cost of goods available for sale ÷ Units on hand ณ วันขาย", "Slide 6-19", "06-13"], ["c6", "ต้นงวด 10 หน่วย @100 ซื้อเพิ่ม 10 @120 ขาย 12 หน่วย — COGS แบบ FIFO และ WAC?", "FIFO: (10×100)+(2×120) = 1,240 · EI = 8×120 = 960\nWAC: เฉลี่ย 2,200/20 = 110 → COGS 1,320 · EI 880", "ตำรา p.217–221", "06-14"], ["c6", "ข้อดีของ FIFO และ Weighted average ตามสไลด์?", "FIFO: Ending inventory ใกล้ต้นทุนทดแทนปัจจุบัน\nWAC: ช่วยเกลี่ยความผันผวนของราคา", "Slide 6-25", "06-15"], ["c6", "ราคาซื้อเพิ่มขึ้น FIFO ให้ผลอย่างไรเทียบกับวิธีเฉลี่ย?", "COGS ต่ำกว่า · กำไรสูงกว่า · Ending inventory สูงกว่า", "Slides 6-24, 6-25", "06-16"], ["c6", "Consistency คืออะไร เปลี่ยนวิธีได้ไหม?", "ใช้วิธีเดิมกับรายการเดิมทุกงวด (เชื่อมกับ Comparability)\nเปลี่ยนได้ถ้าทำให้รายงานดีขึ้น แต่ต้องเปิดเผยประเภท เหตุผล และผลต่อกำไรในหมายเหตุ", "Slide 6-26", "06-17"], ["c6", "Lower of cost and NRV ใช้อย่างไร?", "ถ้า NRV < Cost ให้แสดงที่ NRV\nทำได้ 2 แบบ: แยกรายสินค้า หรือตามกลุ่มหลัก\nบันทึก Dr. COGS / Cr. Inventory", "Slides 6-27–6-30", "06-18"], ["c6", "Ending inventory สูงเกินจริง กระทบอะไร?", "COGS ต่ำเกินจริง → กำไรสูงเกินจริง (งวดนี้)\nและงวดถัดไปจะผิดในทิศตรงข้าม", "Slides 6-31, 6-32", "06-19"], ["c6", "Inventory turnover คำนวณอย่างไร?", "COGS ÷ Average inventory\nAverage inventory = (ต้นงวด + ปลายงวด) ÷ 2", "Slide 6-33", "06-20"], ["c6", "Days’ sales in inventory คำนวณอย่างไร?", "(Ending inventory ÷ COGS) × 365\n= สินค้าคงเหลือพอขายได้กี่วัน", "Slide 6-34", "06-21"], ["c6", "เมื่อไหร่ต้องประมาณมูลค่า Inventory มีวิธีอะไร?", "งบระหว่างกาล หรือเกิดไฟไหม้/น้ำท่วมจนนับจริงไม่ได้\nวิธี: Retail inventory method · Gross profit method", "Slide 6-36", "06-22"], ["c7", "AIS (Accounting information system) ทำหน้าที่อะไร?", "เก็บและประมวลผลข้อมูลจากรายการค้า จัดเป็นรายงานที่มีประโยชน์ และสื่อสารผลให้ผู้ตัดสินใจ", "Slide 7-2", "07-1"], ["c7", "องค์ประกอบ 5 ส่วนของระบบบัญชี?", "Source documents · Input devices · Information processors · Information storage · Output devices", "Slides 7-3, 7-4", "07-2"], ["c7", "ตัวอย่าง Input devices และ Processor?", "Input: Keyboard, Scanner, Modem, Bar-code reader\nProcessor: Hardware, Software, Professional judgment", "Slide 7-3", "07-3"], ["c7", "ตัวอย่าง Storage และ Output devices?", "Storage: CD/DVD, Hard drive, Tape, Paper document\nOutput: Printer, Monitor, Projector, Web communications", "Slide 7-4", "07-4"], ["c7", "ทำไมใช้ Special journals?", "แยกรายการที่เกิดบ่อยตามประเภท (ขายเชื่อ ซื้อเชื่อ รับเงิน จ่ายเงิน) → บันทึกและ Post ยอดรวมได้เร็วและเป็นระบบ", "Slide 7-5", "07-5"], ["c7", "Special journals 4 แบบหลัก?", "Sales journal · Cash receipts journal · Purchases journal · Cash payments journal", "Slide 7-5", "07-6"], ["c7", "Subsidiary ledger คืออะไร?", "รายการบัญชีรายตัวที่มีลักษณะร่วมกัน เช่น ลูกหนี้แต่ละราย หรือเจ้าหนี้แต่ละราย", "Slide 7-6", "07-7"], ["c7", "Controlling account ของ AR ledger และ AP ledger คืออะไร?", "ลูกหนี้รายตัว → Accounts Receivable\nเจ้าหนี้รายตัว → Accounts Payable\n(อยู่ใน General ledger)", "Slide 7-6", "07-8"], ["c7", "Sales journal บันทึกอะไร?", "เฉพาะ “ขายเชื่อ” (Credit sales)\nขายเงินสด → Cash receipts journal", "Slides 7-8, 7-12", "07-9"], ["c7", "Proving the ledgers (AR) ทำอย่างไร?", "ทำ Schedule of accounts receivable (ลูกค้าแต่ละราย + ยอดค้าง)\nผลรวมต้องเท่ากับ AR controlling account", "Slide 7-9", "07-10"], ["c7", "Sales tax ที่เก็บจากลูกค้าเป็นรายได้ไหม?", "ไม่ใช่ เป็นเงินที่ต้องนำส่งหน่วยงานรัฐเป็นระยะ (หนี้สิน)", "Slide 7-10", "07-11"], ["c7", "Sales returns & allowances บันทึกที่ไหน?", "มีน้อย → General journal\nมีมาก → Sales returns and allowances journal", "Slide 7-11", "07-12"], ["c7", "Cash receipts มี 3 ประเภทอะไร?", "1) เงินจากลูกหนี้ (credit customers) 2) เงินจากขายสด 3) เงินจากแหล่งอื่น", "Slide 7-12", "07-13"], ["c7", "Footing, Crossfooting, Posting คืออะไร?", "Footing = รวมยอดแต่ละคอลัมน์\nCrossfooting = ตรวจว่ารวม Dr. เท่ากับรวม Cr.\nPosting = ผ่านยอดไปบัญชีแยกประเภทและบัญชีย่อย", "Slide 7-13", "07-14"], ["c7", "Proving the ledger (AP) ทำอย่างไร?", "ทำ Schedule of accounts payable (ผู้ขายแต่ละราย + ยอดที่ค้างจ่าย)\nผลรวมต้องเท่ากับ AP controlling account", "Slide 7-15", "07-15"], ["c7", "รายการแบบไหนบันทึกใน General journal?", "Adjusting entries · Closing entries · Sales returns & allowances · Purchase returns & allowances", "Slide 7-17", "07-16"], ["c7", "Off-the-shelf กับ Integrated software ต่างกันอย่างไร?", "Off-the-shelf = โปรแกรมสำเร็จรูปใช้ง่าย มีเมนู (เช่น QuickBooks)\nIntegrated = บันทึกที่จุดเดียว ระบบส่วนอื่นอัปเดตตามอัตโนมัติ", "Slide 7-18", "07-17"], ["c7", "Online processing กับ Batch processing ต่างกันอย่างไร?", "Online = ป้อนและประมวลผลทันที\nBatch = สะสมข้อมูลไว้แล้วประมวลผลพร้อมกัน (รายวัน/สัปดาห์/เดือน)", "Slide 7-19", "07-18"], ["c7", "Computer network ช่วยงานบัญชีอย่างไร?", "เชื่อม Server กับ Work stations ให้ผู้ใช้หลายคนเข้าถึงฐานข้อมูลและโปรแกรมเดียวกัน", "Slide 7-20", "07-19"], ["c7", "ERP คืออะไร?", "Enterprise resource planning = โปรแกรมที่จัดการและบูรณาการการดำเนินงานสำคัญทั้งองค์กร", "Slide 7-21", "07-20"], ["c7", "Segment คืออะไร?", "ส่วนของกิจการที่แยกได้ตามสินค้า บริการ หรือตลาดทางภูมิศาสตร์", "Slide 7-22", "07-21"], ["c7", "Segment return on assets คำนวณอย่างไร?", "Segment operating profit ÷ Segment average assets\nใช้ดูว่าส่วนงานใดใช้สินทรัพย์ได้คุ้มที่สุด", "Slide 7-23", "07-22"], ["c7", "Special journals ใน Periodic system ต่างอย่างไร?", "Sales journal ไม่มีคอลัมน์ COGS/Inventory\nการซื้อบันทึกเข้าบัญชี Purchases แทน Inventory", "Slides 7-24, 7-25", "07-23"], ["c7", "AR ย่อยรวม 9,200 แต่ AR control 9,000 ควรทำอะไร?", "หาการ Post ที่หาย ผิดยอด หรือซ้ำ ก่อนทำงบ — ห้ามปรับยอดโดยไม่มีหลักฐาน", "ตำรา ch.7", "07-24"], ["c8", "Internal control system มีเป้าหมาย 4 ข้ออะไร?", "1) ปกป้องสินทรัพย์ 2) ให้บัญชีเชื่อถือได้ 3) ส่งเสริมการดำเนินงานมีประสิทธิภาพ 4) ให้ทำตามนโยบายบริษัท", "Slide 8-2", "08-1"], ["c8", "หลักการควบคุมภายใน 7 ข้อ?", "1) กำหนดความรับผิดชอบ 2) เก็บหลักฐานให้พอ 3) ประกันทรัพย์สิน/ค้ำประกันพนักงานสำคัญ 4) แยกผู้บันทึกจากผู้ดูแลทรัพย์สิน 5) แบ่งหน้าที่ของรายการที่เกี่ยวข้อง 6) ใช้เทคโนโลยีควบคุม 7) ตรวจทานสม่ำเสมอโดยอิสระ", "Slide 8-3", "08-2"], ["c8", "เทคโนโลยีส่งผลต่อการควบคุมภายในอย่างไร?", "Error จากการประมวลผลลดลง · ทดสอบข้อมูลได้มากขึ้น · หลักฐานการประมวลผลน้อยลง · การแยกหน้าที่สำคัญมากขึ้น · E-commerce เพิ่มขึ้น", "Slide 8-4", "08-3"], ["c8", "Human error กับ Human fraud ต่างกันอย่างไร?", "Error = ไม่ตั้งใจ (Negligence, Fatigue, Misjudgment, Confusion)\nFraud = ตั้งใจเอาชนะการควบคุมเพื่อประโยชน์ส่วนตัว", "Slide 8-5", "08-4"], ["c8", "Fraud triple-threat มีอะไร?", "Opportunity · Pressure · Rationalization", "Slide 8-5", "08-5"], ["c8", "ข้อจำกัดด้านต้นทุนของการควบคุมภายใน?", "ต้นทุนของการควบคุมต้องไม่เกินประโยชน์ที่ได้", "Slide 8-6", "08-6"], ["c8", "แนวทางควบคุมเงินสด 3 ข้อ?", "1) แยกการถือเงินสดจากการบันทึกบัญชี 2) จ่ายเงินด้วยเช็ค 3) ฝากเงินรับเข้าธนาคารทันที", "Slide 8-7", "08-7"], ["c8", "Cash รวมอะไรบ้าง?", "ธนบัตร เหรียญ เงินฝากธนาคาร/กระแสรายวัน/ออมทรัพย์บางประเภท + เช็คลูกค้า แคชเชียร์เช็ค เช็ครับรอง ธนาณัติ", "Slide 8-8", "08-8"], ["c8", "Cash equivalents ต้องมีลักษณะอะไร?", "เงินลงทุนระยะสั้นสภาพคล่องสูงที่\n1) แปลงเป็นเงินสดจำนวนที่รู้แน่นอนได้ง่าย\n2) เสี่ยงต่อการเปลี่ยนมูลค่าน้อยมาก", "Slide 8-8", "08-9"], ["c8", "เป้าหมาย Cash management 2 ข้อ?", "1) วางแผนเงินรับให้พอจ่ายเมื่อถึงกำหนด\n2) ถือเงินสดขั้นต่ำเท่าที่จำเป็น", "Slide 8-9", "08-10"], ["c8", "หลัก Cash management 5 ข้อ?", "เร่งเก็บลูกหนี้ · ชะลอจ่ายหนี้ · ถือสินทรัพย์เท่าที่จำเป็น · วางแผนรายจ่าย · ลงทุนเงินสดส่วนเกิน", "Slide 8-9", "08-11"], ["c8", "เครื่องบันทึก $550 แต่นับได้ $555 บันทึกอย่างไร?", "Dr. Cash 555 / Cr. Cash over and short 5 / Cr. Sales 550\n(ถ้าขาด → Dr. Cash over and short)", "Slide 8-11", "08-12"], ["c8", "รับเงินทางไปรษณีย์ แบ่งหน้าที่อย่างไร?", "2 คนเปิดจดหมาย → Cashier นำเงินฝากธนาคาร → Recordkeeper บันทึกบัญชี", "Slide 8-12", "08-13"], ["c8", "ทำไมการควบคุมเงินจ่ายสำคัญ และหลักคืออะไร?", "การโกงก้อนใหญ่มักมาจากจ่ายตาม Invoice ปลอม\nหลัก: จ่ายทุกอย่างด้วยเช็ค · จำกัดการเข้าถึงเช็คเฉพาะผู้มีอำนาจลงนาม", "Slide 8-13", "08-14"], ["c8", "Voucher system ทำอะไร?", "1) ตรวจสอบ อนุมัติ บันทึกภาระหนี้ก่อน\n2) ออกเช็คจ่ายเฉพาะหนี้ที่ผ่านการตรวจ อนุมัติ และบันทึกแล้ว", "Slide 8-14", "08-15"], ["c8", "Petty cash ใช้กับรายจ่ายแบบไหน?", "รายจ่ายเล็กน้อยที่เกิดบ่อย เช่น ไปรษณีย์ ค่าส่งเอกสาร ซ่อมแซม วัสดุสิ้นเปลือง — ใช้เพื่อธุรกิจเท่านั้น", "Slides 8-16, 8-18", "08-16"], ["c8", "สัญญาณว่า Petty cash ถูกใช้ผิด?", "ใบสำคัญจ่ายที่ไม่มีลายเซ็น หรือลายเซ็นปลอม", "Slide 8-19", "08-17"], ["c8", "ตั้งกองทุนและเติมเงิน Petty cash บันทึกอย่างไร?", "ตั้ง: Dr. Petty cash / Cr. Cash\nเติม: Dr. ค่าใช้จ่ายตามใบสำคัญ / Cr. Cash (บัญชี Petty cash ไม่เปลี่ยน)", "Slides 8-17, 8-20", "08-18"], ["c8", "บริการพื้นฐานของธนาคารมีอะไร?", "Bank accounts · Signature cards · Deposit tickets · Checks · Electronic funds transfer · Bank statements", "Slide 8-22", "08-19"], ["c8", "Bank reconciliation คืออะไร?", "การอธิบายผลต่างระหว่างยอดเงินตาม Bank statement กับยอดในสมุดบัญชีของบริษัท", "Slide 8-24", "08-20"], ["c8", "ฝั่ง Bank ปรับอะไรบ้าง?", "Balance per bank\n+ Deposits in transit\n− Outstanding checks\n± Errors\n= Adjusted balance", "Slide 8-25", "08-21"], ["c8", "ฝั่ง Book ปรับอะไรบ้าง?", "Balance per book\n+ Collections & Interest\n− Uncollectible items (NSF, ค่าธรรมเนียม)\n± Errors\n= Adjusted balance", "Slide 8-25", "08-22"], ["c8", "ต้องทำ Adjusting entry ฝั่งไหน?", "เฉพาะรายการฝั่ง Book (ธนาคารบันทึกแล้วแต่บริษัทยังไม่รู้)", "Slides 8-25, 8-29", "08-23"], ["c8", "Days’ sales uncollected คำนวณอย่างไร?", "(Accounts receivable ÷ Net sales) × 365\n= อีกกี่วันจะได้รับเงินจากการขายเชื่อ", "Slide 8-30", "08-24"], ["c8", "เอกสารควบคุมการซื้อ (Appendix 8A) เรียงอย่างไร?", "Purchase requisition → Purchase order → Invoice → Receiving report → Voucher", "Slide 8-31", "08-25"], ["c8", "Net method ช่วยควบคุม Purchase discounts อย่างไร?", "บันทึกซื้อด้วยยอดสุทธิ ถ้าพลาดส่วนลดจะเกิดบัญชี Discounts lost (ค่าใช้จ่าย) ให้ผู้บริหารเห็น", "Slide 8-32", "08-26"], ["c9", "Receivable คืออะไร?", "จำนวนเงินที่บุคคลอื่นค้างชำระกิจการ\nต้องมีบัญชีแยกรายลูกค้า (ซื้อเท่าไร จ่ายแล้วเท่าไร ค้างเท่าไร)", "Slide 9-2", "09-1"], ["c9", "ขายเชื่อ 950 และรับชำระหนี้เก่า 720 บันทึกอย่างไร?", "Dr. Accounts receivable 950 / Cr. Sales 950\nDr. Cash 720 / Cr. Accounts receivable 720", "Slides 9-3, 9-4", "09-2"], ["c9", "ข้อดีของการรับบัตรเครดิต 3 ข้อ?", "1) โอนความเสี่ยงการให้เครดิตไปที่ผู้ออกบัตร 2) ยอดขายเพิ่ม 3) ได้เงินสดเร็วขึ้น", "Slide 9-5", "09-3"], ["c9", "ขายผ่านบัตร 100 ค่าธรรมเนียม 4% ได้เงินทันที บันทึกอย่างไร?", "Dr. Cash 96\nDr. Credit card expense 4\n   Cr. Sales 100", "Slide 9-6", "09-4"], ["c9", "Installment accounts receivable คืออะไร?", "ลูกหนี้จากการขายเชื่อที่ผ่อนชำระเป็นงวดในระยะยาว โดยทั่วไปคิดดอกเบี้ย", "Slide 9-8", "09-5"], ["c9", "วิธีบัญชีหนี้สูญ (Bad debts) มี 2 วิธีอะไร?", "Direct write-off method · Allowance method", "Slide 9-9", "09-6"], ["c9", "Direct write-off: ลูกหนี้ J. Kent 520 เก็บไม่ได้ บันทึกอย่างไร?", "Dr. Bad debts expense 520 / Cr. Accounts receivable—J. Kent 520", "Slide 9-10", "09-7"], ["c9", "Direct write-off: ลูกหนี้ที่ตัดแล้วกลับมาจ่าย บันทึกอย่างไร?", "1) Dr. Accounts receivable / Cr. Bad debts expense (คืนยอด)\n2) Dr. Cash / Cr. Accounts receivable", "Slide 9-11", "09-8"], ["c9", "ข้อดีของ Allowance method 2 ข้อ?", "1) บันทึกหนี้สูญโดยประมาณในงวดเดียวกับยอดขาย\n2) แสดงลูกหนี้ในงบด้วยยอดที่คาดว่าจะเก็บได้", "Slide 9-12", "09-9"], ["c9", "ประมาณหนี้สูญ 1,500 ตอนสิ้นปี บันทึกอย่างไร?", "Dr. Bad debts expense 1,500 / Cr. Allowance for doubtful accounts 1,500\nงบ: AR 20,000 − Allowance 1,500 = 18,500", "Slides 9-13, 9-14", "09-10"], ["c9", "Allowance method: ตัดหนี้สูญ 520 บันทึกอย่างไร กระทบยอดสุทธิไหม?", "Dr. Allowance for doubtful accounts 520 / Cr. Accounts receivable 520\nไม่กระทบ Realizable value ของลูกหนี้", "Slides 9-15, 9-16", "09-11"], ["c9", "Allowance method: ลูกหนี้ที่ตัดแล้วกลับมาจ่าย 520?", "1) Dr. Accounts receivable 520 / Cr. Allowance 520\n2) Dr. Cash 520 / Cr. Accounts receivable 520", "Slide 9-17", "09-12"], ["c9", "Percent of receivables: หา Bad debts expense อย่างไร?", "1) หายอด Allowance ที่ต้องการ = AR × %\n2) Expense = ยอดที่ต้องการ − ยอดเครดิตเดิมใน Allowance", "Slide 9-19", "09-13"], ["c9", "AR 50,000 คาดสูญ 5% Allowance เครดิตเดิม 200 → Bad debts expense?", "2,500 − 200 = 2,300", "Slide 9-20", "09-14"], ["c9", "Aging of receivables ทำ 3 ขั้นอะไร?", "1) แบ่งลูกหนี้ตามจำนวนวันที่ค้าง 2) คูณแต่ละกลุ่มด้วย % หนี้สูญ 3) รวมยอดประมาณ", "Slide 9-21", "09-15"], ["c9", "Aging ได้ยอดที่ต้องการ 2,270 Allowance มีเครดิต 200 → ปรับเท่าไร?", "2,270 − 200 = 2,070\nDr. Bad debts expense 2,070 / Cr. Allowance 2,070", "Slide 9-23", "09-16"], ["c9", "AR 71,200 มีรายหนึ่ง 6,000 คาดสูญ 10% ที่เหลือ 2% Allowance เดิม 1,700 → ตั้งเพิ่มเท่าไร?", "10%×6,000 + 2%×65,200 = 600 + 1,304 = 1,904\n1,904 − 1,700 = 204", "Slide 9-25", "09-17"], ["c9", "Promissory note คืออะไร?", "คำมั่นเป็นลายลักษณ์อักษรว่าจะจ่ายเงินจำนวนที่ระบุ (มักมีดอกเบี้ย) เมื่อทวงถามหรือในวันที่กำหนด", "Slide 9-26", "09-18"], ["c9", "ตั๋ว 1,000 12% 90 วัน ลงวันที่ 10 ก.ค. ครบกำหนดวันไหน ดอกเบี้ยเท่าไร?", "ครบ 8 ต.ค.\nดอกเบี้ย = 1,000 × 12% × 90/360 = 30 (ใช้ฐาน 360 วัน)", "Slides 9-27, 9-28", "09-19"], ["c9", "รับตั๋วเงินจากการขายสินค้า บันทึกอย่างไร?", "Dr. Notes receivable / Cr. Sales (ตามเงินต้น)", "Slide 9-29", "09-20"], ["c9", "ตั๋ว 600 15% 60 วันได้รับชำระ (Honored) บันทึกอย่างไร?", "ดอกเบี้ย = 600 × 15% × 60/360 = 15\nDr. Cash 615 / Cr. Notes receivable 600 / Cr. Interest revenue 15", "Slide 9-30", "09-21"], ["c9", "Dishonored note คืออะไร ลูกหนี้ยังต้องจ่ายไหม?", "ผู้ออกตั๋วไม่ชำระเมื่อครบกำหนด แต่ยังมีภาระจ่ายเงินต้นและดอกเบี้ย → โอนเป็น Accounts receivable", "Slide 9-31", "09-22"], ["c9", "ตั๋ว 3,000 12% 60 วัน รับ 16 ธ.ค. ดอกเบี้ยค้างรับ ณ 31 ธ.ค.?", "3,000 × 12% × 15/360 = 15\nDr. Interest receivable 15 / Cr. Interest revenue 15\n(ทั้งตั๋ว = 60)", "Slides 9-32, let checked=false, suggest=0;
function sched(s,r){
  const now=Date.now(); s=Object.assign({st:'learn',step:0,ease:2.5,ivl:0,lapses:0},s||{});
  const grad=ivl=>{ s.st='rev'; s.ivl=ivl; s.due=sod(now)+ivl*DAY; delete s.rl; };
  if(s.st==='learn'){
    if(r===1){ s.step=0; s.due=now+LEARN[0]*MIN; }
    else if(r===2){ s.due=now+(s.step===0?6:LEARN[1])*MIN; }
    else if(r===3){ if(s.step+1<LEARN.length){ s.step++; s.due=now+LEARN[s.step]*MIN; } else grad(s.rl||1); }
    else grad(s.rl?Math.max(s.rl+1,2):4);
  } else {
    if(r===1){ s.lapses++; s.ease=Math.max(1.3,s.ease-0.2); s.rl=Math.max(1,Math.round(s.ivl*0.5)); s.st='learn'; s.step=1; s.due=now+LEARN[1]*MIN; }

const EMBQ=[{"url": "https://app.notion.com/p/412f029841258100ad6ed2ba1a39d23b", "Question": "กิจการมีสินค้ารุ่นเดียวกันหลายล็อต แต่ทุกล็อตมีต้นทุนหน่วยละ 200 บาทเท่ากัน และสามารถระบุต้นทุนรายชิ้นได้ หากขายจำนวนหน่วยเท่ากัน ข้อใดเปรียบเทียบ FIFO, Weighted Average และ Specific Identification ได้ถูกต้องที่สุด?", "Correct": "ทั้งสามวิธีให้ต้นทุนขายและต้นทุนสินค้าคงเหลือเท่ากันสำหรับสินค้ารุ่นนี้ เพราะทุกหน่วยมีต้นทุนเท่ากัน", "Wrong 1": "FIFO ให้ต้นทุนขายสูงที่สุดเสมอแม้ต้นทุนทุกล็อตเท่ากัน", "Wrong 2": "Weighted Average ให้ต้นทุนขายต่ำที่สุดเสมอแม้ต้นทุนทุกล็อตเท่ากัน", "Wrong 3": "Specific Identification บังคับให้ประเมินตามราคาขายไม่ใช่ราคาต้นทุน", "Explanation": "ความแตกต่างของผลจากสมมติฐานต้นทุนเกิดจากต้นทุนแต่ละล็อตเปลี่ยน หากทุกหน่วยต้นทุนเดียวกัน การจัดสรรต้นทุนของทั้งสามวิธีย่อมเท่ากัน (สไลด์ 10, 24)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581078e82e8c9476e8511", "Question": "ใน Bank Statement รายการใดควรปรากฏเป็นรายการหักหรือ Debit ต่อบัญชีเงินฝากของลูกค้า แทนที่จะเป็นรายการเพิ่มยอดฝากหรือ Credit เมื่อธนาคารทำรายการแล้วอย่างถูกต้อง?", "Correct": "ค่าธรรมเนียมธนาคารและการถอนเงินผ่าน ATM", "Wrong 1": "เงินสดที่บริษัทนำฝากเข้าบัญชีธนาคารสำเร็จ", "Wrong 2": "ดอกเบี้ยเงินฝากที่ธนาคารเพิ่มให้ลูกค้า", "Wrong 3": "เงินรับโอนที่บุคคลอื่นส่งเข้าบัญชีเงินฝาก", "Explanation": "Bank Statement แสดงรายการถอนและค่าธรรมเนียมเป็นเดบิตที่ลดยอดบัญชีฝาก ส่วนเงินฝากและเงินรับเพิ่มเป็นเครดิต (สไลด์ 23)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125812fb0f2e1c9989148bb", "Question": "บริษัทมีสินค้าคงเหลือต้นปี 40,000 บาท ปลายปี 60,000 บาท และต้นทุนขายทั้งปี 365,000 บาท กำหนดปีละ 365 วัน คำนวณ Inventory Turnover โดยใช้ค่าเฉลี่ยต้น–ปลายปีได้ 7.30 ครั้ง แต่ Days' Sales in Inventory ได้ 60 วัน ไม่ใช่ 365÷7.30 ซึ่งเท่ากับ 50 วัน เหตุใดตัวชี้วัดสองตัวจึงไม่เป็นค่ากลับกันโดยตรง?", "Correct": "Inventory Turnover ใช้สินค้าคงเหลือเฉลี่ยเป็นตั 1ee511a66b01f8", "Question": "พนักงานตรวจ Crossfoot แล้วพบว่ายอดรวมเดบิตและเครดิตของสมุดรายวันเฉพาะเท่ากันทุกคอลัมน์ แต่ภายหลังตรวจพบว่าบันทึกค่าใช้จ่ายเช่าที่ควรเดบิต Rent Expense เป็น Office Supplies Expense ในจำนวนเดียวกัน ข้อสรุปใดถูกต้องที่สุด?", "Correct": "Crossfoot ตรวจความเท่ากันของยอดเดบิต–เครดิต แต่ไม่ได้ยืนยันว่าบัญชีที่เลือกใช้จัดประเภทรายการถูกต้อง", "Wrong 1": "Crossfoot รับประกันว่ารายการถูกจัดเข้าบัญชีทุกชื่อได้ถูกต้องเสมอ", "Wrong 2": "Crossfoot ใช้ตรวจเฉพาะยอดลูกหนี้รายบุคคล ไม่เกี่ยวกับยอดเดบิตเครดิต", "Wrong 3": "เมื่อยอดรวมเดบิตเครดิตเท่ากันจะไม่สามารถมีความผิดพลาดทางบัญชีประเภทใดได้", "Explanation": "Crossfoot เป็นการเปรียบเทียบยอดรวมฝั่งเดบิตและเครดิต จึงตรวจพบความไม่สมดุลได้ แต่ไม่พิสูจน์ความถูกต้องของการเลือกบัญชี (สไลด์ 13)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581d5a3f9f4922f27c2ba", "Question": "บริษัทพบว่าพนักงานหนึ่งคนรับเงินสดและปรับยอดบัญชีลูกหนี้ได้โดยไม่มีผู้ตรวจทาน พนักงานจึงมองเห็นช่องทางเก็บเงินลูกค้าแล้วไม่บันทึกเงินรับให้ครบ สถานการณ์ช่องโหว่ดังกล่าวเป็นส่วนใดของ Fraud Triangle มากที่สุด?", "Correct": "Opportunity — การควบคุมภายในมีช่องว่างให้กระทำทุจริตและปกปิดได้", "Wrong 1": "Rationalization — การหาเหตุผลเข้าข้างตนเองว่าการกระทำไม่ผิด", "Wrong 2": "Pressure — ความเครียดด้านการเงินส่วนตัวหรือครอบครัว", "Wrong 3": "Asset Liquidity — ความสามารถเปลี่ยนสินทรัพย์เป็นเงินสด", "Explanation": "Fraud Triangle มอง Opportunity เป็นโอกาสที่เกิดจากจุดอ่อนการควบคุมภายใน เช่น คนเดียวรับเงินและแก้บัญชีโดยไม่มีการตรวจทาน (สไลด์ 5)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581e2959eca5aab7fb22e", "Question": "นักวิเคราะห์ต้องเปรียบเทียบความสามารถในการเก็บลูกหนี้ของบริษัทในประเทศที่ใช้สกุลเงินต่างกัน โดยแต่ละแห่งรายงานยอดขายและลูกหนี้ในสกุลของตนเอง ตัววัดใดช่วยเปรียบเทียบประสิทธิภาพได้เหมาะกว่าการเทียบยอดลูกหนี้เป็นจำนวนเงินตรง ๆ?", "Correct": "Accounts Receivable Turnover ซึ่งเป็นอัตราส่วน Net Sales ต่อ Average Accounts Receivable", "Wrong 1": "ยอดลูกหนี้เป็นจำนวนเงินดิบของแต่ละสกุลโดยไม่ปรับหรือเทียบอัตราส่วน", "Wrong 2": "จำนวนธนบัตรที่แต่ละบริษัทถือในสำนักงาน", "Wrong 3": "มูลค่าที่ดินของผู้บริหารหารด้วยจำนวนลูกหนี้ทั้งหมด", "Explanation": "Accounts Receivable Turnover ใช้อัตราส่วนรายได้ต่อยอดลูกหนี้เฉลี่ย จึงช่วยเปรียบเทียบประสิทธิภาพการจัดการลูกหนี้ข้ามบริษัทแม้สกุลเงินต่างกันได้ (สไลด์ 35)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125810da8bcfe42b2f30fed", "Question": "บริษัทเปิดเผยข้อมูลผลประกอบการแยกตาม Segment ผู้วิเคราะห์ต้องการประเมินความแตกต่างระหว่างส่วนงาน ไม่ใช่เพียงยอดขาย รายการข้อมูลชุดใดตรงกับสิ่งที่สไลด์ระบุว่าใช้รายงานผลของ Segment?", "Correct": "ยอดขาย กำไรดำเนินงาน สินทรัพย์ที่ระบุได้ รายจ่ายลงทุน และค่าเสื่อมราคา", "Wrong 1": "เพียงชื่อหัวหน้าส่วนงานและจำนวนวันลาพักร้อนของพนักงาน", "Wrong 2": "เฉพาะยอดเงินสดย่อยและหมายเลขเช็คโดยไม่ต้องมียอดขายหรือกำไร", "Wrong 3": "เฉพาะราคาเสนอขายสินค้าครั้งล่าสุดของแต่ละส่วนงาน", "Explanation": "สไลด์ระบุการรายงาน Segment ตามยอดขาย Operating Income, Identifiable Assets, Capital Expenditures และ Depreciation เพื่อประกอบการวิเคราะห์ (สไลด์ 22)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125813ab2e4feb990290705", "Question": "บริษัทถือ Notes Receivable จำนวนมากและต้องติดตามกำหนดชำระดอกเบี้ย เมื่อจัดเก็บตั๋วต้นฉบับและข้อมูลประกอบ ควรบันทึกชุดข้อมูลใดตามสไลด์เพื่อช่วยบริหารตั๋วเงินรับ?", "Correct": "ชื่อผู้ทำตั๋ว (Maker), อัตราดอกเบี้ย และวันครบกำหนด", "Wrong 1": "เฉพาะหมายเลขสินค้าในคลังและราคาขายปลีก", "Wrong 2": "เฉพาะเลขที่เช็คของบริษัทที่ใช้จ่ายเงินสดย่อย", "Wrong 3": "เฉพาะยอดซื้อสินค้าคงเหลือและจำนวนสินค้าเสียหาย", "Explanation": "ข้อมูลตั๋วเงินรับที่จัดเก็บควรระบุผู้ทำตั๋ว อัตราดอกเบี้ย และวันครบกำหนด เพื่อสะดวกต่อการติดตามและจัดการบัญชี (สไลด์ 29)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258152b7a8eb586e26674d", "Question": "บริษัทเคยรับเช็คลูกค้า 650 บาทชำระลูกหนี้และบันทึกรับเงินแล้ว แต่เมื่อฝากธนาคาร เช็คถูกส่งคืนเป็น NSF และธนาคารเรียกค่าธรรมเนียมจัดการ 25 บาทซึ่งบริษัทไม่ได้บันทึกมาก่อน กำหนดว่าบริษัทจะเรียกเก็บเงินจากลูกหนี้ต่อ ต้องบันทึกเฉพาะรายการปรับสมุดบัญชีจาก NSF และค่าธรรมเนียมอย่างไร?", "Correct": "เดบิต Accounts Receivable 650 บาท; เดบิต Bank Charges Expense 25 บาท; เครดิต Cash 675 บาท", "Wrong 1": "เดบิต Cash 675 บาท; เครดิต Accounts Receivable 650 บาท; เครดิต Bank Charges Expense 25 บาท", "Wrong 2": "เดบิต Accounts Receivable 675 บาท; เครดิต Cash 675 บาท โดยไม่รับรู้ค่าธรรมเนียม", "Wrong 3": "เดบิต Bad Debts Expense 650 บาท; เครดิต Cash 650 บาท และไม่บันทึกค่าธรรมเนียม", "Explanation": "เช็ค NSF ต้องกลับรายการรับชำระลูกหนี้ 650 บาทและรับรู้ค่าใช้จ่ายธนาคาร 25 บาท ทำให้เงินสดในสมุดลด 675 บาท (สไลด์ 25, 29)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258177a7fbe19939dee0fb", "Question": "กิจการได้รับเช็คส่วนบุคคลจากลูกค้า แคชเชียร์เช็ค และธนาณัติ (Money Order) ที่สามารถใช้ชำระเงินตามปกติ ผู้ฝึกงานบอกว่า 'สิ่งเหล่านี้เป็น Cash Equivalents ทั้งหมด ไม่ใช่ Cash' ควรแก้ความเข้าใจอย่างไร?", "Correct": "ตามนิยามในสไลด์ เช็คของลูกค้า Cashier's Checks และ Money Orders เป็นตัวอย่างสิ่งที่นับรวมใน Cash", "Wrong 1": "ถูกต้อง เพราะ Cash ต้องเป็นธนบัตรและเหรียญในมือเท่านั้น", "Wrong 2": "ถูกต้อง เพราะสิ่งที่ธนาคารออกให้ทุกประเภทเป็น Investments ที่มีความเสี่ยงสูง", "Wrong 3": "ไม่ถูกต้อง เพราะรายการเหล่านี้ต้องเป็น Merchandise Inventory ก่อนเสมอ", "Explanation": "นิยาม Cash ในสไลด์รวมเงินตรา เงินฝาก ตลอดจนเช็คลูกค้า แคชเชียร์เช็ค เช็ครับรองและ Money Orders (สไลด์ 8)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258186932bf1d8ae7e9042", "Question": "ในวันปิดตรวจนับสินค้า มีการนับสองรอบโดยพนักงานที่แยกจากผู้ดูแลคลังแล้ว แต่ผู้จัดการไม่ตรวจสอบว่าทุกโซนถูกนับครบก่อนรับยอด final ตามหลัก Internal Controls and Taking a Physical Count จุดอ่อนของกระบวนการคืออะไร?", "Correct": "ขาดการยืนยันของหัวหน้าหรือผู้จัดการว่าทุกรายการและทุกพื้นที่สินค้าถูกนับครบ", "Wrong 1": "การนับสองครั้งทำให้ระบบควบคุมไม่มีประโยชน์เสมอ", "Wrong 2": "ต้องให้ผู้ดูแลคลังเป็นผู้ตรวจนับคนเดียวเพื่อให้รับผิดชอบผล", "Wrong 3": "ต้องยกเลิกบัตรตรวจนับล่วงหน้าทุกใบหลังนับครั้งแรก", "Explanation": "สไลด์ระบุให้มีการนับซ้ำและให้หัวหน้างานตรวจยืนยันว่าสินค้าทุกชิ้นถูกนับครบ การนับสองรอบอย่างเดียวไม่แทนการควบคุมความครบถ้วนได้ (สไลด์ 7)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125818f821eced38513b4e1", "Question": "ผู้บริหารคิดว่า AIS เป็นแค่ระบบสร้างงบการเงินประจำปี ทั้งที่ฝ่ายขายต้องการข้อมูลการขายและฝ่ายภาษีต้องการรายงานประจำงวด ข้อใดสะท้อนหน้าที่ของ AIS ได้ถูกต้องและครบกว่า?", "Correct": "รวบรวมและประมวลผลข้อมูลธุรกรรมเพื่อออกรายงานทางการเงิน รายงานบริหาร และรายงานภาษีให้ผู้ใช้ต่างกลุ่ม", "Wrong 1": "ใช้เก็บเฉพาะบัญชีเงินสดโดยไม่เกี่ยวกับการตัดสินใจผู้บริหาร", "Wrong 2": "ทำหน้าที่เป็นเครื่องพิมพ์รายงานเท่านั้นโดยไม่รับข้อมูลต้นทาง", "Wrong 3": "เปลี่ยนธุรกรรมทุกชนิดเป็นการขายเงินสดเพื่อให้ข้อมูลสรุปง่าย", "Explanation": "AIS รวมคน บันทึก วิธีการ และอุปกรณ์เพื่อรับข้อมูลธุรกรรมและผลิตรายงานด้านการเงิน การบริหาร และภาษีแก่ผู้ใช้ (สไลด์ 2–4)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125819392a5e359552760e7", "Question": "บริษัทขนาดเล็กพิจารณา Online Processing ที่ปรับปรุงฐานข้อมูลทันที เทียบกับ Batch Processing ที่ปรับปรุงเป็นช่วง ๆ ผู้บริหารควรตระหนักถึง Trade-off ใดตามสไลด์เมื่อเลือก Online Processing?", "Correct": "ได้ข้อมูลทันเวลาและฐานข้อมูลอัปเดตเร็ว แต่โดยทั่วไปต้องลงทุนซอฟต์แวร์หรือฮาร์ดแวร์มากขึ้น", "Wrong 1": "Online Processing ไม่ต้องมีเอกสารต้นทางหรืออุปกรณ์รับข้อมูลใด ๆ", "Wrong 2": "Batch Processing ต้องอัปเดตฐานข้อมูลทุกรายการทันทีเสมอ จึงเร็วกว่า Online ทุกกรณี", "Wrong 3": "Online Processing ทำให้หนี้สูญทุกประเภทเปลี่ยนเป็นรายได้โดยอัตโนมัติ", "Explanation": "Online Processing มีจุดเด่นด้านความทันเวลา แต่สไลด์ระบุว่ามักต้องจ่ายค่าใช้จ่ายซอฟต์แวร์และฮาร์ดแวร์เพิ่มเติม (สไลด์ 19)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581b78a9fead5cd3308d6", "Question": "กิจการมีสินค้าที่เป็นกรรมสิทธิ์และอยู่ในคลัง 70,000 บาท สินค้าที่ตนส่งฝากขายไว้กับตัวแทนยังไม่ขาย 13,000 บาท และสินค้าในระหว่างขนส่งที่กิจการขายแบบ FOB Destination แต่ผู้ซื้อยังไม่ได้รับ 5,000 บาท นอกจากนี้มีสินค้าซื้อเข้าแบบ FOB Destination ระหว่างขนส่ง 9,000 บาทและสินค้าที่ตนรับฝากขายจากผู้อื่น 4,000 บาท โดยไม่มีรายการอื่นและทุกมูลค่าที่ระบุเป็นต้นทุน กิจการควรนับรวมสินค้าคงเหลือปลายงวดเท่าใด?", "Correct": "88,000 บาท", "Wrong 1": "101,000 บาท", "Wrong 2": "83,000 บาท", "Wrong 3": "92,000 บาท", "Explanation": "รวมสินค้าที่กิจการเป็นเจ้าของ: ในคลัง 70,000 + ฝากขาย 13,000 + ขาย FOB Destination ที่ยังส่งไม่ถึง 5,000 = 88,000 บาท ไม่รวมซื้อแบบ FOB Destination ที่ยังไม่ถึงและสินค้าฝากขายของผู้อื่น (สไลด์ 2–4)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581bcbd1ce64d32ca065d", "Question": "ระบบรับเช็คทางไปรษณีย์ให้พนักงานเปิดซองสองคนและแยกคนฝากเงินจากคนบันทึกบัญชี แต่ตรวจพบว่าบุคคลสองคนร่วมมือปลอมรายงานเพื่อขโมยเช็ค ความเสี่ยงนี้สะท้อนข้อจำกัดใดของการควบคุมภายใน?", "Correct": "การสมรู้ร่วมคิดของพนักงาน (Collusion) อาจทำให้การแบ่งหน้าที่ซึ่งปกติช่วยลดการทุจริตถูกหลบเลี่ยงได้", "Wrong 1": "การแบ่งหน้าที่ทำให้บุคคลทุจริตไม่ได้โดยเด็ดขาดแม้จะสมรู้ร่วมคิด", "Wrong 2": "การใช้เช็คทางไปรษณีย์ทำให้เกิดรายได้ดอกเบี้ยเสมอ", "Wrong 3": "การรับเงินผ่านไปรษณีย์ต้องบันทึกเป็นเงินสดย่อยโดยไม่แยกหน้าที่", "Explanation": "สไลด์กล่าวว่าการมีผู้เปิดจดหมายสองคนและแยกหน้าที่ช่วยลดการทุจริต แต่การสมรู้ร่วมคิดระหว่างผู้ปฏิบัติงานยังเป็นข้อยกเว้นที่อาจเอาชนะระบบได้ (สไลด์ 12)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581e8890bde29d0a1c2f1", "Question": "บริษัทขายสินค้าเป็นเงินเชื่อในปีที่ 1 แต่เพิ่งทราบแน่ว่าลูกหนี้เก็บไม่ได้ในปีที่ 2 และจึงบันทึก Bad Debts Expense ในปีที่ 2 ตาม Direct Write-Off Method จุดอ่อนสำคัญของแนวทางนี้เมื่อเทียบกับ Allowance Method คืออะไร?", "Correct": "ค่าใช้จ่ายหนี้สูญอาจไม่ถูกจับคู่กับรายได้ขายในงวดที่สร้างลูกหนี้ ทำให้กำไรของงวดต่าง ๆ บิดเบือนได้", "Wrong 1": "Direct Write-Off รับรู้หนี้สูญก่อนขายสินค้าเสมอ", "Wrong 2": "Allowance Method ไม่อนุญาตให้แสดงลูกหนี้สุทธิในงบการเงิน", "Wrong 3": "Direct Write-Off ทำให้ลูกหนี้ทุกคนกลายเป็นตั๋วเงินรับทันที", "Explanation": "Direct Write-Off รอรับรู้เมื่อรู้ว่ารายใดเก็บไม่ได้ ซึ่งอาจเป็นคนละงวดกับการขาย ขณะที่ Allowance Method ประมาณค่าใช้จ่ายในงวดของยอดขายที่เกี่ยวข้อง (สไลด์ 10, 12)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581178633cc75d0d91999", "Question": "บริษัทนำเข้าสินค้าเพื่อจำหน่ายและมีค่าใช้จ่ายหลายรายการ หากสินค้ามาถึงสถานที่ขายในสภาพพร้อมขายแล้ว รายการใดไม่ควรนำไปรวมเป็นต้นทุนสินค้าคงเหลือตามหลักการ 'ค่าใช้จ่ายจำเป็นเพื่อให้สินค้าอยู่ในสถานที่และสภาพพร้อมขาย'?", "Correct": "ค่าโฆษณาประชาสัมพันธ์เพื่อกระตุ้นยอดขายหลังจากสินค้าพร้อมขายแล้ว", "Wrong 1": "ภาษีนำเข้าที่ต้องจ่ายเพื่อให้สินค้าเข้ามาจำหน่ายได้", "Wrong 2": "ค่าประกันสินค้าระหว่างการขนส่งมายังสถานที่ขาย", "Wrong 3": "ค่าขนส่งเข้าเพื่อเคลื่อนสินค้ามายังสถานที่ขาย", "Explanation": "ต้นทุนสินค้ารวมค่าใช้จ่ายจำเป็นเพื่อให้สินค้าอยู่ในสถานที่และสภาพพร้อมขาย เช่น ภาษีนำเข้า ค่าขนส่งเข้าและประกันขนส่ง แต่ค่าโฆษณาหลังพร้อมขายไม่ใช่ค่าใช้จ่ายเพื่อวัตถุประสงค์นั้น (สไลด์ 6)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258138b636c98484e2906d", "Question": "บริษัทรับเช็คจากลูกค้าทางไปรษณีย์ มีเจ้าหน้าที่เปิดจดหมายและทำรายการรับเงินแยกจากฝ่ายฝากธนาคารและฝ่ายบันทึกบัญชี แต่กลับมอบหมายให้แคชเชียร์ผู้ฝากเงินเป็นคนกระทบยอดธนาคารเอง ขั้นตอนใดควรปรับปรุงเพื่อให้ตรวจจับความผิดปกติได้ดีขึ้น?", "Correct": "ให้บุคคลอิสระที่ไม่ถือเงินสดหรือบันทึกเงินรับเป็นผู้กระทบยอดธนาคารกับรายการจากแต่ละฝ่าย", "Wrong 1": "ให้แคชเชียร์เป็นผู้ทำทั้งรายการรับเช็คและบันทึกลูกหนี้เพิ่มด้วย เพื่อลดขั้นตอนส่งเอกสาร", "Wrong 2": "ให้ผู้บันทึกบัญชีไม่ต้องรับสำเนารายการเช็ค เพื่อป้องกันข้อมูลซ้ำ", "Wrong 3": "หยุดการกระทบยอดธนาคาร หากยอดรวมเงินรับของเจ้าหน้าที่เปิดจดหมายตรงกับยอดที่แคชเชียร์แจ้ง", "Explanation": "การแยกผู้เปิดจดหมาย ผู้ฝากเงิน ผู้บันทึกบัญชี และผู้กระทบยอดธนาคารช่วยให้ตรวจทานข้อมูลข้ามกันและเปิดเผยความคลาดเคลื่อนหรือการทุจริตได้ (สไลด์ 12)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581729544e83ed64cd985", "Question": "กิจการมีลูกหนี้การค้าที่ครบกำหนดชำระแล้ว แต่ลูกค้าขอขยายเวลาโดยลงนามในตั๋วสัญญาใช้เงินที่ระบุเงินต้น อัตราดอกเบี้ย และวันครบกำหนดชัดเจน หากต้องบันทึกเฉพาะการรับตั๋วเงินแทนยอดลูกหนี้เดิม (ไม่ใช่การขายใหม่และยังไม่มีการรับเงินสด) รายการใดถูกต้อง?", "Correct": "เดบิต Notes Receivable; เครดิต Accounts Receivable ตามเงินต้นของลูกหนี้ที่เปลี่ยนเป็นตั๋ว", "Wrong 1": "เดบิต Cash; เครดิต Sales ตามเงินต้นของลูกหนี้เดิม", "Wrong 2": "เดบิต Accounts Receivable; เครดิต Notes Receivable ตามเงินต้นของลูกหนี้เดิม", "Wrong 3": "เดบิต Interest Revenue; เครดิต Notes Receivable ตามเงินต้นทั้งหมดก่อนที่ดอกเบี้ยจะเกิดขึ้น", "Explanation": "ตั๋วสัญญาใช้เงินสามารถใช้แทนลูกหนี้การค้าเมื่อขยายเวลาชำระหนี้ได้ จึงเปลี่ยนประเภทสินทรัพย์จาก Accounts Receivable เป็น Notes Receivable โดยยังไม่มีเงินสดหรือรายได้ขายใหม่ (สไลด์ 26, 29)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581918bb8cad1aee30309", "Question": "บริษัทขายสินค้าออนไลน์และพบว่าไฟล์เอกสารที่ดูเหมือนปกติถูกแนบโปรแกรมอันตรายซึ่งแพร่ไปทำลายไฟล์และโปรแกรมอื่นในระบบ ตามความเสี่ยง E-Commerce ในบทเรียน เหตุการณ์นี้จัดเป็นประเภทใด?", "Correct": "Computer virus ที่แฝงตัวในไฟล์แล้วแพร่ไปสร้างความเสียหายกับข้อมูลหรือโปรแกรมอื่น", "Wrong 1": "Impersonation online ซึ่งเป็นการปลอมตัวเพื่อทำธุรกรรมในชื่อผู้อื่น", "Wrong 2": "Cash over and short ซึ่งเป็นส่วนต่างระหว่างเงินสดจริงกับเครื่องคิดเงิน", "Wrong 3": "Outstanding check ซึ่งเป็นเช็คที่กิจการออกแต่ธนาคารยังไม่ตัดบัญชี", "Explanation": "Computer virus เป็นโปรแกรมที่แนบกับไฟล์ที่ดูปกติและแพร่ไปทำอันตรายแก่ไฟล์หรือโปรแกรมอื่น เป็นความเสี่ยงหนึ่งของ E-Commerce (สไลด์ 4)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581969711f787a273965b", "Question": "บริษัทใช้ Aging of Receivables โดยเคยกำหนดอัตราคาดว่าจะเก็บไม่ได้ของแต่ละช่วงอายุหนี้ไว้หลายปีก่อน ต่อมาเศรษฐกิจและประวัติการชำระหนี้ของลูกค้าเปลี่ยนไปมาก แต่ผู้จัดการยังต้องการใช้เปอร์เซ็นต์เดิมโดยไม่ทบทวน ข้อใดเป็นแนวทางที่เหมาะสมที่สุด?", "Correct": "ทบทวนอัตราคาดว่าจะเก็บไม่ได้ของแต่ละกลุ่มให้สะท้อนข้อมูลประสบการณ์และสภาพเศรษฐกิจล่าสุด", "Wrong 1": "ใช้เปอร์เซ็นต์เดิมตลอดไป เพราะ Aging ห้ามเปลี่ยนอัตราหลังตั้งครั้งแรก", "Wrong 2": "เปลี่ยนเป็นอัตราเดียวกันทุกช่วงอายุหนี้ เพราะการแยกกลุ่มไม่เกี่ยวกับความเสี่ยง", "Wrong 3": "งดตั้ง Allowance for Doubtful Accounts จนกว่าจะทราบชื่อลูกหนี้ทุกรายที่ไม่ชำระแน่นอน", "Explanation": "วิธี Aging ใช้อัตราเสี่ยงตามกลุ่มอายุหนี้ ซึ่งควรทบทวนเปอร์เซ็นต์ให้สะท้อนการเปลี่ยนแปลงของกิจการและเศรษฐกิจเพื่อประเมินยอดเผื่อที่เหมาะสม (สไลด์ 21–22)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581e28d9fc8261c5365e8", "Question": "กิจการใช้ Sales Journal แบบหลายคอลัมน์สำหรับการขายสินค้าเป็นเงินเชื่อ โดยมีคอลัมน์ Accounts Receivable, Sales และ Sales Taxes Payable ระหว่างเดือนต้องการให้ยอดลูกหนี้รายบุคคลทันสมัย แต่ยังไม่ถึงเวลาผ่านยอดรวมเข้าบัญชีแยกประเภททั่วไป วิธีผ่านรายการใดสอดคล้องกับสไลด์ที่สุด?", "Correct": "ผ่านรายการลูกหนี้แต่ละรายเข้าบัญชีย่อยทันที และผ่านยอดรวมคอลัมน์ Sales กับ Sales Taxes Payable เมื่อสิ้นงวด", "Wrong 1": "ผ่านภาษีขายแต่ละรายการเข้าบัญชีแยกประเภททั่วไปทันที แต่รอลูกหนี้รายบุคคลจนสิ้นงวด", "Wrong 2": "ผ่านยอดขายแต่ละรายการเข้าบัญชีคุม Sales ซ้ำอีกครั้งเมื่อสิ้นงวด เพื่อให้มีหลักฐานสองชุด", "Wrong 3": "งดผ่านรายการลูกหนี้รายบุคคลทั้งหมด เพราะบันทึกยอดรวมคอลัมน์ Accounts Receivable ก็เพียงพอ", "Explanation": "สไลด์ให้ผ่าน Accounts Receivable รายลูกค้าไปบัญชีย่อยทันทีเพื่อให้ยอดทันสมัย ส่วนยอดรวมคอลัมน์ Sales และ Sales Taxes Payable ผ่านเข้าบัญชีทั่วไปเมื่อสิ้นงวด (สไลด์ 8, 10)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581e9bd8cead4e64ace2a", "Question": "บริษัทเชื่อมคอมพิวเตอร์ของพนักงานในหลายแผนกให้ใช้ฐานข้อมูลและเครื่องพิมพ์ส่วนกลางร่วมกัน แต่ยังไม่ได้เชื่อมกระบวนการรับคำสั่งซื้อ การผลิต และการบัญชีเป็นระบบบริหารงานแบบเดียวกัน ลักษณะใดอธิบายสิ่งที่บริษัทมีได้ตรงที่สุด?", "Correct": "Computer network ที่ให้ผู้ใช้หลายคนเข้าถึงฐานข้อมูล โปรแกรม และอุปกรณ์ร่วมกัน", "Wrong 1": "ERP ที่บูรณาการกระบวนการสำคัญตั้งแต่รับคำสั่งซื้อจนถึงผลิตและบัญชีแล้ว", "Wrong 2": "Batch processing เพราะเครื่องคอมพิวเตอร์ทุกเครื่องต้องรอประมวลผลพร้อมกันตอนสิ้นวัน", "Wrong 3": "Output device เพราะเครือข่ายมีหน้าที่เพียงพิมพ์รายงานเท่านั้น", "Explanation": "Computer network เชื่อมคอมพิวเตอร์เพื่อแชร์ข้อมูล โปรแกรม และอุปกรณ์ ส่วน ERP เป็นการบริหารและบูรณาการกระบวนการสำคัญของกิจการ ซึ่งโจทย์ระบุว่ายังไม่ได้ทำ (สไลด์ 20–21)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581f198d0c657bb66b0d3", "Question": "กิจการกำหนดให้จ่ายค่าใช้จ่ายส่วนใหญ่ด้วยเช็ค แต่เก็บเช็คเปล่าที่ไม่ได้ลงนามไว้ในตู้ซึ่งพนักงานทุกคนเปิดได้ ผู้ตรวจสอบควรชี้ข้อบกพร่องใดเป็นหลักและแนะนำการควบคุมใด?", "Correct": "จำกัดการเข้าถึงเช็คให้เฉพาะผู้ที่มีอำนาจลงนามหรือผู้ได้รับอนุญาต เพื่อป้องกันการจ่ายเงินโดยมิชอบ", "Wrong 1": "ให้พนักงานทุกคนลงนามเช็คได้ เพราะทำให้ตรวจสอบผู้จ่ายเงินได้ง่ายขึ้น", "Wrong 2": "เลิกใช้หมายเลขเช็ค เพราะหมายเลขต่อเนื่องทำให้การตรวจสอบยุ่งยาก", "Wrong 3": "เปิดตู้เก็บเช็คตลอดเวลา แต่เพิ่มยอดเงินสดย่อยแทนการควบคุมเช็ค", "Explanation": "การควบคุมการจ่ายเงินสดกำหนดให้ใช้เช็คสำหรับรายการทั่วไปและจำกัดผู้ที่เข้าถึงเช็คไว้เฉพาะผู้มีสิทธิ์ลงนามหรือได้รับอนุญาต (สไลด์ 13)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581fb90e0ee17829d08f6", "Question": "ระบบบัญชีรับใบแจ้งหนี้ผ่านเครื่องสแกนแล้วเก็บต้นฉบับไว้ แต่พบธุรกรรมผิดปกติที่นักบัญชีต้องใช้ดุลยพินิจตีความ จัดหมวดหมู่ และสรุปให้ผู้บริหารก่อนออกรายงาน กิจกรรมที่ใช้ดุลยพินิจนี้เป็นบทบาทสำคัญขององค์ประกอบใดใน AIS?", "Correct": "Information processors ที่ตีความ แปลง และสรุปข้อมูลเพื่อใช้วิเคราะห์และรายงาน", "Wrong 1": "Source documents ที่ทำหน้าที่เป็นหลักฐานตั้งต้นของธุรกรรมเท่านั้น", "Wrong 2": "Input devices ที่รับข้อมูลจากเอกสารเข้าสู่ระบบเท่านั้น", "Wrong 3": "Output devices ที่แสดงผลหรือพิมพ์รายงานให้ผู้ใช้เท่านั้น", "Explanation": "Information processors ตีความ แปลง และสรุปข้อมูล โดยดุลยพินิจทางวิชาชีพเป็นองค์ประกอบสำคัญของงานประมวลผลข้อมูลบัญชี (สไลด์ 3)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581fba5e9d29058415442", "Question": "ณ วันสิ้นงวด ร้านค้ามีรายการต่อไปนี้: A สินค้าของร้านที่ส่งให้ตัวแทนฝากขายและยังขายไม่ออก, B สินค้าที่ผู้อื่นนำมาฝากขายไว้ในร้าน, C สินค้าที่ร้านซื้อแบบ FOB Destination ซึ่งยังอยู่ระหว่างทาง, D สินค้าของร้านที่ชำรุดแต่ยังขายได้ในราคาลดลง รายการใดควรรวมในสินค้าคงเหลือของร้าน โดยพิจารณามูลค่าของสินค้าที่ชำรุดตามเกณฑ์ที่เหมาะสม?", "Correct": "A และ D", "Wrong 1": "A และ C", "Wrong 2": "B และ D", "Wrong 3": "B และ C", "Explanation": "A ยังเป็นกรรมสิทธิ์ของผู้ฝากขาย และ D ยังเป็นสินค้าของร้านแม้อาจต้องลดมูลค่าเป็น NRV; B เป็นของผู้ฝากรายอื่น ส่วน C แบบ FOB Destination ยังเป็นกรรมสิทธิ์ผู้ขายจนถึงปลายทาง (สไลด์ 2–5)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258119980fe8e50159b053", "Question": "ผู้บริหารถามว่าทำไมกิจการยังขายเชื่อทั้งที่ทราบว่าลูกหนี้บางรายอาจกลายเป็นหนี้สูญ เหตุผลทางเศรษฐกิจของการให้เครดิตตามบทเรียนคือข้อใด?", "Correct": "คาดว่าการให้เครดิตจะเพิ่มยอดขายและกำไรสุทธิมากพอที่จะชดเชยต้นทุนหนี้สูญที่อาจเกิดขึ้น", "Wrong 1": "เพราะการให้เครดิตรับประกันว่าลูกหนี้ทุกรายจะจ่ายครบโดยไม่ต้องติดตาม", "Wrong 2": "เพราะการขายเชื่อไม่ต้องรับรู้รายได้หรือค่าใช้จ่ายหนี้สูญใด ๆ", "Wrong 3": "เพราะหนี้สูญทุกบาทสามารถนำมาลดจำนวนสินค้าได้โดยไม่มีผลต่อกำไร", "Explanation": "สไลด์อธิบายว่ากิจการให้เครดิตเพราะคาดว่าจะเพิ่มยอดขายและกำไรสุทธิมากพอชดเชยหนี้สูญที่เป็นต้นทุนของการขายเชื่อ (สไลด์ 9)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581219149ceb7d1655214", "Question": "กิจการให้พนักงานที่ถือเงินสดและบันทึกบัญชีเป็นคนตรวจสอบรายการรับจ่ายเงินสดของตนเองทุกเดือนด้วย ผู้บริหารควรปรับรูปแบบการทบทวนอย่างไรตามหลักควบคุมภายใน?", "Correct": "ให้ผู้ที่เป็นอิสระจากการดูแลเงินและการบันทึกบัญชีเป็นผู้ตรวจสอบรายการเป็นระยะ", "Wrong 1": "ให้ผู้ดูแลเงินเป็นผู้รับรองผลตรวจของตนเองโดยไม่ต้องมีบุคคลอื่น", "Wrong 2": "หยุดตรวจสอบทั้งหมดเพราะมีการบันทึกบัญชีแล้ว", "Wrong 3": "เปลี่ยนบัญชี Cash เป็น Inventory เพื่อป้องกันการรับเงินซ้ำ", "Explanation": "หลักการควบคุมภายในแนะนำให้แบ่งแยกหน้าที่และมีการตรวจทานอย่างสม่ำเสมอโดยบุคคลที่เป็นอิสระจากงานที่ตรวจ (สไลด์ 3)", "Chapter": "08 Cash", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f029841258149a061db283238a855", "Question": "บริษัทมีต้นทุนขายประจำปี 720,000 บาท สินค้าคงเหลือปลายแต่ละไตรมาส 60,000, 140,000, 100,000 และ 60,000 บาท ตามลำดับ โดยต้องการใช้ค่าเฉลี่ยง่ายจากสินค้าคงเหลือปลายทั้ง 4 ไตรมาสแทนค่าเฉลี่ยต้น–ปลายปี Inventory Turnover ที่คำนวณได้คือเท่าใด?", "Correct": "8 ครั้ง", "Wrong 1": "12 ครั้ง", "Wrong 2": "6 ครั้ง", "Wrong 3": "10 ครั้ง", "Explanation": "สินค้าคงเหลือเฉลี่ยสี่ไตรมาส (60,000+140,000+100,000+60,000)÷4=90,000 บาท; Turnover=720,000÷90,000=8 ครั้ง (สไลด์ 33)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125814e9607e322c99867a3", "Question": "ผู้จัดการมีผลดำเนินงานสอง Segment โดยส่วนงานหนึ่งมีกำไรเป็นจำนวนเงินสูงกว่าแต่ต้องใช้สินทรัพย์สูงมาก ส่วนงานอีกแห่งมีกำไรน้อยกว่าแต่ใช้สินทรัพย์ต่ำ หากต้องการเปรียบเทียบความสามารถใช้สินทรัพย์สร้างกำไร ควรพิจารณาตัวชี้วัดใด?", "Correct": "Segment Return on Assets = กำไรจากการดำเนินงานของส่วนงาน ÷ สินทรัพย์เฉลี่ยของส่วนงาน", "Wrong 1": "ยอดกำไรของส่วนงานเพียงอย่างเดียวโดยไม่ดูสินทรัพย์", "Wrong 2": "จำนวนพนักงานของส่วนงานเป็นตัววัดผลตอบแทนสินทรัพย์โดยตรง", "Wrong 3": "ยอดรับเงินสดจากลูกค้าส่วนงานหารด้วยค่าใช้จ่ายโฆษณาของส่วนงาน", "Explanation": "Segment ROA เทียบกำไรดำเนินงานกับสินทรัพย์เฉลี่ยของส่วนงาน จึงสะท้อนประสิทธิภาพการใช้สินทรัพย์มากกว่าดูจำนวนกำไรล้วน (สไลด์ 22–23)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125816d8890f52faf0b89a5", "Question": "บริษัทใช้ Cash Receipts Journal ภายใต้ Perpetual และขายสินค้าเป็นเงินสด พนักงานบันทึก Cash Dr. และ Sales Cr. แล้วแต่ไม่บันทึกต้นทุนสินค้าที่ขาย ข้อใดชี้รายการที่ยังขาดได้ตรงที่สุด?", "Correct": "ยังต้องบันทึก Cost of Goods Sold Dr. และ Inventory Cr. ตามต้นทุนสินค้าที่ขาย", "Wrong 1": "ยังต้องบันทึก Accounts Receivable Dr. และ Sales Cr. อีกครั้งเพื่อรับรู้ยอดขายซ้ำ", "Wrong 2": "ต้องเดบิต Inventory เพิ่มเท่ากับราคาขายแม้สินค้าออกจากคลัง", "Wrong 3": "ต้องเครดิต Cash เพิ่มเท่ากับยอดขายเพื่อปิดรายการรับเงินสด", "Explanation": "Cash Receipts Journal ภายใต้ Perpetual บันทึกทั้งยอดขายเงินสดและต้นทุนสินค้าที่ขาย จึงต้องสะท้อนต้นทุนขายกับสินค้าคงเหลือด้วย (สไลด์ 12)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125817bb4edcb224aaacd5c", "Question": "จากตัวอย่าง Trekking ในสไลด์ Chapter 06 บริษัทขายจักรยานวันที่ 14 สิงหาคม 20 คันในราคาคันละ 130 ดอลลาร์ และวันที่ 31 สิงหาคม 23 คันในราคาคันละ 150 ดอลลาร์ เมื่อใช้ Specific Identification ต้นทุนขายสองครั้งเป็น 2,000 และ 2,582 ดอลลาร์ตามลำดับ ไม่มีการคืนสินค้าหรือค่าใช้จ่ายอื่น กำไรขั้นต้นของยอดขายสองครั้งรวมกันเท่าใด?", "Correct": "1,468 ดอลลาร์", "Wrong 1": "6,050 ดอลลาร์", "Wrong 2": "4,582 ดอลลาร์", "Wrong 3": "1,050 ดอลลาร์", "Explanation": "รายได้ขาย 20×130+23×150=6,050 ดอลลาร์ ต้นทุนขายเฉพาะชิ้น 2,000+2,582=4,582 ดอลลาร์ กำไรขั้นต้น 1,468 ดอลลาร์ (สไลด์ 12–14)", "Chapter": "06 Inventory", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f02984125819cb4f2ffb5af17962b", "Question": "บริษัทขายสิทธิเรียกเก็บลูกหนี้การค้า 120,000 บาทให้ Factor โดยโอนความเป็นเจ้าของและความเสี่ยงหนี้สูญทั้งหมดตามเงื่อนไข ตัวแทนหักค่าธรรมเนียม Factoring 3% และโอนส่วนที่เหลือเป็นเงินสดทันที ไม่มีค่าใช้จ่ายอื่น กิจการได้รับเงินสดสุทธิเท่าใด?", "Correct": "116,400 บาท", "Wrong 1": "120,000 บาท", "Wrong 2": "3,600 บาท", "Wrong 3": "123,600 บาท", "Explanation": "ค่าธรรมเนียม Factoring = 120,000×3%=3,600 บาท เงินสดรับสุทธิ 120,000−3,600=116,400 บาท (สไลด์ 34)", "Chapter": "09 Receivables", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581a4a8f3f82b19bd50b4", "Question": "กิจการซื้อสินค้าคงเหลือเป็นเงินเชื่อและบันทึกผ่าน Purchases Journal เมื่อผู้ตรวจพบว่าไม่มีการเก็บวันที่ใบแจ้งหนี้และเงื่อนไขเครดิต ผลกระทบสำคัญข้อใดเกิดขึ้นกับการติดตามเจ้าหนี้?", "Correct": "อาจคำนวณวันครบกำหนดชำระหนี้แต่ละรายได้ไม่ถูกต้องเพราะขาดวันที่และเงื่อนไขจากใบแจ้งหนี้", "Wrong 1": "ทำให้รายการซื้อเชื่อกลายเป็นการซื้อเงินสดทันทีทั้งหมด", "Wrong 2": "ทำให้ไม่ต้องมีบัญชีคุมยอด Accounts Payable อีกต่อไป", "Wrong 3": "ทำให้สินค้าที่ซื้อเชื่อกลายเป็นสินค้าฝากขายของผู้จำหน่ายเสมอ", "Explanation": "Purchases Journal ใช้วันที่ใบแจ้งหนี้และเงื่อนไขการซื้อเพื่อคำนวณวันถึงกำหนดชำระให้เจ้าหนี้แต่ละราย (สไลด์ 14)", "Chapter": "07 AIS", "Subject": "Accounting", "Status": "Verified"}, {"url": "https://app.notion.com/p/412f0298412581f8a943ef86fe6342d1", "Question": "บริษัทมีข้อมูลการขายนับแสนรายการและปรับไปใช้ระบบบัญชีอิเล็กทรอนิกส์ ข้อได้เปรียบด้านการตรวจสอบตามสไลด์ที่เกิดจากการเข้าถึงข้อมูลอย่างรวดเร็วคือข้อใด?", "Correct": "สามารถทดสอบรายการและข้อมูลอิเล็กทรอนิกส์ได้กว้างขึ้นกว่าการสุ่มตรวจเอกสารกระดาษด้วยมืออย่างจำกัด", "Wrong 1": "ไม่จำเป็นต้องมีผู้ตรวจสอบหรือการแบ่งหน้าที่
