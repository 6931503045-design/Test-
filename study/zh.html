<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ศัพท์จีน บท 1–10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: tabbed study sheet (cards / summary / practice) in one centred column. */
:root{
  --paper:#f8f1ec; --surface:#ffffff; --ink:#1a2320; --muted:#5b6a64; --line:#d3dcd7;
  --accent:#b3392b; --accent-soft:#f6dcd6; --known:#e6f2d5; --ok:#1c7c4a; --ok-soft:#e2f3e9; --bad:#b3261e; --bad-soft:#fbe6e4;
  --ui:"IBM Plex Sans Thai","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12171a; --surface:#1b2226; --ink:#e7eeea; --muted:#9db0a8; --line:#2d3a40;
  --accent:#f08a7a; --accent-soft:#3d1f1a; --known:#26331c; --ok:#62d394; --ok-soft:#15301f; --bad:#ff8a80; --bad-soft:#3b1c1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12171a; --surface:#1b2226; --ink:#e7eeea; --muted:#9db0a8; --line:#2d3a40;
  --accent:#f08a7a; --accent-soft:#3d1f1a; --known:#26331c; --ok:#62d394; --ok-soft:#15301f; --bad:#ff8a80; --bad-soft:#3b1c1a; color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16.5px;line-height:1.65}
.wrap{max-width:800px;margin:0 auto;padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:baseline;gap:6px 16px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:clamp(26px,6vw,36px);line-height:1.15;margin:0;font-weight:700;text-wrap:balance}
header span{color:var(--muted);font-size:15px}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{font:inherit;font-weight:500;background:none;border:0;color:var(--muted);padding:10px 14px;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font:inherit;font-size:14.5px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{font-family:var(--mono);font-size:11.5px;opacity:.75;margin-left:5px}
.controls{justify-content:space-between;margin:12px 0 16px}
.count{color:var(--muted);font-size:14px;font-family:var(--mono)}
.stage{perspective:1400px}
.card{position:relative;width:100%;height:clamp(300px,64vw,380px);cursor:pointer;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);border-radius:10px}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:34px 22px 30px;text-align:center;overflow:auto}
.back{transform:rotateY(180deg)}
.card.is-known .face{background:var(--known)}
.cat-tag{position:absolute;top:10px;left:14px;font-size:12.5px;color:var(--muted)}
.hint{position:absolute;bottom:10px;left:0;right:0;font-size:12.5px;color:var(--muted)}
.front-t.big{font-size:clamp(40px,11vw,60px);line-height:1.2}
.front-t{font-size:clamp(21px,5vw,28px);font-weight:700;line-height:1.4;text-wrap:balance}
.back-t{font-size:clamp(17px,4vw,21px);line-height:1.7;max-width:34em}
.back-t b{color:var(--accent)}
.nav{justify-content:center;margin-top:16px;gap:10px}
.btn{font:inherit;font-weight:500;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 18px;cursor:pointer;min-width:46px}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.know[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.ref{position:absolute;bottom:10px;left:0;right:0;font:500 12px var(--mono);color:var(--accent)}
.btn.no{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.btn.yes{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.sync{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:10px;background:var(--accent-soft);margin-top:16px}
.sync p{margin:0;font-size:15px}.sync .ok{color:var(--ok)}.sync .err{color:var(--bad)}
.srs{gap:14px;font:600 14px var(--mono);margin:4px 0 12px}
.srs .n{color:#2f6fd0}.srs .l{color:var(--bad)}.srs .d{color:var(--ok)}
.srs b{font-size:18px;margin-right:3px}
.rate4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.rate4 .btn{display:flex;flex-direction:column;gap:2px;padding:9px 4px;min-width:0;font-size:15px}
.rate4 .btn small{font:500 12px var(--mono);opacity:.85}
.rate4 .r1{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.rate4 .r2{border-color:var(--line);color:var(--ink)}
.rate4 .r3{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}
.rate4 .r4{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.show{display:none!important;width:100%;margin-top:16px;padding:13px}
.typebox{margin-top:14px}.typebox input{flex:1;min-width:0;font:inherit;font-size:18px;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.typebox input:focus{outline:3px solid var(--accent);outline-offset:1px}
.typebox p{margin:8px 0 0;font-size:16px;min-height:1.5em}.typebox .okk{color:var(--ok);font-weight:600}.typebox .nok{color:var(--bad);font-weight:600}
.rate4 .btn.sug{box-shadow:0 0 0 3px var(--accent)}
.keys{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.empty{padding:50px 20px;text-align:center;color:var(--muted)}
/* summary */
.sec{margin:0 0 26px}
.sec h2{font-size:20px;margin:0 0 8px;padding-left:12px;border-left:4px solid var(--accent);line-height:1.4}
.sec .chtag{font-family:var(--mono);font-size:12px;color:var(--accent);display:block}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;min-width:100%;background:var(--surface);font-size:15.5px}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:left;vertical-align:top;line-height:1.6}
th{background:var(--accent-soft);font-weight:700;white-space:nowrap}
td:first-child{font-weight:500;min-width:7.5em}
.tip{background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-top:10px;font-size:15px}
/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.qbar{height:4px;background:var(--line);border-radius:2px;margin-bottom:14px}
.qbar i{display:block;height:100%;background:var(--accent);width:0;border-radius:2px;transition:width .25s}
.qmeta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted);margin-bottom:8px}
.qmeta b{font-family:var(--mono);color:var(--ink)}
.qtext{font-size:18px;font-weight:500;margin:0 0 14px;line-height:1.6}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:9px;padding:10px 13px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--muted);min-width:16px;padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.6}
.explain{margin-top:14px;border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15.5px}
.explain.good{border-left-color:var(--ok)} .explain.bad{border-left-color:var(--bad)}
.explain b.v{display:block;margin-bottom:2px}
.qnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:6px}
.score .big{font-family:var(--mono);font-size:30px;font-weight:600}
.cells{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}
.cell{width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:5px;font:500 11px var(--mono);color:var(--muted);cursor:pointer;padding:0}
.cell.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.cell.no{background:var(--bad);border-color:var(--bad);color:#fff}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.card,.qbar i{transition:none}}
</style>
<div class="wrap">
  <header><h1>ศัพท์จีน บท 1–10</h1><span>ภาษาจีน · 279 คำ · แฟลชการ์ดแบบ Anki</span></header>
  <nav class="tabs" role="tablist">
    <button role="tab" aria-selected="true" data-tab="cards">แฟลชการ์ด</button>
    <button role="tab" aria-selected="false" data-tab="sum">สรุปบทเรียน</button>
    <button role="tab" aria-selected="false" data-tab="prac">แบบฝึก</button>
  </nav>
  <section id="tab-cards">
    <div class="row" id="cats"></div>
    <div class="row controls">
      <div class="row">
        <button class="chip" id="dirBtn" aria-pressed="false" type="button">ด้านหน้า: หัวข้อ</button>
        <button class="chip" id="typBtn" type="button" hidden>พิมพ์ตอบ: เปิด</button>
        <button class="chip" id="limBtn" type="button">การ์ดใหม่/วัน: 20</button>
        <button class="chip" id="resetSrs" type="button">ล้างความคืบหน้า</button>
      </div>
      <span class="count" id="count"></span>
    </div>
    <div class="row srs" id="srsCounts"></div>
    <div class="stage" id="stage"></div>
    <div id="typeBox" class="typebox" hidden>
      <div class="row"><input id="typeIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="พิมพ์คำตอบ แล้วกด Enter"><button class="btn primary" id="typeGo" type="button">ตรวจ</button></div>
      <p id="typeRes" role="status"></p>
    </div>
    <button class="btn primary show" id="showBtn" type="button" hidden>แสดงคำตอบ</button>
    <div class="rate4" id="rate4" hidden>
      <button class="btn r1" data-r="1" type="button">ลืม<small></small></button>
      <button class="btn r2" data-r="2" type="button">ยาก<small></small></button>
      <button class="btn r3" data-r="3" type="button">ปกติ<small></small></button>
      <button class="btn r4" data-r="4" type="button">ง่าย<small></small></button>
    </div>
    <p class="keys">แตะการ์ดหรือกด Space = พลิก · 1 ลืม · 2 ยาก · 3 ปกติ · 4 ง่าย</p>
    <div class="sync" id="sync" hidden><p id="syncText"></p><button class="btn yes" id="syncBtn" type="button">บันทึกผลลง Notion</button><p id="syncMsg" role="status"></p></div>
  </section>
  <section id="tab-sum" hidden>
    <div class="row" id="sumCats" style="margin-bottom:18px"></div>
    <div id="sumBody"></div>
  </section>
  <section id="tab-prac" hidden>
    <div class="row" id="qCats" style="margin-bottom:14px"></div>
    <div id="qBody"></div>
  </section>
</div>

function sched(s,r){
  const now=Date.now(); s=Object.assign({st:'learn',step:0,ease:2.5,ivl:0,lapses:0},s||{});
  const grad=ivl=>{ s.st='rev'; s.ivl=ivl; s.due=sod(now)+ivl*DAY; delete s.rl; };

    if(r===1){ s.step=0; s.due=now+LEARN[0]*MIN; }
    else if(r===2){ s.due=now+(s.step===0?6:LEARN[1])*MIN; }
    else if(r===3){ if(s.step+1<LEARN.length){ s.step++; s.due=now+LEARN[s.step]*MIN; } else grad(s.rl||1); }
    else grad(s.rl?Math.max(s.rl+1,2):4);

    if(r===1){ s.lapses++; s.ease=Math.max(1.3,s.ease-0.2); s.rl=Math.max(1,Math.round(s.ivl*0.5)); s.st='learn'; s.step=1; s.due=now+LEARN[1]*MIN; }
    else if(r===2){ s.ease=Math.max(1.3,s.ease-0.15); grad(Math.max(s.ivl+1,Math.round(s.ivl*1.2))); }
    else if(r===3){ grad(Math.max(s.ivl+1,Math.round(s.ivl*s.ease))); }
    else { s.ease+=0.15; grad(Math.max(s.ivl+1,Math.round(s.ivl*s.ease*1.3))); }
  }
  s.last=r; return s;
}

const STEPS=[1,3,7,14,30], PASS=0.8, NOTION="Notion";
let mcp=null, syncing=false, owner=false;
const todayBkk=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Bangkok"}).format(new Date());
function scopeT(){ const sc=CARDS.filter(c=>c.cat===fcat); const seen=sc.filter(c=>srs[c.mid]); const g=seen.filter(c=>srs[c.mid].last>=3).length; return {g,b:seen.length-g,n:sc.length}; }
function renderSync(){

  const t=scopeT(); if(t.n===0||t.g+t.b<t.n){ box.hidden=true; return; }

  if(!syncing) $('#syncBtn').disabled=false;

function errText(e,writing){
  switch(e&&e.code){
    case "server_not_connected": return "ยังไม่ได้เชื่อม Notion: เพิ่ม Notion ใน claude.ai Settings → Connectors แล้วลองใหม่";
    case "needs_reauth": return "การเชื่อม Notion หมดอายุ: เชื่อมใหม่ใน claude.ai Settings → Connectors";
    case "selection_required": return "มีบัญชี Notion มากกว่าหนึ่งบัญชี เลือกบัญชีที่หน้าต่างของ claude.ai แล้วกดอีกครั้ง";
    case "approval_required": case "not_in_manifest": case "consent_required": return "หน้านี้ยังไม่ได้รับอนุญาตให้ใช้ Notion กดปุ่มอีกครั้งแล้วเลือกอนุญาต";
    case "blocked_by_policy": return "องค์กรของคุณไม่อนุญาตให้ใช้ Notion จากหน้านี้";
    case "tool_error": return "Notion ปฏิเสธการบันทึก: "+(e.message||"").slice(0,160);
    case "server_unavailable": case "upstream_error": return writing?"Notion ไม่ตอบกลับ อาจบันทึกไปแล้ว เปิดหน้าบทใน Notion เพื่อตรวจก่อนกดอีกครั้ง":"ติดต่อ Notion ไม่ได้ชั่วคราว ลองกดอีกครั้งในอีกสักครู่";

  }

async function syncNotion(){
  const page=(D.pages||{})[fcat]; if(!mcp||!page||syncing) return;
  const t=scopeT(), pass=t.g/t.n>=PASS;
  syncing=true; $('#syncBtn').disabled=true;
  const msg=$('#syncMsg'); msg.className=''; msg.textContent='กำลังอ่าน Review Step ปัจจุบันจาก Notion…';
  let step=0;

    const r=await mcp.callTool(NOTION,"notion-fetch",{id:page},{cache:false});
    const p=r.payload; const text=typeof p==="string"?p:(p&&typeof p.text==="string"?p.text:JSON.stringify(p));
    const m=text.match(/\\?"Review Step\\?"\s*:\s*(\d+(?:\.\d+)?)/); if(m) step=Math.max(0,Math.round(Number(m[1])));
  }catch(e){ msg.className='err'; msg.textContent=errText(e,false); syncing=false; $('#syncBtn').disabled=false; return; }
  const next=pass?step+1:0, today=todayBkk();

  try{
    await mcp.callTool(NOTION,"notion-update-page",{page_id:page,command:"update_properties",properties:{"date:Last review:start":today,"date:Last review:is_datetime":0,"Review Step":next}});
    msg.className='ok'; msg.textContent='บันทึกแล้ว · '+catLabel(fcat)+': Last review '+today+' · Review Step '+step+' → '+next+' · ทบทวนรอบหน้าในอีก '+STEPS[Math.min(next,STEPS.length-1)]+' วัน';

  }catch(e){ msg.className='err'; msg.textContent=errText(e,true); $('#syncBtn').disabled=false; }

}

const Q_VIEW='https://app.notion.com/p/776e2eeaf73e4154812ae8e4813f9be6?v=696b7bb301874367829744d89c404695';
const unesc=s=>typeof s==='string'?s.replace(/\\([\\|$*_`~\[\]()<>#+\-.!&])/g,'$1'):s;
async function fetchRows(view){
  const out=[]; let cursor=null;
  for(let i=0;i<8;i++){
    const a={mode:'view',view_url:view,page_size:100}; if(cursor) a.start_cursor=cursor;
    const r=await mcp.callTool(NOTION,"notion-query-data-sources",{data:a},{cache:false});
    let p=r.payload; if(typeof p==="string"){ try{ p=JSON.parse(p); }catch(e){} }
    if(p&&typeof p.text==="string"){ try{ p=JSON.parse(p.text); }catch(e){} }
    if(!p||!Array.isArray(p.results)) throw new Error('bad payload');
    p.results.forEach(x=>{ if(x.Subject===SUBJ){ const y={}; for(const k in x) y[k]=unesc(x[k]); out.push(y); } });
    if(!p.has_more||!p.next_cursor) break; cursor=p.next_cursor;
  }
  return out;
}
async function loadExt(){
  if(!mcp||!SUBJ) return;
  try{
    const rows=await fetchRows(FC_VIEW);
    setExt(rows); try{ localStorage.setItem(EXT_KEY,JSON.stringify(rows)); }catch(e){}
    cardsRow(); if(!shown) renderCard();
  }catch(e){}
}

/* ---------- extra quiz questions from the Notion "Quiz" table ---------- */
const QDS='collection://21fcc8d7-5e96-4061-a02f-d71fc5705812', QKEY=D.markKey+'-extq';
function hashN(s){ let h=7; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%1000003; return h; }
function setExtQ(rows){
  for(let i=QS.length-1;i>=0;i--) if(String(QS[i].id).startsWith('n-')) QS.splice(i,1);
  (rows||[]).forEach(r=>{ if(r.Status!=='Verified') return; const hit=CATS.find(c=>c[1]===r.Chapter); if(!hit||!r.Question||!r.Correct) return;
    const opts=[r.Correct,r['Wrong 1'],r['Wrong 2'],r['Wrong 3']].filter(x=>x&&String(x).trim());
    if(opts.length<2) return;
    const id='n-'+String(r.url||r.Question).split('?')[0].split('/').pop();
    let s=hashN(id)+49297; const rn=()=>{s=(s*233280+49297)%2147483647;return s/2147483647};
    const idx=opts.map((_,k)=>k); for(let k=idx.length-1;k>0;k--){const j=Math.floor(rn()*(k+1));[idx[k],idx[j]]=[idx[j],idx[k]]}
    QS.push({id,cat:hit[0],q:r.Question,opts,exp:r.Explanation||'',order:idx,right:0}); });
}
const EMBQ=[];
try{ const _c=JSON.parse(localStorage.getItem(QKEY)||'[]'); const _m=new Map(); EMBQ.forEach(r=>_m.set(r.url,r)); _c.forEach(r=>_m.set(r.url,r)); setExtQ([..._m.values()]); buildDeck(); }catch(e){}
async function loadExtQ(){
  if(!SUBJ) return;
  if(!mcp){ qStat='ไม่ได้เชื่อม Notion — ใช้ข้อสอบที่ฝังไว้ (ข้อมูล ณ 10 พ.ย. 2026)'; qStatErr=false; renderQ(); loadStatic(); return; }
  qStat='กำลังโหลดข้อสอบจาก Notion…'; qStatErr=false; renderQ();
  let lastErr=null;
  for(let a=0;a<3;a++){
    try{
      const rows=await fetchRows(Q_VIEW);
      try{ localStorage.setItem(QKEY,JSON.stringify(rows)); }catch(e){}
      setExtQ(rows);
      const n=QS.filter(q=>String(q.id).startsWith('n-')).length;
      qStat='โหลดจาก Notion สำเร็จ · เพิ่ม '+n+' ข้อ'; qStatErr=false;
      if(qpos>=QS.length) qpos=0; buildDeck(); renderQ(); return;
    }catch(e){ lastErr=e; await new Promise(r=>setTimeout(r,2500*(a+1))); }
  }
  const n=QS.filter(q=>String(q.id).startsWith('n-')).length;
  qStat='โหลดจาก Notion ไม่สำเร็จ ('+String((lastErr&&lastErr.message)||lastErr||'').slice(0,60)+') — ใช้ข้อมูลเก่าที่เก็บไว้ '+n+' ข้อ ลองปิดแล้วเปิดใหม่';
  qStatErr=true; renderQ();
}
async function loadStatic(){
  await 0;
  if(!SUBJ) return;
  try{
    const [q,c]=await Promise.all([
      fetch('data/quiz.json',{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(r.status)),
      fetch('data/cards.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null)]);
    const rows=(q.rows||[]).filter(x=>x.Subject===SUBJ);
    setExtQ(rows); try{ localStorage.setItem(QKEY,JSON.stringify(rows)); }catch(e){}
    if(c&&c.rows){ const cr=c.rows.filter(x=>x.Subject===SUBJ); setExt(cr); try{ localStorage.setItem(EXT_KEY,JSON.stringify(cr)); }catch(e){} cardsRow(); if(!shown) renderCard(); }
    const n=QS.filter(x=>String(x.id).startsWith('n-')).length;
    qStat='โหลดจากไฟล์ข้อมูลสำเร็จ · เพิ่ม '+n+' ข้อ · อัปเดต '+(q.updated||'-'); qStatErr=false;
    if(qpos>=QS.length) qpos=0; buildDeck(); renderQ();
  }catch(e){}
}

if(!D.sum.length) document.querySelectorAll('.tabs button').forEach(b=>{ if(b.dataset.tab!=='cards') b.hidden=true; });
cardsRow(); renderCard(); renderSum(); buildDeck(); renderQ();
